<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Thinking out loud beats one leap</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">The tennis toy: 5 + 2 x 3. One leap guesses. Steps check each other.</text><rect x="32" y="96" width="420" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">one shot: 5 + 2 x 3 = ?</text><text x="56" y="168" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">model guesses:</text><rect x="56" y="184" width="48" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="80.0" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">11?</text><text x="56" y="244" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">no step to check</text><text x="56" y="268" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">a wrong guess hides</text><rect x="508" y="96" width="420" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="524" y="122" font-size="14" font-weight="600" fill="#5C6B7A">chain of thought</text><rect x="532" y="184" width="74.96000000000001" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="569.48" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">5 start</text><line x1="606.96" y1="200" x2="642.96" y2="200" stroke="#1F7A72" stroke-width="2"/><polygon points="642.96,200 633.7493900599712,203.8941834230865 633.7493900599712,196.1058165769135" fill="#1F7A72"/><rect x="650.96" y="184" width="125.92" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="713.9200000000001" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">2 cans x 3 = 6</text><line x1="776.8800000000001" y1="200" x2="812.8800000000001" y2="200" stroke="#1F7A72" stroke-width="2"/><polygon points="812.8800000000001,200 803.6693900599713,203.8941834230865 803.6693900599713,196.1058165769135" fill="#1F7A72"/><rect x="820.8800000000001" y="184" width="96.8" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="869.2800000000001" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">5 + 6 = 11</text><text x="532" y="244" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">each step is easy alone</text><text x="532" y="268" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">each step is checkable</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Three easy steps replace one hard leap. Source: original toy.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original toy</text></svg>