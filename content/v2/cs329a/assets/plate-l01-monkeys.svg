<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Ten thousand tries surface tail knowledge</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Llama 3 8B, F2F benchmark, oracle verifier: one try fails, 10k tries solve.</text><rect x="32" y="96" width="300" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">1 attempt</text><rect x="56" y="184" width="67.68" height="32" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="89.84" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">1 draw</text><text x="56" y="244" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">5% per try: fails</text><rect x="628" y="96" width="300" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="644" y="122" font-size="14" font-weight="600" fill="#5C6B7A">10,000 attempts + oracle</text><rect x="652" y="184" width="140.48000000000002" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="722.24" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">IMO-level solved</text><text x="652" y="244" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">verifier keeps the win</text><line x1="340" y1="200" x2="620" y2="200" stroke="#1E4D8C" stroke-width="2"/><polygon points="620,200 610.7893900599712,203.8941834230865 610.7893900599712,196.1058165769135" fill="#1E4D8C"/><rect x="421.3" y="176.0" width="117.4" height="24" fill="#F7F4EE"/><text x="480.0" y="194.0" text-anchor="middle" font-size="13" font-weight="500" fill="#1E4D8C">10,000x samples</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. The knowledge was in the weights. One shot could not reach it. Source: Brown et al., Large Language Monkeys (2024).</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: paper: Large Language Monkeys</text></svg>