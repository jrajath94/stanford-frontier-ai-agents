<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="620" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">Ten thousand tries surface tail knowledge</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">Llama 3 8B on hard math: 1 sample fails, 10,000 samples with an oracle verifier solve.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="496" height="280" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="288" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">1 sample</text>
<rect x="168" y="180" width="240" height="80" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="288.0" y="210.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Llama 3 8B</text>
<text x="288.0" y="234.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">one try</text>
<line x1="288" y1="280" x2="288" y2="330" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="298.0" y="305.0" font-size="13" font-weight="500" fill="#1F7A72">no verifier</text>
<rect x="168" y="340" width="240" height="60" rx="12" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="288.0" y="360.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">fails</text>
<text x="288.0" y="384.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">one shot misses the tail</text>
<rect x="584" y="120" width="496" height="280" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="832" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">10,000 samples</text>
<rect x="712" y="180" width="240" height="80" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="832.0" y="210.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Llama 3 8B</text>
<text x="832.0" y="234.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">10,000 tries</text>
<line x1="832" y1="280" x2="832" y2="330" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="842.0" y="305.0" font-size="13" font-weight="500" fill="#1F7A72">oracle verifier</text>
<rect x="712" y="340" width="240" height="60" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/>
<text x="832.0" y="360.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">solved</text>
<text x="832.0" y="384.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">at least one try correct</text>
<text x="560" y="444" font-size="14" fill="#5C6B7A" text-anchor="middle">only 3 to 4 of 10,000 tries correct: a hit rate of 0.03 to 0.04 percent</text>
<text x="560" y="472" font-size="13" fill="#5C6B7A" text-anchor="middle">the verifier finds them, so the models already knew the answers</text>
<text x="40" y="564" font-size="15" font-weight="450" fill="#1B2838">The models knew the answers. One shot could not surface them.</text>
<text x="40" y="592" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper, Large Language Monkeys. Shell 2.</text>
</svg>