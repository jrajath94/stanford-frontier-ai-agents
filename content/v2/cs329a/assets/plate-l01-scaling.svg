<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="600" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">Bigger models, predictable gains</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">Parameters rose 1,588x from BERT at 340M to PaLM at 540B. Test loss fell on a smooth curve.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="496" height="360" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="288" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Parameter counts, log scale</text>
<text x="64" y="205" font-size="14" font-weight="500" fill="#5C6B7A">BERT</text>
<rect x="144" y="188" width="43.84701065598607" height="24" rx="6" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="199.84701065598608" y="205" font-size="14" font-weight="600" fill="#1B2838">340M</text>
<text x="64" y="281" font-size="14" font-weight="500" fill="#5C6B7A">GPT-2</text>
