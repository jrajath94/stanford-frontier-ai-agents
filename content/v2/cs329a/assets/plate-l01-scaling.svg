<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Bigger models, predictable gains</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Parameters rose 1,500x from BERT to PaLM. Test loss fell on a smooth curve.</text><text x="32" y="146" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">BERT (2018)</text><rect x="200" y="120" width="53.128970098645404" height="36" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="226.5644850493227" y="142.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2838">8.5 (log10)</text><text x="32" y="198" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">GPT-2 (2019)</text><rect x="200" y="172" width="167.28760291214212" height="36" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="283.64380145607106" y="194.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2838">9.2 (log10)</text><text x="32" y="250" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">GPT-3 (2020)</text><rect x="200" y="224" width="533.3367835180611" height="36" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="466.66839175903056" y="246.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2838">11.2 (log10)</text><text x="32" y="302" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">PaLM (2022)</text><rect x="200" y="276" width="620.0" height="36" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="510.0" y="298.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2838">11.7 (log10)</text><text x="32" y="336" text-anchor="start" font-size="13" font-weight="450" fill="#5C6B7A">log10 of parameter count; each step right is 10x</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. Three orders of magnitude of scale, one predictable loss curve. Source: public model cards.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: public model cards</text></svg>