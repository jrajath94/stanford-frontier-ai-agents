<text x="253.0275288720937" y="281" font-size="14" font-weight="600" fill="#1B2838">1.5B</text>
<text x="64" y="357" font-size="14" font-weight="500" fill="#5C6B7A">GPT-3</text>
<rect x="144" y="340" width="267.5506390166193" height="24" rx="6" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="423.5506390166193" y="357" font-size="14" font-weight="600" fill="#1B2838">175B</text>
<text x="64" y="433" font-size="14" font-weight="500" fill="#5C6B7A">PaLM</text>
<rect x="144" y="416" width="307.922485185395" height="24" rx="6" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="463.922485185395" y="433" font-size="14" font-weight="600" fill="#1B2838">540B</text>
<text x="288" y="470" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">540B / 340M = 1,588x</text>
<rect x="584" y="120" width="496" height="360" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="832" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Test loss falls smoothly</text>
<line x1="640" y1="200" x2="640" y2="400" stroke="#5C6B7A" stroke-width="1.5"/>
<line x1="640" y1="400" x2="1000" y2="400" stroke="#5C6B7A" stroke-width="1.5"/>
<text x="820.0" y="428" font-size="13" fill="#5C6B7A" text-anchor="middle">compute, data, parameters</text>
<text x="630" y="300.0" font-size="13" fill="#5C6B7A" text-anchor="end" transform="rotate(-90 630 300.0)">test loss</text>
<path d="M 658,230 L 730,290 L 820,336 L 910,364 L 982,380" fill="none" stroke="#1E4D8C" stroke-width="3"/>
<text x="892.0" y="284.0" font-size="13" fill="#1E4D8C">smooth, predictable</text>
<text x="40" y="544" font-size="15" font-weight="450" fill="#1B2838">From BERT to PaLM the count rose 1,588x, and test loss fell on a predictable curve.</text>
<text x="40" y="572" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: lecture slide and public model cards. Shell 2.</text>
