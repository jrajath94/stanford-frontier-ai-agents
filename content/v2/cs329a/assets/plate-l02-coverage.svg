<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Coverage rises log-linearly in samples</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">p = 0.05 per try. Coverage = 1 - 0.95^k, computed at each k.</text><line x1="120" y1="120" x2="120" y2="300" stroke="#1B2838" stroke-width="2"/><line x1="120" y1="300" x2="880" y2="300" stroke="#1B2838" stroke-width="2"/><circle cx="120.0" cy="291.0" r="10" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/><text x="120.0" y="271.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">5.0%</text><text x="120.0" y="328" text-anchor="middle" font-size="14" font-weight="450" fill="#5C6B7A">k=1</text><circle cx="373.33333333333337" cy="228.0" r="10" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/><text x="373.33333333333337" y="208.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">40.0%</text><text x="373.33333333333337" y="328" text-anchor="middle" font-size="14" font-weight="450" fill="#5C6B7A">k=10</text><line x1="120.0" y1="291.0" x2="373.33333333333337" y2="228.0" stroke="#1E4D8C" stroke-width="3"/><circle cx="626.6666666666667" cy="121.08000000000001" r="10" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/><text x="626.6666666666667" y="101.08000000000001" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">99.4%</text><text x="626.6666666666667" y="328" text-anchor="middle" font-size="14" font-weight="450" fill="#5C6B7A">k=100</text><line x1="373.33333333333337" y1="228.0" x2="626.6666666666667" y2="121.08000000000001" stroke="#1E4D8C" stroke-width="3"/><circle cx="880.0" cy="120.0" r="10" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/><text x="880.0" y="100.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">100%</text><text x="880.0" y="328" text-anchor="middle" font-size="14" font-weight="450" fill="#5C6B7A">k=1000</text><line x1="626.6666666666667" y1="121.08000000000001" x2="880.0" y2="120.0" stroke="#1E4D8C" stroke-width="3"/><text x="32" y="112" text-anchor="start" font-size="13" font-weight="450" fill="#5C6B7A">coverage</text><text x="560.0" y="352" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">log samples</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. Each tenfold increase in samples buys a fixed jump in coverage. Source: original computation.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original computation</text></svg>