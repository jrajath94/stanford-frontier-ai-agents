<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="620" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">Small beats big with perfect verification</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">Llama 3 8B at 10,000 samples beats GPT-4o at 1 sample with an oracle verifier.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="496" height="300" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="288" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Llama 3 8B</text>
<rect x="148" y="185" width="280" height="80" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="288.0" y="215.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">10,000 samples</text>
<text x="288.0" y="239.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">cheap, in parallel</text>
<line x1="288" y1="285" x2="288" y2="335" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="298.0" y="310.0" font-size="13" font-weight="500" fill="#1F7A72">oracle verifier</text>
<rect x="148" y="345" width="280" height="60" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/>
<text x="288.0" y="365.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">wins</text>
<text x="288.0" y="389.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">perfect picking</text>
<rect x="584" y="120" width="496" height="300" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="832" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">GPT-4o</text>
<rect x="692" y="185" width="280" height="80" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="832.0" y="215.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">1 sample</text>
<text x="832.0" y="239.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">one shot</text>
<line x1="832" y1="285" x2="832" y2="335" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="842.0" y="310.0" font-size="13" font-weight="500" fill="#1F7A72">oracle verifier</text>
<rect x="692" y="345" width="280" height="60" rx="12" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="832.0" y="365.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">loses</text>
<text x="832.0" y="389.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">one shot misses the tail</text>
<text x="560" y="468" font-size="14" fill="#5C6B7A" text-anchor="middle">same knowledge, more tries: the verifier is the load-bearing wall</text>
<text x="40" y="564" font-size="15" font-weight="450" fill="#1B2838">Small beats big once the verifier is perfect. Generation was never the ceiling.</text>
<text x="40" y="592" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper, Large Language Monkeys. Shell 2.</text>
</svg>