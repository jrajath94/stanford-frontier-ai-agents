<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Reliability decays exponentially in steps</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Each round 90% reliable. Task success = 0.9^n, computed.</text><line x1="120" y1="120" x2="120" y2="300" stroke="#1B2838" stroke-width="2"/><line x1="120" y1="300" x2="880" y2="300" stroke="#1B2838" stroke-width="2"/><circle cx="120.0" cy="138.0" r="10" fill="#1F7A72" stroke="#1B2838" stroke-width="1.5"/><text x="120.0" y="116.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">90%</text><text x="120.0" y="328" text-anchor="middle" font-size="14" font-weight="450" fill="#5C6B7A">n=1</text><circle cx="373.33333333333337" cy="193.71179999999998" r="10" fill="#1F7A72" stroke="#1B2838" stroke-width="1.5"/><text x="373.33333333333337" y="171.71179999999998" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">59%</text><text x="373.33333333333337" y="328" text-anchor="middle" font-size="14" font-weight="450" fill="#5C6B7A">n=5</text><line x1="120.0" y1="138.0" x2="373.33333333333337" y2="193.71179999999998" stroke="#C46B2C" stroke-width="3"/><circle cx="626.6666666666667" cy="237.237880782" r="10" fill="#C46B2C" stroke="#1B2838" stroke-width="1.5"/><text x="626.6666666666667" y="215.237880782" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">35%</text><text x="626.6666666666667" y="328" text-anchor="middle" font-size="14" font-weight="450" fill="#5C6B7A">n=10</text><line x1="373.33333333333337" y1="193.71179999999998" x2="626.6666666666667" y2="237.237880782" stroke="#C46B2C" stroke-width="3"/><circle cx="880.0" cy="278.1162021736975" r="10" fill="#C46B2C" stroke="#1B2838" stroke-width="1.5"/><text x="880.0" y="256.1162021736975" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">12%</text><text x="880.0" y="328" text-anchor="middle" font-size="14" font-weight="450" fill="#5C6B7A">n=20</text><line x1="626.6666666666667" y1="237.237880782" x2="880.0" y2="278.1162021736975" stroke="#C46B2C" stroke-width="3"/><text x="32" y="112" text-anchor="start" font-size="13" font-weight="450" fill="#5C6B7A">task success</text><text x="560.0" y="352" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">steps</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. Ten steps at 90% give a 35% task. Twenty give 12%. Source: original computation.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original computation</text></svg>