<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Grounding pins each step to the world</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Ungrounded: the answer is a guess. Grounded: each claim has a source.</text><rect x="32" y="96" width="420" height="240" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">closed box</text><text x="56" y="168" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">Q: titles after 2024 French Open?</text><text x="56" y="204" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">model: 3 (from memory)</text><text x="56" y="240" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">no step touches a source</text><rect x="56" y="264" width="176.88" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="144.44" y="285" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">guess dressed as fact</text><rect x="508" y="96" width="420" height="240" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="524" y="122" font-size="14" font-weight="600" fill="#5C6B7A">ReAct</text><text x="532" y="168" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">thought -&gt; search -&gt; observation</text><text x="532" y="204" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">observation: third Grand Slam title</text><text x="532" y="240" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">every claim has a source</text><rect x="532" y="264" width="155.04" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="609.52" y="285" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">answer: 3, sourced</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Grounding moves failure from guessing to looking in the wrong place. Source: original.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original</text></svg>