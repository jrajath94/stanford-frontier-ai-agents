<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Thought, action, observation, repeat</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Each thought picks a tool. Each observation grounds the next thought.</text><rect x="48" y="168" width="240" height="128" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="168" y="214" text-anchor="middle" font-size="18" font-weight="600" fill="#1B2838">thought</text><text x="168" y="244" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">15% of 240?</text><line x1="288" y1="232" x2="336" y2="232" stroke="#1B2838" stroke-width="2"/><polygon points="336,232 326.78939005997114,235.8941834230865 326.78939005997114,228.1058165769135" fill="#1B2838"/><rect x="336" y="168" width="240" height="128" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="456" y="214" text-anchor="middle" font-size="18" font-weight="600" fill="#1B2838">action</text><text x="456" y="244" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">calculator(0.15*240)</text><line x1="576" y1="232" x2="624" y2="232" stroke="#1B2838" stroke-width="2"/><polygon points="624,232 614.7893900599712,235.8941834230865 614.7893900599712,228.1058165769135" fill="#1B2838"/><rect x="624" y="168" width="240" height="128" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="744" y="214" text-anchor="middle" font-size="18" font-weight="600" fill="#1B2838">observation</text><text x="744" y="244" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">36.0</text><text x="480" y="336" text-anchor="middle" font-size="14" font-weight="450" fill="#1E4D8C">then again: thought -&gt; calculator(36+7) -&gt; 43. answer: 43</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. The answer rests on two verified steps, not one leap. Source: original toy.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original toy</text></svg>