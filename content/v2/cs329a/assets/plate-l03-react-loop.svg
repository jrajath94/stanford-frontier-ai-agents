<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="680" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">Think, act, observe</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">Thought plans. Action calls a tool. Observation feeds the next thought.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="640" height="300" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="250.0" y="152.0" width="220" height="96" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="360" y="196" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Thought</text>
<text x="360" y="220" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">plans the next move</text>
<rect x="90.0" y="312.0" width="220" height="96" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="200" y="356" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Action</text>
<text x="200" y="380" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">calls a tool</text>
<rect x="410.0" y="312.0" width="220" height="96" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="520" y="356" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Observation</text>
<text x="520" y="380" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">feeds the next thought</text>
<line x1="280" y1="250" x2="220" y2="310" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="260.0" y="280.0" font-size="13" font-weight="500" fill="#1F7A72">act</text>
<line x1="320" y1="360" x2="410" y2="360" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="330.4" y="334.0" width="69.19999999999999" height="20" rx="4" fill="#F7F4EE"/>
<text x="365.0" y="349.0" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">observe</text>
<line x1="460" y1="300" x2="420" y2="240" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="450.0" y="270.0" font-size="13" font-weight="500" fill="#1F7A72">think</text>
<text x="360" y="448" font-size="13" fill="#5C6B7A" text-anchor="middle">validity-constrained actions: the model cannot hallucinate a tool</text>
<text x="360" y="474" font-size="13" fill="#5C6B7A" text-anchor="middle">failure mode: compounding error, one wrong action poisons the rest</text>
<rect x="728" y="120" width="352" height="300" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="904" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">WebShop score</text>
<text x="760" y="230" font-size="14" font-weight="500" fill="#1B2838">ReAct</text>
<rect x="760" y="244" width="211" height="30" rx="6" fill="#1F7A72"/>
<text x="979" y="265" font-size="14" font-weight="600" fill="#1B2838">66.6</text>
<text x="760" y="310" font-size="14" font-weight="500" fill="#1B2838">Human expert</text>
<rect x="760" y="324" width="260" height="30" rx="6" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="1028" y="345" font-size="14" font-weight="600" fill="#1B2838">82.1</text>
<text x="40" y="624" font-size="15" font-weight="450" fill="#1B2838">Acting beats answering, but every action is a chance to leave the rails.</text>
<text x="40" y="652" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper, ReAct. Shell 3.</text>
</svg>