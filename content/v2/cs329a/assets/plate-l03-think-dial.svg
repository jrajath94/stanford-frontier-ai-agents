<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Thinking is a dial, not a virtue</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Too little thought acts blind. Too much stalls. The sweet spot moves per task.</text><rect x="32" y="96" width="896" height="200" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">thought per action</text><rect x="64" y="168" width="220" height="64" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="174.0" y="204.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2838">too little: blind action</text><rect x="370" y="168" width="220" height="64" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="480.0" y="204.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2838">sweet spot: task-dependent</text><rect x="676" y="168" width="220" height="64" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="786.0" y="204.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2838">too much: stalls, burns</text><line x1="284" y1="200" x2="362" y2="200" stroke="#1B2838" stroke-width="2"/><polygon points="362,200 352.78939005997114,203.8941834230865 352.78939005997114,196.1058165769135" fill="#1B2838"/><line x1="590" y1="200" x2="668" y2="200" stroke="#1B2838" stroke-width="2"/><polygon points="668,200 658.7893900599712,203.8941834230865 658.7893900599712,196.1058165769135" fill="#1B2838"/><text x="64" y="264" text-anchor="start" font-size="13" font-weight="450" fill="#5C6B7A">the field has not settled how to set the dial</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Current models overthink simple tasks: the lecture&#x27;s observation. Source: lecture-reported.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: lecture-reported</text></svg>