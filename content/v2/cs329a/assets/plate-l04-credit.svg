<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">One advantage for the whole program</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">The reward exists per turn. Every token in the program shares one advantage value.</text><rect x="32" y="96" width="560" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">one program, many tokens</text><rect x="56" y="184" width="48" height="32" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="80.0" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">def</text><rect x="116" y="184" width="60.4" height="32" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="146.2" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">solve</text><rect x="188.4" y="184" width="48" height="32" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="212.4" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">(</text><rect x="248.4" y="184" width="48" height="32" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="272.4" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">):</text><rect x="308.4" y="184" width="48" height="32" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="332.4" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">...</text><rect x="368.4" y="184" width="67.68" height="32" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="402.24" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">return</text><text x="56" y="256" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">no test says which token failed</text><rect x="628" y="96" width="300" height="240" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="644" y="122" font-size="14" font-weight="600" fill="#5C6B7A">credit</text><text x="652" y="196" text-anchor="start" font-size="18" font-weight="600" fill="#1B2838">advantage A</text><text x="652" y="228" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">shared by all tokens</text><line x1="592" y1="216" x2="628" y2="216" stroke="#1B2838" stroke-width="2"/><polygon points="628,216 618.7893900599712,219.8941834230865 618.7893900599712,212.1058165769135" fill="#1B2838"/><rect x="568.2" y="192.0" width="83.60000000000001" height="24" fill="#F7F4EE"/><text x="610.0" y="210.0" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">one number</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Coarse, but honest about what the world reports. Source: paper: RLEF.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: paper: RLEF</text></svg>