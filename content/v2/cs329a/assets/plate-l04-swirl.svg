<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="640" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">Step rewards beat answer imitation</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">Process-filtered multi-step RL beats SFT. HotPotQA to GSM8K transfer: 65 to 75.1 percent.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="1040" height="320" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="560" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Zero-shot transfer: train on HotPotQA tool use, test on GSM8K math</text>
<text x="140" y="240" font-size="14" font-weight="500" fill="#1B2838">SFT imitation</text>
<rect x="340" y="216" width="571" height="34" rx="6" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="921" y="240" font-size="15" font-weight="600" fill="#1B2838">65%</text>
<text x="140" y="310" font-size="14" font-weight="500" fill="#1B2838">Process-filtered RL</text>
<rect x="340" y="286" width="660" height="34" rx="6" fill="#1F7A72"/>
<text x="1010" y="310" font-size="15" font-weight="600" fill="#1B2838">75.1%</text>
<text x="560" y="380" font-size="14" fill="#5C6B7A" text-anchor="middle">a 15.5 percent relative gain: step-level judgment transfers across tasks</text>
<text x="560" y="408" font-size="14" fill="#5C6B7A" text-anchor="middle">imitation copies the demonstrator, bad habits included</text>
<text x="40" y="584" font-size="15" font-weight="450" fill="#1B2838">Imitation copies answers. Step rewards learn which steps actually helped.</text>
<text x="40" y="612" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper, SWiRL. Shell 2.</text>
</svg>