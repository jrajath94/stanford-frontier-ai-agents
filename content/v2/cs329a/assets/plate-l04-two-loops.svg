<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Two loops: exploit now, learn later</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Inference-time: try, run, retry. Train-time: PPO on the outcomes.</text><rect x="32" y="96" width="440" height="240" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">inference-time loop</text><text x="56" y="168" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">write program</text><text x="56" y="196" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">run public tests</text><text x="56" y="224" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">read the failure</text><text x="56" y="252" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">retry until pass or limit</text><text x="56" y="296" text-anchor="start" font-size="15" font-weight="600" fill="#1E4D8C">weights: FIXED</text><rect x="488" y="96" width="440" height="240" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="504" y="122" font-size="14" font-weight="600" fill="#5C6B7A">train-time loop</text><text x="512" y="168" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">collect passing trajectories</text><text x="512" y="196" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">reward 1 on private tests</text><text x="512" y="224" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">PPO update toward winners</text><text x="512" y="252" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">policy improves</text><text x="512" y="296" text-anchor="start" font-size="15" font-weight="600" fill="#1F7A72">weights: CHANGE</text><line x1="472" y1="216" x2="488" y2="216" stroke="#1B2838" stroke-width="2"/><polygon points="488,216 478.78939005997114,219.8941834230865 478.78939005997114,212.1058165769135" fill="#1B2838"/><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. The first loop uses the policy. The second loop improves it. Source: original.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original</text></svg>