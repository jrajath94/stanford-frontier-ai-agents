<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Public tests guide. Private tests grade.</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">The model sees public tests during generation. Private tests decide the reward, unseen.</text><rect x="32" y="96" width="420" height="240" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">public tests: visible</text><text x="56" y="168" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">small set, fast</text><text x="56" y="196" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">model sees failures</text><text x="56" y="224" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">guides retries</text><rect x="56" y="256" width="89.52" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="100.75999999999999" y="277" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">iteration</text><rect x="508" y="96" width="420" height="240" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="524" y="122" font-size="14" font-weight="600" fill="#5C6B7A">private tests: hidden</text><text x="532" y="168" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">hidden until grading</text><text x="532" y="196" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">decide reward 1 or 0</text><text x="532" y="224" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">cannot be memorized</text><rect x="532" y="256" width="118.64" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="591.32" y="277" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">honest reward</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. The only reliable way to earn reward 1 is genuinely correct code. Source: paper: RLEF.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: paper: RLEF</text></svg>