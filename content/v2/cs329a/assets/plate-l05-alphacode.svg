<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="680" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">A million samples, ten submissions</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">1M programs per problem. Filter, cluster by behavior, submit from the top 10.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="1040" height="260" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="60.0" y="178.0" width="160" height="104" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="140" y="226" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Sample</text>
<text x="140" y="250" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">1,000,000 programs</text>
<rect x="250.0" y="178.0" width="160" height="104" rx="12" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="330" y="226" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Test inputs</text>
<text x="330" y="250" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">run every program</text>
<rect x="440.0" y="178.0" width="160" height="104" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="520" y="226" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Filter</text>
<text x="520" y="250" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">drop known-test fails</text>
<rect x="630.0" y="178.0" width="160" height="104" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="710" y="226" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Cluster</text>
<text x="710" y="250" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">keep biggest clusters</text>
<rect x="820.0" y="178.0" width="160" height="104" rx="12" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="900" y="226" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Select</text>
<text x="900" y="250" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">submit top 10</text>
<line x1="224" y1="230" x2="246" y2="230" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<line x1="414" y1="230" x2="436" y2="230" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<line x1="604" y1="230" x2="626" y2="230" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<line x1="794" y1="230" x2="816" y2="230" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="560" y="330" font-size="13" fill="#5C6B7A" text-anchor="middle">half Python, half C++: different languages reach different solutions</text>
<rect x="40" y="408" width="1040" height="160" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="560" y="444" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">10@k solve rate: about 30 percent. Unlimited submissions: about 40 percent.</text>
<text x="560" y="476" font-size="14" fill="#5C6B7A" text-anchor="middle">generation was not the ceiling. Picking was: the selection bottleneck.</text>
<text x="560" y="504" font-size="13" fill="#5C6B7A" text-anchor="middle">pass@k grows log-linearly in k; bigger models get a better slope</text>
<text x="40" y="624" font-size="15" font-weight="450" fill="#1B2838">Sampling is a serious strategy, not a party trick. The verifier decides what it buys.</text>
<text x="40" y="652" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper, AlphaCode. Shell 3.</text>
</svg>