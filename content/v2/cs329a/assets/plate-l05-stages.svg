<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">LATS: six stages, one loop</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Select, expand, evaluate, simulate, backpropagate, reflect. Then repeat.</text><rect x="32" y="176" width="128" height="112" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="96" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">select</text><text x="96" y="248" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">1</text><line x1="160" y1="232" x2="184" y2="232" stroke="#1B2838" stroke-width="2"/><polygon points="184,232 174.78939005997114,235.8941834230865 174.78939005997114,228.1058165769135" fill="#1B2838"/><rect x="184" y="176" width="128" height="112" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="248" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">expand</text><text x="248" y="248" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">2</text><line x1="312" y1="232" x2="336" y2="232" stroke="#1B2838" stroke-width="2"/><polygon points="336,232 326.78939005997114,235.8941834230865 326.78939005997114,228.1058165769135" fill="#1B2838"/><rect x="336" y="176" width="128" height="112" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="400" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">evaluate</text><text x="400" y="248" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">3</text><line x1="464" y1="232" x2="488" y2="232" stroke="#1B2838" stroke-width="2"/><polygon points="488,232 478.78939005997114,235.8941834230865 478.78939005997114,228.1058165769135" fill="#1B2838"/><rect x="488" y="176" width="128" height="112" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="552" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">simulate</text><text x="552" y="248" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">4</text><line x1="616" y1="232" x2="640" y2="232" stroke="#1B2838" stroke-width="2"/><polygon points="640,232 630.7893900599712,235.8941834230865 630.7893900599712,228.1058165769135" fill="#1B2838"/><rect x="640" y="176" width="128" height="112" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="704" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">backprop</text><text x="704" y="248" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">5</text><line x1="768" y1="232" x2="792" y2="232" stroke="#1B2838" stroke-width="2"/><polygon points="792,232 782.7893900599712,235.8941834230865 782.7893900599712,228.1058165769135" fill="#1B2838"/><rect x="792" y="176" width="128" height="112" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="856" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">reflect</text><text x="856" y="248" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">6</text><text x="480" y="328" text-anchor="middle" font-size="14" font-weight="450" fill="#5C6B7A">until success or the expansion budget runs out</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Numbers update values. Words update understanding. Source: paper: LATS.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: paper: LATS</text></svg>