<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">UCT: exploit plus explore, worked</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Node A: value 1.26, 4 visits. Node B: value 1.10, 15 visits. Parent: 20 visits. c = 1.</text><rect x="32" y="96" width="430" height="240" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">node A: rarely visited</text><text x="56" y="168" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">value 1.26 + explore 0.87</text><text x="56" y="204" text-anchor="start" font-size="20" font-weight="600" fill="#1F7A72">UCT = 2.13</text><text x="56" y="244" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">wins selection</text><rect x="498" y="96" width="430" height="240" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="514" y="122" font-size="14" font-weight="600" fill="#5C6B7A">node B: often visited</text><text x="522" y="168" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">value 1.10 + explore 0.45</text><text x="522" y="204" text-anchor="start" font-size="20" font-weight="600" fill="#5C6B7A">UCT = 1.55</text><text x="522" y="244" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">loses despite higher visits</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. The less-visited node wins selection despite the lower value. Source: original toy.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original toy</text></svg>