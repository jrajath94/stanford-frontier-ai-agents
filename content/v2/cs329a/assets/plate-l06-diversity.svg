<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Ten copies of one idea are one idea</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Blind sampling repeats favorites. Clustering submits one per behavioral group.</text><rect x="32" y="96" width="420" height="240" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">blind: 10 random picks</text><rect x="56" y="168" width="80.16" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="96.08" y="189" text-anchor="middle" font-size="12" font-weight="500" fill="#1B2838">same idea</text><rect x="176" y="168" width="80.16" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="216.07999999999998" y="189" text-anchor="middle" font-size="12" font-weight="500" fill="#1B2838">same idea</text><rect x="296" y="168" width="80.16" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="336.08" y="189" text-anchor="middle" font-size="12" font-weight="500" fill="#1B2838">same idea</text><rect x="56" y="216" width="80.16" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="96.08" y="237" text-anchor="middle" font-size="12" font-weight="500" fill="#1B2838">same idea</text><rect x="176" y="216" width="80.16" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="216.07999999999998" y="237" text-anchor="middle" font-size="12" font-weight="500" fill="#1B2838">same idea</text><text x="56" y="292" text-anchor="start" font-size="13" font-weight="450" fill="#5C6B7A">10 versions of one wrong approach</text><rect x="508" y="96" width="420" height="240" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="524" y="122" font-size="14" font-weight="600" fill="#5C6B7A">clustered: 10 picks</text><rect x="532" y="168" width="61.44" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="562.72" y="189" text-anchor="middle" font-size="12" font-weight="500" fill="#1B2838">idea 1</text><rect x="652" y="168" width="61.44" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="682.72" y="189" text-anchor="middle" font-size="12" font-weight="500" fill="#1B2838">idea 2</text><rect x="772" y="168" width="61.44" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="802.72" y="189" text-anchor="middle" font-size="12" font-weight="500" fill="#1B2838">idea 3</text><rect x="532" y="216" width="61.44" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="562.72" y="237" text-anchor="middle" font-size="12" font-weight="500" fill="#1B2838">idea 4</text><rect x="652" y="216" width="61.44" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="682.72" y="237" text-anchor="middle" font-size="12" font-weight="500" fill="#1B2838">idea 5</text><text x="532" y="292" text-anchor="start" font-size="13" font-weight="450" fill="#5C6B7A">10 genuinely different approaches</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Diversity must be engineered: it does not come free with samples. Source: original toy.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original toy</text></svg>