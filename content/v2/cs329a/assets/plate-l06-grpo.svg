<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="700" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">The group is the baseline</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">Rewards 0.0, 0.5, 0.5, 1.0. Mean 0.5, std 0.3536. Advantages -1.414, 0, 0, 1.414.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="1040" height="300" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="560" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">One prompt, four sampled responses</text>
<rect x="125.0" y="175.0" width="150" height="110" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="2.5"/>
<text x="200" y="226" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">reward 0.0</text>
<text x="200" y="250" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">advantage -1.414</text>
<rect x="325.0" y="175.0" width="150" height="110" rx="12" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="400" y="226" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">reward 0.5</text>
<text x="400" y="250" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">advantage 0.000</text>
<rect x="525.0" y="175.0" width="150" height="110" rx="12" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="600" y="226" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">reward 0.5</text>
<text x="600" y="250" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">advantage 0.000</text>
<rect x="725.0" y="175.0" width="150" height="110" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/>
<text x="800" y="226" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">reward 1.0</text>
<text x="800" y="250" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">advantage 1.414</text>
<text x="560" y="340" font-size="15" fill="#1B2838" text-anchor="middle">advantage = (reward - group mean) / group std = (reward - 0.5) / 0.3536</text>
<text x="560" y="372" font-size="14" fill="#5C6B7A" text-anchor="middle">best pushed up, worst pushed down, middle two left alone</text>
<text x="560" y="400" font-size="14" font-weight="600" fill="#1F7A72" text-anchor="middle">no value model needed, no learned baseline: the group is the baseline</text>
<rect x="40" y="448" width="1040" height="120" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="560" y="486" font-size="14" fill="#1B2838" text-anchor="middle">MATH benchmark 46.8 to 51.7 percent; the gain showed in majority@K more than pass@K</text>
<text x="560" y="514" font-size="13" fill="#5C6B7A" text-anchor="middle">the model got more reliable, not more brilliant; reward = correctness minus a KL penalty</text>
<text x="40" y="644" font-size="15" font-weight="450" fill="#1B2838">Advantage normalization with no learned baseline made R1's training work.</text>
<text x="40" y="672" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper, DeepSeekMath. Shell 2.</text>
</svg>