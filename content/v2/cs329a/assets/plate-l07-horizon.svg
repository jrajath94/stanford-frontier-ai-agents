<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="680" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">The horizon doubles every seven months</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">50 percent time horizon: 2s GPT-2, 8min GPT-4, 59min Claude 3.7 Sonnet.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="1040" height="300" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<line x1="140" y1="370" x2="900" y2="370" stroke="#5C6B7A" stroke-width="1.5"/>
<text x="520.0" y="398" font-size="13" fill="#5C6B7A" text-anchor="middle">time horizon, log scale</text>
<rect x="119.31114232861472" y="240" width="160" height="80" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="199.31114232861472" y="270.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">GPT-2</text>
<text x="199.31114232861472" y="294.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">2s</text>
<line x1="279.3111423286147" y1="280" x2="598.2778558215367" y2="280" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="588.2778558215367" y="240" width="160" height="80" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="668.2778558215367" y="270.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">GPT-4</text>
<text x="668.2778558215367" y="294.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">8min</text>
<line x1="748.2778558215367" y1="280" x2="769.2507080048289" y2="280" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="759.2507080048289" y="240" width="160" height="80" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/>
<text x="839.2507080048289" y="270.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Claude 3.7 Sonnet</text>
<text x="839.2507080048289" y="294.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">59min</text>
<text x="520.0" y="176" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">the 50 percent horizon doubles every 7 months</text>
<rect x="40" y="448" width="496" height="120" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="288" y="486" font-size="14" fill="#1B2838" text-anchor="middle">toy check: 2s x 2^10.3 = about 42 min</text>
<text x="288" y="514" font-size="13" fill="#5C6B7A" text-anchor="middle">measured 59 min: same neighborhood</text>
<rect x="584" y="448" width="496" height="120" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="832" y="486" font-size="14" fill="#1B2838" text-anchor="middle">80% horizon: about 15 min</text>
<text x="832" y="514" font-size="13" fill="#5C6B7A" text-anchor="middle">reliability costs a factor of four</text>
<text x="40" y="624" font-size="15" font-weight="450" fill="#1B2838">The pace is exponential; nothing in the data says where it bends.</text>
<text x="40" y="652" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper, METR. Shell 2.</text>
</svg>