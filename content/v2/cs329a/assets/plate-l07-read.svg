<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">File notes, not documents</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">A reading step extracts the relevant span. Only the notes join the prompt.</text><rect x="32" y="96" width="360" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">retrieved: long, noisy</text><text x="56" y="168" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">document 1: 8,000 words</text><text x="56" y="196" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">document 2: 5,000 words</text><text x="56" y="224" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">document 3: 12,000 words</text><text x="56" y="268" text-anchor="start" font-size="14" font-weight="450" fill="#C46B2C">relevant paragraph drowns</text><rect x="568" y="96" width="360" height="240" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="584" y="122" font-size="14" font-weight="600" fill="#5C6B7A">extracted: tight notes</text><text x="592" y="168" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">compound structure: ...</text><text x="592" y="196" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">carbon count rule: ...</text><text x="592" y="224" text-anchor="start" font-size="14" font-weight="450" fill="#1F7A72">two chunks, 120 words</text><line x1="400" y1="216" x2="560" y2="216" stroke="#1E4D8C" stroke-width="2"/><polygon points="560,216 550.7893900599712,219.8941834230865 550.7893900599712,212.1058165769135" fill="#1E4D8C"/><rect x="424.68" y="192.0" width="110.64" height="24" fill="#F7F4EE"/><text x="480.0" y="210.0" text-anchor="middle" font-size="13" font-weight="500" fill="#1E4D8C">read + extract</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Context length is not reasoning capacity. Source: paper: Search-o1.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: paper: Search-o1</text></svg>