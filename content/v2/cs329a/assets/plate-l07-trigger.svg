<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Uncertainty is the search trigger</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">&#x27;Perhaps&#x27;, &#x27;alternatively&#x27;, &#x27;wait&#x27;: hedging words mark the knowledge gap.</text><rect x="32" y="96" width="280" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">trace signal</text><rect x="56" y="168" width="89.52" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="100.75999999999999" y="189" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">&quot;perhaps&quot;</text><rect x="56" y="216" width="89.52" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="100.75999999999999" y="237" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">&quot;wait...&quot;</text><text x="56" y="280" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">uncertainty spikes</text><rect x="340" y="96" width="280" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="356" y="122" font-size="14" font-weight="600" fill="#5C6B7A">trigger fires</text><text x="364" y="184" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">emit search token</text><text x="364" y="220" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">query the gap</text><text x="364" y="248" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">not the question</text><rect x="648" y="96" width="280" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="664" y="122" font-size="14" font-weight="600" fill="#5C6B7A">reasoning continues</text><text x="672" y="184" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">insert result</text><text x="672" y="220" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">continue the chain</text><line x1="312" y1="216" x2="340" y2="216" stroke="#1B2838" stroke-width="2"/><polygon points="340,216 330.78939005997114,219.8941834230865 330.78939005997114,212.1058165769135" fill="#1B2838"/><line x1="620" y1="216" x2="648" y2="216" stroke="#1B2838" stroke-width="2"/><polygon points="648,216 638.7893900599712,219.8941834230865 638.7893900599712,212.1058165769135" fill="#1B2838"/><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. The trigger decides what the model does not know. It is heuristic. Source: lecture-reported.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: lecture-reported</text></svg>