<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">The leak: broken steps that reach right answers</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">The filter keeps them. Fine-tuning bakes them in.</text><rect x="32" y="96" width="420" height="240" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">rationalization output</text><text x="56" y="168" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">step 1: ok</text><text x="56" y="196" text-anchor="start" font-size="14" font-weight="450" fill="#C46B2C">step 2: does not follow</text><text x="56" y="224" text-anchor="start" font-size="14" font-weight="450" fill="#C46B2C">step 3: lucky cancel</text><text x="56" y="260" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">final: 42, correct</text><rect x="508" y="96" width="420" height="240" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="524" y="122" font-size="14" font-weight="600" fill="#5C6B7A">training</text><text x="532" y="184" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">filter: answer right, keep</text><text x="532" y="220" text-anchor="start" font-size="15" font-weight="600" fill="#C46B2C">model learns the gaps</text><text x="532" y="260" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">bad reasoning, baked in</text><line x1="452" y1="216" x2="508" y2="216" stroke="#C46B2C" stroke-width="2"/><polygon points="508,216 498.78939005997114,219.8941834230865 498.78939005997114,212.1058165769135" fill="#C46B2C"/><rect x="424.68" y="192.0" width="110.64" height="24" fill="#F7F4EE"/><text x="480.0" y="210.0" text-anchor="middle" font-size="13" font-weight="500" fill="#C46B2C">no step filter</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Final-answer correctness is a proxy for reasoning quality, and proxies leak. Source: original.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original</text></svg>