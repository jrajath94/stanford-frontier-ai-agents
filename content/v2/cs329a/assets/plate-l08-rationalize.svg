<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Rationalization rescues the failures</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Hand the model the answer as a hint. Keep the rationale. Train without the hint.</text><rect x="32" y="96" width="280" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">failure</text><text x="56" y="184" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">model answered 37</text><text x="56" y="216" text-anchor="start" font-size="15" font-weight="450" fill="#C46B2C">correct is 42</text><rect x="340" y="96" width="280" height="240" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="356" y="122" font-size="14" font-weight="600" fill="#5C6B7A">hint given</text><text x="364" y="184" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">&quot;the answer is 42.</text><text x="364" y="212" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">show your work.&quot;</text><text x="364" y="252" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">model writes rationale</text><rect x="648" y="96" width="280" height="240" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="664" y="122" font-size="14" font-weight="600" fill="#5C6B7A">train</text><text x="672" y="184" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">fine-tune on</text><text x="672" y="212" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">(problem, rationale, 42)</text><text x="672" y="252" text-anchor="start" font-size="14" font-weight="600" fill="#1F7A72">WITHOUT the hint</text><line x1="312" y1="216" x2="340" y2="216" stroke="#1B2838" stroke-width="2"/><polygon points="340,216 330.78939005997114,219.8941834230865 330.78939005997114,212.1058165769135" fill="#1B2838"/><line x1="620" y1="216" x2="648" y2="216" stroke="#1B2838" stroke-width="2"/><polygon points="648,216 638.7893900599712,219.8941834230865 638.7893900599712,212.1058165769135" fill="#1B2838"/><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. The hint is scaffolding, removed before training. Source: paper: STaR.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: paper: STaR</text></svg>