<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">STaR: each round converts failures into data</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Round 1: attempt 10,000, keep 3,000 winners, fine-tune. Round 2: the better model solves more.</text><rect x="32" y="96" width="420" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">round 1</text><text x="56" y="168" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">attempt 10,000 problems</text><text x="56" y="200" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">keep 3,000 with right answers</text><rect x="56" y="232" width="155.04" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="133.51999999999998" y="253" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">fine-tune on 3,000</text><rect x="508" y="96" width="420" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="524" y="122" font-size="14" font-weight="600" fill="#5C6B7A">round 2</text><text x="532" y="168" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">better model tries the 7,000</text><text x="532" y="200" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">keep the new winners</text><rect x="532" y="232" width="133.2" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="598.6" y="253" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">fine-tune again</text><line x1="452" y1="292" x2="508" y2="292" stroke="#1F7A72" stroke-width="2"/><polygon points="508,292 498.78939005997114,295.89418342308653 498.78939005997114,288.10581657691347" fill="#1F7A72"/><rect x="424.68" y="268.0" width="110.64" height="24" fill="#F7F4EE"/><text x="480.0" y="286.0" text-anchor="middle" font-size="13" font-weight="500" fill="#1F7A72">improved model</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Bootstrapping: the frontier of solvable problems advances each round. Source: original toy.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original toy</text></svg>