<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">The meta-verifier judges the judge</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Experts seed issue-finding. The meta-verifier audits the verifier&#x27;s analysis.</text><rect x="40" y="168" width="260" height="128" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="170" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">generator</text><text x="170" y="242" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">writes proofs</text><line x1="300" y1="232" x2="340" y2="232" stroke="#1B2838" stroke-width="2"/><polygon points="340,232 330.78939005997114,235.8941834230865 330.78939005997114,228.1058165769135" fill="#1B2838"/><rect x="340" y="168" width="260" height="128" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="470" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">verifier</text><text x="470" y="242" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">finds issues, scores</text><line x1="600" y1="232" x2="640" y2="232" stroke="#1B2838" stroke-width="2"/><polygon points="640,232 630.7893900599712,235.8941834230865 630.7893900599712,228.1058165769135" fill="#1B2838"/><rect x="640" y="168" width="260" height="128" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="770" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">meta-verifier</text><text x="770" y="242" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">audits the analysis</text><text x="480" y="328" text-anchor="middle" font-size="14" font-weight="450" fill="#1E4D8C">8 iterations climbing; best-of-32 reaches 42% on the IMO 2024 shortlist</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Each side lifts the other: harder proofs, sharper judging. Source: lecture-reported.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: lecture-reported</text></svg>