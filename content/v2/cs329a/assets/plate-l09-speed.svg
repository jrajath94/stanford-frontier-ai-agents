<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Verification has a speed limit</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">RL loops need thousands of fast judgments. Some domains have no fast judge at all.</text><text x="48" y="152" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">math, code</text><text x="330" y="152" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">milliseconds</text><rect x="560" y="132" width="133.2" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="626.6" y="153" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">inside the loop</text><text x="48" y="208" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">chip design sims</text><text x="330" y="208" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">days per score</text><rect x="560" y="188" width="140.48000000000002" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="630.24" y="209" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">outside the loop</text><text x="48" y="264" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">wet-lab chemistry</text><text x="330" y="264" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">weeks per experiment</text><rect x="560" y="244" width="140.48000000000002" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="630.24" y="265" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">outside the loop</text><text x="48" y="320" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">creative work</text><text x="330" y="320" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">no objective judge</text><rect x="560" y="300" width="125.92" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="622.96" y="321" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">no loop at all</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. The workaround, learned stand-ins, invites reward hacking. Source: lecture-reported.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: lecture-reported</text></svg>