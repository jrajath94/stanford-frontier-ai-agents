<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Weaver: combine weak verifiers, carefully</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Filter the weak ones. Weight the rest with weak supervision on ~1% labels.</text><rect x="32" y="96" width="280" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">pool of verifiers</text><rect x="56" y="152" width="78.08" height="32" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="95.03999999999999" y="173" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">v1: weak</text><rect x="56" y="196" width="64.56" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="88.28" y="217" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">v2: ok</text><rect x="56" y="240" width="78.08" height="32" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="95.03999999999999" y="261" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">v3: weak</text><rect x="56" y="284" width="64.56" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="88.28" y="305" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">v4: ok</text><rect x="340" y="96" width="280" height="240" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="356" y="122" font-size="14" font-weight="600" fill="#5C6B7A">filter</text><text x="364" y="196" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">drop v1, v3</text><text x="364" y="228" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">keep v2, v4</text><rect x="648" y="96" width="280" height="240" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="664" y="122" font-size="14" font-weight="600" fill="#5C6B7A">weight</text><text x="672" y="196" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">weak supervision</text><text x="672" y="228" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">on ~1% labels</text><line x1="312" y1="216" x2="340" y2="216" stroke="#1B2838" stroke-width="2"/><polygon points="340,216 330.78939005997114,219.8941834230865 330.78939005997114,212.1058165769135" fill="#1B2838"/><line x1="620" y1="216" x2="648" y2="216" stroke="#1B2838" stroke-width="2"/><polygon points="648,216 638.7893900599712,219.8941834230865 638.7893900599712,212.1058165769135" fill="#1B2838"/><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Many imperfect judges beat one, if the bad ones are filtered first. Source: lecture-reported.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: lecture-reported</text></svg>