<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Intelligence has a power bill</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Google served tokens: 160 trillion to 1.3 quadrillion in months.</text><rect x="32" y="96" width="420" height="240" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">served tokens</text><text x="56" y="184" text-anchor="start" font-size="20" font-weight="600" fill="#1B2838">160T</text><text x="56" y="220" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">then</text><text x="56" y="252" text-anchor="start" font-size="28" font-weight="600" fill="#C46B2C">1.3Q</text><text x="56" y="292" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">8x in months</text><rect x="508" y="96" width="420" height="240" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="524" y="122" font-size="14" font-weight="600" fill="#5C6B7A">demand</text><text x="532" y="184" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">datacenter energy:</text><text x="532" y="220" text-anchor="start" font-size="18" font-weight="600" fill="#C46B2C">hundreds of gigawatts</text><text x="532" y="268" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">per-question cost compounds it</text><line x1="452" y1="216" x2="508" y2="216" stroke="#1B2838" stroke-width="2"/><polygon points="508,216 498.78939005997114,219.8941834230865 498.78939005997114,212.1058165769135" fill="#1B2838"/><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. Test-time scaling burns compute per question. Efficiency is not optional. Source: lecture-reported.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: lecture-reported</text></svg>