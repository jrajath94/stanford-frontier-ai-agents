<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="680" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">The engine and its stalls</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Every open problem is a way the generate-verify-train engine stalls.</text><text x="48" y="146" text-anchor="start" font-size="14" font-weight="600" fill="#1B2838">L01 loop</text><rect x="240" y="128" width="206.52" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="343.26" y="149" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">needs fast honest verifiers</text><text x="48" y="198" text-anchor="start" font-size="14" font-weight="600" fill="#1B2838">L02 generate</text><rect x="240" y="180" width="138.92000000000002" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="309.46000000000004" y="201" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">pays per question</text><text x="48" y="250" text-anchor="start" font-size="14" font-weight="600" fill="#1B2838">L03 act</text><rect x="240" y="232" width="111.88000000000001" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="295.94" y="253" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">0.9^10 = 0.35</text><text x="48" y="302" text-anchor="start" font-size="14" font-weight="600" fill="#1B2838">L05 plan</text><rect x="240" y="284" width="138.92000000000002" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="309.46000000000004" y="305" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">hundreds of calls</text><text x="48" y="354" text-anchor="start" font-size="14" font-weight="600" fill="#1B2838">L06 scale</text><rect x="240" y="336" width="159.20000000000002" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="319.6" y="357" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">selection bottleneck</text><text x="48" y="406" text-anchor="start" font-size="14" font-weight="600" fill="#1B2838">L08 learn</text><rect x="240" y="388" width="165.96" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="322.98" y="409" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">unfiltered rationales</text><text x="48" y="458" text-anchor="start" font-size="14" font-weight="600" fill="#1B2838">L09 judge</text><rect x="240" y="440" width="159.20000000000002" height="32" fill="#C46B2C" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="319.6" y="461" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">who judges the judge</text><text x="32" y="656" font-size="15" font-weight="500" fill="#1B2838">Shell 4. Fix the stall, turn the crank again. Source: original.</text><text x="928" y="656" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original</text></svg>