<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="480" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Fifty years of agents</text><text x="40" y="82" font-size="17" fill="#5C6B7A">The word is old. The LLM-powered agent is new.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><line x1="60" y1="240" x2="1060" y2="240" stroke="#1B2838" stroke-width="2"/><g><circle cx="130" cy="240" r="8" fill="#1F7A72"/><rect x="40" y="130" width="180" height="88" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="130" y="160" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">1973-1986</text><text x="130" y="184" font-size="13" fill="#5C6B7A" text-anchor="middle">Actor model (Hewitt),</text><text x="130" y="202" font-size="13" fill="#5C6B7A" text-anchor="middle">Contract Net, Minsky</text><text x="130" y="290" font-size="13" fill="#5C6B7A" text-anchor="middle">agents that</text><text x="130" y="308" font-size="13" fill="#5C6B7A" text-anchor="middle">negotiate tasks</text></g><g><circle cx="380" cy="240" r="8" fill="#1F7A72"/><rect x="290" y="130" width="180" height="88" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="380" y="160" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">1994-1995</text><text x="380" y="184" font-size="13" fill="#5C6B7A" text-anchor="middle">Maes; Wooldridge</text><text x="380" y="202" font-size="13" fill="#5C6B7A" text-anchor="middle">&amp; Jennings</text><text x="380" y="290" font-size="13" fill="#5C6B7A" text-anchor="middle">autonomy, social</text><text x="380" y="308" font-size="13" fill="#5C6B7A" text-anchor="middle">ability, reactivity</text></g><g><circle cx="630" cy="240" r="8" fill="#1F7A72"/><rect x="540" y="130" width="180" height="88" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="630" y="160" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">1998-2015</text><text x="630" y="184" font-size="13" fill="#5C6B7A" text-anchor="middle">Sutton &amp; Barto;</text><text x="630" y="202" font-size="13" fill="#5C6B7A" text-anchor="middle">DQN on Atari</text><text x="630" y="290" font-size="13" fill="#5C6B7A" text-anchor="middle">agent-environment</text><text x="630" y="308" font-size="13" fill="#5C6B7A" text-anchor="middle">loop, RL rewards</text></g><g><circle cx="900" cy="240" r="10" fill="#C46B2C"/><rect x="790" y="130" width="220" height="88" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="2"/><text x="900" y="160" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">2017-today</text><text x="900" y="184" font-size="13" fill="#5C6B7A" text-anchor="middle">GPT-3, ChatGPT,</text><text x="900" y="202" font-size="13" fill="#5C6B7A" text-anchor="middle">ReAct, AutoGPT</text><text x="900" y="290" font-size="13" fill="#5C6B7A" text-anchor="middle">reasoning + tools</text><text x="900" y="308" font-size="13" fill="#5C6B7A" text-anchor="middle">in language</text></g><text x="40" y="380" font-size="15" font-weight="450" fill="#1B2838">The LLM era changed the interface, not the idea. Agents still perceive, decide, and act. They now do it with words.</text><text x="40" y="412" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 1: eras as five labeled positions on one line.</text></svg>