<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="520" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Why reasoning helps</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Reasoning is an internal action that updates the agent's own state.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="130" width="480" height="280" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="280" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Before: observation maps straight to action</text><rect x="80" y="200" width="400" height="56" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="280" y="234" font-size="14" fill="#1B2838" text-anchor="middle">Obs: salt is out, I see a cabinet</text><rect x="80" y="300" width="400" height="56" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="280" y="334" font-size="14" fill="#1B2838" text-anchor="middle">Act: ???</text><line x1="280" y1="256" x2="280" y2="300" stroke="#1B2838" stroke-width="1.5"/><polygon points="274,290 280,300 286,290" fill="#1B2838" stroke="none"/><text x="300" y="285" font-size="13" fill="#C46B2C">mapping is hard</text><rect x="600" y="130" width="480" height="280" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="840" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">After: reasoning sits in between</text><rect x="640" y="190" width="400" height="48" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="840" y="220" font-size="14" fill="#1B2838" text-anchor="middle">Obs: salt is out, I see a cabinet</text><rect x="640" y="252" width="400" height="48" rx="8" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="840" y="282" font-size="14" fill="#1B2838" text-anchor="middle">Thought: find soy sauce in the cabinet</text><rect x="640" y="314" width="400" height="48" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="840" y="344" font-size="14" fill="#1B2838" text-anchor="middle">Act: turn right, open cabinet</text><g stroke="#1B2838" stroke-width="1.5" fill="none"><line x1="840" y1="238" x2="840" y2="252"/><line x1="840" y1="300" x2="840" y2="314"/></g><text x="560" y="280" font-size="20" fill="#1F7A72">&#8594;</text><text x="40" y="452" font-size="15" font-weight="450" fill="#1B2838">The thought generalizes and aligns: it transfers to new kitchens and states the intent.</text><text x="40" y="484" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 4: the new symbol is Thought, the internal action.</text></svg>