<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="540" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Reflexion: learn from the failed run</text><text x="40" y="82" font-size="17" fill="#5C6B7A">The agent reflects in words, keeps the reflection, and retries.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><g><rect x="60" y="150" width="200" height="90" rx="12" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="160" y="186" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Run the task</text><text x="160" y="210" font-size="13" fill="#5C6B7A" text-anchor="middle">act, observe,</text><text x="160" y="228" font-size="13" fill="#5C6B7A" text-anchor="middle">repeat</text></g><g><rect x="330" y="150" width="200" height="90" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="430" y="186" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Fail</text><text x="430" y="210" font-size="13" fill="#5C6B7A" text-anchor="middle">feedback signal:</text><text x="430" y="228" font-size="13" fill="#5C6B7A" text-anchor="middle">tests, env, score</text></g><g><rect x="600" y="150" width="200" height="90" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="700" y="186" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Reflect</text><text x="700" y="210" font-size="13" fill="#5C6B7A" text-anchor="middle">verbal summary:</text><text x="700" y="228" font-size="13" fill="#5C6B7A" text-anchor="middle">"I searched too soon"</text></g><g><rect x="870" y="150" width="200" height="90" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="970" y="186" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Store</text><text x="970" y="210" font-size="13" fill="#5C6B7A" text-anchor="middle">keep the reflection</text><text x="970" y="228" font-size="13" fill="#5C6B7A" text-anchor="middle">as a self-hint</text></g><g stroke="#1B2838" stroke-width="1.5" fill="none"><line x1="260" y1="195" x2="330" y2="195"/><polygon points="330,189 340,195 330,201" fill="#1B2838" stroke="none"/><line x1="530" y1="195" x2="600" y2="195"/><polygon points="600,189 610,195 600,201" fill="#1B2838" stroke="none"/><line x1="800" y1="195" x2="870" y2="195"/><polygon points="870,189 880,195 870,201" fill="#1B2838" stroke="none"/></g><path d="M 970 240 L 970 330 L 160 330 L 160 240" fill="none" stroke="#1F7A72" stroke-width="1.5" stroke-dasharray="6 4"/><polygon points="154,250 160,240 166,250" fill="#1F7A72" stroke="none"/><text x="565" y="322" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">retry: the next run reads the stored hint first</text><rect x="60" y="360" width="1010" height="80" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="394" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Long failed trajectories distill into short verbal lessons. Shinn et al. (2023).</text><text x="84" y="418" font-size="13" fill="#5C6B7A" text-anchor="start">Self-consistency (Wang et al., 2023) is the same idea at answer time: sample many reasoning paths, take the majority answer.</text><text x="40" y="482" font-size="15" font-weight="450" fill="#1B2838">Reflection is verbal reinforcement: no weight update, only better words in memory.</text><text x="40" y="512" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper. Shell 3: apply the rule: failed trace becomes stored hint.</text></svg>