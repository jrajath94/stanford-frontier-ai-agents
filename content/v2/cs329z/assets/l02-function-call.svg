<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="620" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Function calling: the schema travels in the request</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">The contract is typed JSON. The model fills fields; the API validates them.</text>
<line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="596" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
<text x="40" y="132" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">BEFORE: prose about a tool</text>
<g><rect x="40" y="152" width="440" height="150" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="260" y="186" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">“You have a read_file tool.</text>
<text x="260" y="212" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">To read a file, say read_file</text>
<text x="260" y="232" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">and the path.”</text>
<text x="260" y="252" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">no shape, nothing checked</text>
</g>
<line x1="520" y1="240" x2="600" y2="240" stroke="#1E4D8C" stroke-width="1.5" fill="none"/>
<line x1="600" y1="240" x2="589" y2="236" stroke="#1E4D8C" stroke-width="1.5"/>
<line x1="600" y1="240" x2="589" y2="244" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="560" y="232" font-size="13" fill="#1E4D8C" text-anchor="middle">replace with a schema</text>
<text x="640" y="132" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">AFTER: the request carries functions</text>
<text x="640" y="168" font-size="14" font-weight="450" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">request.tools = [{</text>
<text x="640" y="194" font-size="14" font-weight="450" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">  &quot;name&quot;: &quot;read_file&quot;,</text>
<text x="640" y="220" font-size="14" font-weight="450" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">  &quot;parameters&quot;: {</text>
<text x="640" y="246" font-size="14" font-weight="450" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">    &quot;path&quot;: {&quot;type&quot;: &quot;string&quot;}</text>
<text x="640" y="272" font-size="14" font-weight="450" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">  }</text>
<text x="640" y="298" font-size="14" font-weight="450" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">}]</text>
<g><rect x="640" y="330" width="440" height="130" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="860" y="364" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">assistant: tool_calls</text>
<text x="860" y="390" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">[{&quot;name&quot;: &quot;read_file&quot;,</text>
<text x="860" y="410" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">  &quot;arguments&quot;: {&quot;path&quot;: &quot;test.py&quot;}}]</text>
</g>
<line x1="860" y1="310" x2="860" y2="330" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="860" y1="330" x2="864" y2="319" stroke="#1B2838" stroke-width="1.5"/>
<line x1="860" y1="330" x2="856" y2="319" stroke="#1B2838" stroke-width="1.5"/>
<text x="40" y="500" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">The model returns arguments as JSON, not prose.</text>
<text x="40" y="524" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">The runtime validates against the schema before anything executes. That is the validate stage, in the API.</text>
</svg>