<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="460" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">MCP: one plug for every tool</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Model Context Protocol. A standard client-server contract for tools and data.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="150" width="260" height="120" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="190" y="190" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Host</text><text x="190" y="216" font-size="13" fill="#5C6B7A" text-anchor="middle">the agent app</text><text x="190" y="236" font-size="13" fill="#5C6B7A" text-anchor="middle">(your program)</text><rect x="430" y="150" width="260" height="120" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="190" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Client</text><text x="560" y="216" font-size="13" fill="#5C6B7A" text-anchor="middle">one per server,</text><text x="560" y="236" font-size="13" fill="#5C6B7A" text-anchor="middle">inside the host</text><rect x="800" y="150" width="260" height="120" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="930" y="190" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Server</text><text x="930" y="216" font-size="13" fill="#5C6B7A" text-anchor="middle">exposes tools, data,</text><text x="930" y="236" font-size="13" fill="#5C6B7A" text-anchor="middle">prompts</text><g stroke="#1B2838" stroke-width="1.5" fill="none"><line x1="320" y1="210" x2="430" y2="210"/><polygon points="430,204 440,210 430,216" fill="#1B2838" stroke="none"/><line x1="690" y1="210" x2="800" y2="210"/><polygon points="800,204 810,210 800,216" fill="#1B2838" stroke="none"/></g><text x="375" y="202" font-size="13" fill="#5C6B7A" text-anchor="middle">spawns</text><text x="745" y="202" font-size="13" fill="#5C6B7A" text-anchor="middle">calls</text><rect x="60" y="310" width="1000" height="56" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="345" font-size="14" fill="#1B2838" text-anchor="start">Before MCP: N agents x M tools integrations. After MCP: each side speaks one protocol.</text><text x="40" y="410" font-size="15" font-weight="450" fill="#1B2838">The tool-call anatomy stays the same. MCP standardizes the plumbing underneath.</text><text x="40" y="440" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 2: three roles, two named edges.</text></svg>