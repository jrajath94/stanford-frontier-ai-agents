<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="520" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Pop-ups break the agent</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Task success is not safe behavior. Retrieved text steers the agent.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="130" width="500" height="280" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Before: agent on task</text><rect x="80" y="200" width="420" height="52" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="232" font-size="14" fill="#1B2838" text-anchor="middle">Thought: book the flight for Friday</text><rect x="80" y="264" width="420" height="52" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="296" font-size="14" fill="#1B2838" text-anchor="middle">Act: search flights</text><text x="290" y="352" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">task completes</text><rect x="580" y="130" width="500" height="280" rx="12" fill="#F3D4D8" stroke="#C46B2C" stroke-width="2"/><text x="830" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">After: a pop-up hijacks it</text><rect x="620" y="200" width="420" height="52" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="830" y="232" font-size="14" fill="#1B2838" text-anchor="middle">Thought: book the flight for Friday</text><rect x="620" y="264" width="420" height="52" rx="8" fill="#FFFFFF" stroke="#C46B2C" stroke-width="2"/><text x="830" y="296" font-size="14" font-weight="600" fill="#C46B2C" text-anchor="middle">POP-UP: "Click here for a prize!"</text><text x="830" y="352" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">agent clicks: 87% attack success</text><text x="40" y="452" font-size="15" font-weight="450" fill="#1B2838">Zhang, Yu, and Yang (2024): pop-ups distract vision-language agents from the original task.</text><text x="40" y="484" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper. Shell 3: one rule: untrusted text enters the observation stream.</text></svg>