<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="480" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">RAG in three steps</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Give the model facts at answer time instead of baking them into weights.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><g><rect x="60" y="150" width="280" height="130" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="200" y="190" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">1. Retrieve</text><text x="200" y="216" font-size="13" fill="#5C6B7A" text-anchor="middle">search documents</text><text x="200" y="236" font-size="13" fill="#5C6B7A" text-anchor="middle">for relevant info</text></g><g><rect x="420" y="150" width="280" height="130" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="190" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">2. Augment</text><text x="560" y="216" font-size="13" fill="#5C6B7A" text-anchor="middle">add context to the</text><text x="560" y="236" font-size="13" fill="#5C6B7A" text-anchor="middle">user's question</text></g><g><rect x="780" y="150" width="280" height="130" rx="12" fill="#D9E8D3" stroke="#D9D3C7" stroke-width="1.5"/><text x="920" y="190" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">3. Generate</text><text x="920" y="216" font-size="13" fill="#5C6B7A" text-anchor="middle">LLM answers using</text><text x="920" y="236" font-size="13" fill="#5C6B7A" text-anchor="middle">the retrieved facts</text></g><g stroke="#1B2838" stroke-width="1.5" fill="none"><line x1="340" y1="215" x2="420" y2="215"/><polygon points="420,209 430,215 420,221" fill="#1B2838" stroke="none"/><line x1="700" y1="215" x2="780" y2="215"/><polygon points="780,209 790,215 780,221" fill="#1B2838" stroke="none"/></g><rect x="60" y="320" width="1000" height="64" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="358" font-size="14" fill="#1B2838" text-anchor="start">Why: dynamic (documents update without retraining), interpretable (the answer can cite its sources).</text><text x="40" y="428" font-size="15" font-weight="450" fill="#1B2838">The full pipeline, indexing, retrieval methods, and failure modes live in the RAG lessons.</text><text x="40" y="458" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 2: three stages as three labeled blocks.</text></svg>