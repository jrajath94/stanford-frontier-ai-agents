<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Anatomy of a tool call</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Four stages. The example: "What does test.py contain?"</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><g><rect x="40" y="140" width="230" height="200" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="155" y="176" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">1. Select</text><text x="155" y="204" font-size="13" fill="#5C6B7A" text-anchor="middle">which tool, from the</text><text x="155" y="224" font-size="13" fill="#5C6B7A" text-anchor="middle">schemas in context</text><rect x="60" y="250" width="190" height="40" rx="999" fill="#1F7A72" stroke="#D9D3C7" stroke-width="1.5"/><text x="155" y="276" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">read_file</text></g><g><rect x="310" y="140" width="230" height="200" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="425" y="176" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">2. Arguments</text><text x="425" y="204" font-size="13" fill="#5C6B7A" text-anchor="middle">typed fields, filled</text><text x="425" y="224" font-size="13" fill="#5C6B7A" text-anchor="middle">from the task</text><rect x="330" y="250" width="190" height="40" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="425" y="276" font-size="13" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">{"path": "test.py"}</text></g><g><rect x="580" y="140" width="230" height="200" rx="12" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5"/><text x="695" y="176" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">3. Validate</text><text x="695" y="204" font-size="13" fill="#5C6B7A" text-anchor="middle">schema check,</text><text x="695" y="224" font-size="13" fill="#5C6B7A" text-anchor="middle">constrained decoding</text><rect x="600" y="250" width="190" height="40" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="695" y="276" font-size="13" fill="#1B2838" text-anchor="middle">path: string, OK</text></g><g><rect x="850" y="140" width="230" height="200" rx="12" fill="#D9E8D3" stroke="#D9D3C7" stroke-width="1.5"/><text x="965" y="176" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">4. Execute</text><text x="965" y="204" font-size="13" fill="#5C6B7A" text-anchor="middle">sandboxed; result</text><text x="965" y="224" font-size="13" fill="#5C6B7A" text-anchor="middle">returns to context</text><rect x="870" y="250" width="190" height="40" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="965" y="276" font-size="13" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">def add(a, b): ...</text></g><g stroke="#1B2838" stroke-width="1.5" fill="none"><line x1="270" y1="240" x2="310" y2="240"/><polygon points="310,234 320,240 310,246" fill="#1B2838" stroke="none"/><line x1="540" y1="240" x2="580" y2="240"/><polygon points="580,234 590,240 580,246" fill="#1B2838" stroke="none"/><line x1="810" y1="240" x2="850" y2="240"/><polygon points="850,234 860,240 850,246" fill="#1B2838" stroke="none"/></g><rect x="40" y="380" width="1040" height="72" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="64" y="412" font-size="14" fill="#1B2838" text-anchor="start">Toolformer (2023): the model learns which API to call, when, with what arguments, and how to use the result.</text><text x="64" y="436" font-size="13" fill="#5C6B7A" text-anchor="start">Gorilla (Patil et al., 2023): connects LLMs to massive API collections.</text><text x="40" y="496" font-size="15" font-weight="450" fill="#1B2838">Validate before execute. A bad argument never reaches the world.</text><text x="40" y="528" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 4: the new symbol is the validated call.</text></svg>