<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="520" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Workflows vs agents: who decides the steps?</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Both are compound AI systems. The difference is who writes the plan.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="130" width="500" height="290" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Workflow: code fixes the steps</text><g><rect x="80" y="196" width="420" height="48" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="226" font-size="14" fill="#1B2838" text-anchor="middle">Step 1: sample solutions</text><rect x="80" y="256" width="420" height="48" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="286" font-size="14" fill="#1B2838" text-anchor="middle">Step 2: execute and score</text><rect x="80" y="316" width="420" height="48" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="346" font-size="14" fill="#1B2838" text-anchor="middle">Step 3: pick the best</text></g><text x="290" y="398" font-size="13" fill="#5C6B7A" text-anchor="middle">Example: AlphaCode 2, up to 1M samples</text><rect x="580" y="130" width="500" height="290" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="830" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Agent: the LLM decides the steps</text><g><rect x="620" y="196" width="420" height="48" rx="999" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="830" y="226" font-size="14" fill="#1B2838" text-anchor="middle">Thought: which step next?</text><rect x="620" y="256" width="420" height="48" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="830" y="286" font-size="14" fill="#1B2838" text-anchor="middle">Act: chosen by the model</text><rect x="620" y="316" width="420" height="48" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="830" y="346" font-size="14" fill="#1B2838" text-anchor="middle">Obs: result feeds the next choice</text></g><text x="830" y="398" font-size="13" fill="#5C6B7A" text-anchor="middle">Example: SWE-agent</text><text x="40" y="462" font-size="15" font-weight="450" fill="#1B2838">Zaharia et al. (2024): the shift from models to compound AI systems. The scaffold is half the score.</text><text x="40" y="494" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper. Shell 3: apply the rule: fixed steps versus decided steps.</text></svg>