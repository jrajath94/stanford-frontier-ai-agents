<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="600" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The decoder-only stack</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Tokens in at the bottom. Next-token probabilities out at the top.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><g><rect x="380" y="130" width="360" height="56" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="164" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Softmax: probabilities</text></g><g><rect x="380" y="198" width="360" height="56" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="232" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">LM head</text></g><g><rect x="380" y="266" width="360" height="56" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="300" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Layer norm</text></g><g><rect x="380" y="334" width="360" height="90" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="368" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Transformer block x N</text><text x="560" y="394" font-size="13" fill="#5C6B7A" text-anchor="middle">causal attention + feed-forward</text></g><g><rect x="380" y="436" width="360" height="56" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="470" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Embedding + positions</text></g><g stroke="#1B2838" stroke-width="1.5" fill="none"><line x1="560" y1="186" x2="560" y2="198"/><line x1="560" y1="254" x2="560" y2="266"/><line x1="560" y1="322" x2="560" y2="334"/><line x1="560" y1="424" x2="560" y2="436"/></g><text x="790" y="380" font-size="13" fill="#5C6B7A">mechanics in CS336 L03-L04:</text><text x="790" y="400" font-size="13" fill="#5C6B7A">attention, residuals, norms</text><text x="40" y="540" font-size="15" font-weight="450" fill="#1B2838">One input token becomes one output distribution. Sampling picks the winner.</text><text x="40" y="570" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 2: the stack as five named blocks.</text></svg>