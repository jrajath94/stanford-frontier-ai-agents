<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="520" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Prefill and decode</text><text x="40" y="82" font-size="17" fill="#5C6B7A">One prompt, two phases. The KV cache makes the second phase cheap.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="130" width="500" height="290" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Prefill: process the prompt</text><text x="290" y="196" font-size="13" fill="#5C6B7A" text-anchor="middle">all prompt tokens at once,</text><text x="290" y="216" font-size="13" fill="#5C6B7A" text-anchor="middle">parallel, compute-bound</text><g><rect x="80" y="250" width="80" height="44" rx="8" fill="#1F7A72"/><text x="120" y="278" font-size="13" fill="#FFFFFF" text-anchor="middle">The</text><rect x="170" y="250" width="80" height="44" rx="8" fill="#1F7A72"/><text x="210" y="278" font-size="13" fill="#FFFFFF" text-anchor="middle">class</text><rect x="260" y="250" width="80" height="44" rx="8" fill="#1F7A72"/><text x="300" y="278" font-size="13" fill="#FFFFFF" text-anchor="middle">was</text><rect x="350" y="250" width="80" height="44" rx="8" fill="#1F7A72"/><text x="390" y="278" font-size="13" fill="#FFFFFF" text-anchor="middle">about</text></g><text x="290" y="340" font-size="13" fill="#5C6B7A" text-anchor="middle">build the KV cache here</text><text x="290" y="392" font-size="13" fill="#5C6B7A" text-anchor="middle">roofline: high arithmetic intensity</text><rect x="580" y="130" width="500" height="290" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="830" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Decode: one token at a time</text><text x="830" y="196" font-size="13" fill="#5C6B7A" text-anchor="middle">each step reads the whole</text><text x="830" y="216" font-size="13" fill="#5C6B7A" text-anchor="middle">KV cache, memory-bound</text><g><rect x="660" y="250" width="80" height="44" rx="8" fill="#C46B2C"/><text x="700" y="278" font-size="13" fill="#FFFFFF" text-anchor="middle">to</text><rect x="750" y="250" width="80" height="44" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="790" y="278" font-size="13" fill="#5C6B7A" text-anchor="middle">be</text><rect x="840" y="250" width="80" height="44" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="880" y="278" font-size="13" fill="#5C6B7A" text-anchor="middle">begin</text></g><text x="830" y="340" font-size="13" fill="#5C6B7A" text-anchor="middle">cache grows O(n) in context</text><text x="830" y="392" font-size="13" fill="#5C6B7A" text-anchor="middle">roofline: low arithmetic intensity</text><text x="40" y="468" font-size="15" font-weight="450" fill="#1B2838">Agent loops are decode-heavy: many short generations. Speculative decoding drafts with a small model, verifies with the big one.</text><text x="40" y="498" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 3: one rule: parallel prefill, sequential decode.</text></svg>