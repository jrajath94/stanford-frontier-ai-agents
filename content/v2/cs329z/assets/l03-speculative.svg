<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="480" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Speculative decoding</text><text x="40" y="82" font-size="17" fill="#5C6B7A">A small draft model guesses. The target model checks.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="150" width="460" height="170" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="186" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Draft model (small, fast)</text><g font-family="'IBM Plex Mono', ui-monospace, monospace"><rect x="90" y="210" width="90" height="44" rx="8" fill="#E6E2DA"/><text x="135" y="238" font-size="13" fill="#1B2838" text-anchor="middle">time</text><rect x="190" y="210" width="90" height="44" rx="8" fill="#E6E2DA"/><text x="235" y="238" font-size="13" fill="#1B2838" text-anchor="middle">a</text><rect x="290" y="210" width="110" height="44" rx="8" fill="#E6E2DA"/><text x="345" y="238" font-size="13" fill="#1B2838" text-anchor="middle">there</text><rect x="410" y="210" width="90" height="44" rx="8" fill="#E6E2DA"/><text x="455" y="238" font-size="13" fill="#1B2838" text-anchor="middle">upon</text></g><text x="290" y="292" font-size="13" fill="#5C6B7A" text-anchor="middle">proposes 4 tokens cheaply</text><rect x="600" y="150" width="460" height="170" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="830" y="186" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Target model (big)</text><text x="830" y="224" font-size="13" fill="#1B2838" text-anchor="middle">verifies all 4 in one pass</text><text x="830" y="250" font-size="13" fill="#1F7A72" text-anchor="middle">accept the run, keep the</text><text x="830" y="270" font-size="13" fill="#1F7A72" text-anchor="middle">longest correct prefix</text><text x="830" y="296" font-size="13" fill="#5C6B7A" text-anchor="middle">some domains are more</text><text x="830" y="314" font-size="13" fill="#5C6B7A" text-anchor="middle">predictable than others</text><g stroke="#1B2838" stroke-width="1.5" fill="none"><line x1="520" y1="235" x2="600" y2="235"/><polygon points="600,229 610,235 600,241" fill="#1B2838" stroke="none"/></g><text x="560" y="227" font-size="13" fill="#5C6B7A" text-anchor="middle">check</text><text x="40" y="372" font-size="15" font-weight="450" fill="#1B2838">Speedup comes from predictability. Formulaic agent outputs draft well.</text><text x="40" y="404" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 3: one rule: draft cheaply, verify in parallel.</text></svg>