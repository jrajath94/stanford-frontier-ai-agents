<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="500" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The training ladder</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Each stage changes the data mix. Each stage changes the model.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><g><rect x="40" y="150" width="230" height="170" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="155" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Pretrain</text><text x="155" y="214" font-size="13" fill="#5C6B7A" text-anchor="middle">web-scale text,</text><text x="155" y="234" font-size="13" fill="#5C6B7A" text-anchor="middle">next-token loss</text><text x="155" y="270" font-size="13" fill="#5C6B7A" text-anchor="middle">dedup, filters,</text><text x="155" y="290" font-size="13" fill="#5C6B7A" text-anchor="middle">data mixing</text></g><g><rect x="310" y="150" width="230" height="170" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="425" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Midtrain</text><text x="425" y="214" font-size="13" fill="#5C6B7A" text-anchor="middle">shift the mix toward</text><text x="425" y="234" font-size="13" fill="#5C6B7A" text-anchor="middle">target domains</text><text x="425" y="270" font-size="13" fill="#5C6B7A" text-anchor="middle">math, code heavy</text></g><g><rect x="580" y="150" width="230" height="170" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="695" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Post-train</text><text x="695" y="214" font-size="13" fill="#5C6B7A" text-anchor="middle">SFT, RLHF/DPO,</text><text x="695" y="234" font-size="13" fill="#5C6B7A" text-anchor="middle">RLVR</text><text x="695" y="270" font-size="13" fill="#5C6B7A" text-anchor="middle">verifiable rewards:</text><text x="695" y="290" font-size="13" fill="#5C6B7A" text-anchor="middle">tests, proofs</text></g><g><rect x="850" y="150" width="230" height="170" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="965" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Agent training</text><text x="965" y="214" font-size="13" fill="#5C6B7A" text-anchor="middle">SWE-Smith: scale</text><text x="965" y="234" font-size="13" fill="#5C6B7A" text-anchor="middle">software-engineering</text><text x="965" y="254" font-size="13" fill="#5C6B7A" text-anchor="middle">agent data</text></g><g stroke="#1B2838" stroke-width="1.5" fill="none"><line x1="270" y1="235" x2="310" y2="235"/><polygon points="310,229 320,235 310,241" fill="#1B2838" stroke="none"/><line x1="540" y1="235" x2="580" y2="235"/><polygon points="580,229 590,235 580,241" fill="#1B2838" stroke="none"/><line x1="810" y1="235" x2="850" y2="235"/><polygon points="850,229 860,235 850,241" fill="#1B2838" stroke="none"/></g><text x="40" y="372" font-size="15" font-weight="450" fill="#1B2838">RLVR makes the reward checkable: unit tests, Lean proofs, exact match. Great for math and code.</text><text x="40" y="404" font-size="13" fill="#5C6B7A">Human feedback has traps: unreliable annotators, sycophancy, bad incentives. The verifier design is the work.</text><text x="40" y="446" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 2: four stages as four blocks in order.</text></svg>