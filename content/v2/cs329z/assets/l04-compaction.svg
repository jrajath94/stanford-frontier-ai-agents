<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="520" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Compaction: summarize to survive</text><text x="40" y="82" font-size="17" fill="#5C6B7A">The context is full. Decide what the new context keeps.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="150" width="280" height="200" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="200" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Full context</text><g><rect x="90" y="220" width="220" height="28" rx="4" fill="#E6E2DA"/><rect x="90" y="254" width="220" height="28" rx="4" fill="#E6E2DA"/><rect x="90" y="288" width="220" height="28" rx="4" fill="#E6E2DA"/><rect x="90" y="322" width="220" height="10" rx="4" fill="#C46B2C"/></g><rect x="420" y="150" width="280" height="200" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Summarize</text><text x="560" y="230" font-size="13" fill="#5C6B7A" text-anchor="middle">the model compresses</text><text x="560" y="250" font-size="13" fill="#5C6B7A" text-anchor="middle">the trace into a</text><text x="560" y="270" font-size="13" fill="#5C6B7A" text-anchor="middle">summary + key facts</text><text x="560" y="310" font-size="13" fill="#5C6B7A" text-anchor="middle">what to keep is</text><text x="560" y="330" font-size="13" fill="#5C6B7A" text-anchor="middle">the decision</text><rect x="780" y="150" width="280" height="200" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="920" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">New context</text><rect x="810" y="220" width="220" height="40" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="920" y="246" font-size="13" fill="#1B2838" text-anchor="middle">summary + open loops</text><text x="920" y="300" font-size="13" fill="#5C6B7A" text-anchor="middle">shorter, still sufficient</text><g stroke="#1B2838" stroke-width="1.5" fill="none"><line x1="340" y1="250" x2="420" y2="250"/><polygon points="420,244 430,250 420,256" fill="#1B2838" stroke="none"/><line x1="700" y1="250" x2="780" y2="250"/><polygon points="780,244 790,250 780,256" fill="#1B2838" stroke="none"/></g><rect x="60" y="390" width="1000" height="52" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="422" font-size="14" fill="#1B2838" text-anchor="start">Keep too much: you compact again soon. Drop too much: you lose what the task needs.</text><text x="40" y="484" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 3: one rule: compress, keep the open loops.</text></svg>