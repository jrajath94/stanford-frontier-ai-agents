<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">What goes in the context</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Five ingredients. Every token costs bandwidth on every decode step.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><g><rect x="40" y="140" width="190" height="180" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="135" y="200" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">System</text><text x="135" y="224" font-size="13" fill="#5C6B7A" text-anchor="middle">prompt</text><text x="135" y="258" font-size="12" fill="#5C6B7A" text-anchor="middle">fixed, cached</text></g><g><rect x="262" y="140" width="190" height="180" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="357" y="200" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Message</text><text x="357" y="224" font-size="13" fill="#5C6B7A" text-anchor="middle">history</text><text x="357" y="258" font-size="12" fill="#5C6B7A" text-anchor="middle">grows each turn</text></g><g><rect x="484" y="140" width="190" height="180" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="579" y="200" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Memories</text><text x="579" y="224" font-size="13" fill="#5C6B7A" text-anchor="middle">retrieved,</text><text x="579" y="244" font-size="13" fill="#5C6B7A" text-anchor="middle">not dumped</text><text x="579" y="278" font-size="12" fill="#5C6B7A" text-anchor="middle">retrieve top-k</text></g><g><rect x="706" y="140" width="190" height="180" rx="12" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="801" y="200" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Tool</text><text x="801" y="224" font-size="13" fill="#5C6B7A" text-anchor="middle">results</text><text x="801" y="258" font-size="12" fill="#5C6B7A" text-anchor="middle">append only</text></g><g><rect x="928" y="140" width="152" height="180" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="1004" y="200" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Files</text><text x="1004" y="224" font-size="13" fill="#5C6B7A" text-anchor="middle">attached</text><text x="1004" y="258" font-size="12" fill="#5C6B7A" text-anchor="middle">as needed</text></g><rect x="40" y="360" width="1040" height="72" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="64" y="392" font-size="14" fill="#1B2838" text-anchor="start">Avoid bloat: a few tools beat fifty. Pi ships with read, write, edit, bash.</text><text x="64" y="416" font-size="13" fill="#5C6B7A" text-anchor="start">Retrieve memories and files on demand instead of stuffing them in.</text><text x="40" y="478" font-size="15" font-weight="450" fill="#1B2838">There is no one right context. Evaluate choices empirically with your own evals.</text><text x="40" y="510" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 2: five blocks, one cost rule.</text></svg>