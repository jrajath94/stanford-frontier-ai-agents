<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="520" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Reasoning effort is a dial</text><text x="40" y="82" font-size="17" fill="#5C6B7A">More thinking, better answers, higher cost. Set it per task.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><g><rect x="40" y="150" width="300" height="220" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="190" y="188" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Low</text><text x="190" y="220" font-size="13" fill="#5C6B7A" text-anchor="middle">short answer,</text><text x="190" y="240" font-size="13" fill="#5C6B7A" text-anchor="middle">cheap, fast</text><rect x="80" y="270" width="220" height="16" rx="8" fill="#E6E2DA"/><rect x="80" y="270" width="60" height="16" rx="8" fill="#1F7A72"/><text x="190" y="318" font-size="13" fill="#5C6B7A" text-anchor="middle">simple lookups</text></g><g><rect x="410" y="150" width="300" height="220" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="188" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Medium</text><text x="560" y="220" font-size="13" fill="#5C6B7A" text-anchor="middle">some reasoning,</text><text x="560" y="240" font-size="13" fill="#5C6B7A" text-anchor="middle">medium cost</text><rect x="450" y="270" width="220" height="16" rx="8" fill="#E6E2DA"/><rect x="450" y="270" width="130" height="16" rx="8" fill="#C46B2C"/><text x="560" y="318" font-size="13" fill="#5C6B7A" text-anchor="middle">most agent steps</text></g><g><rect x="740" y="150" width="340" height="220" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="2"/><text x="910" y="188" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">High</text><text x="910" y="220" font-size="13" fill="#5C6B7A" text-anchor="middle">long reasoning,</text><text x="910" y="240" font-size="13" fill="#5C6B7A" text-anchor="middle">expensive</text><rect x="780" y="270" width="260" height="16" rx="8" fill="#E6E2DA"/><rect x="780" y="270" width="240" height="16" rx="8" fill="#1E4D8C"/><text x="910" y="318" font-size="13" fill="#5C6B7A" text-anchor="middle">hard math, deep bugs</text></g><rect x="40" y="400" width="1040" height="48" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="64" y="430" font-size="14" fill="#1B2838" text-anchor="start">Kimi K3 trains the dial: reward 1 if correct, 0 if wrong, -1 if wrong and over budget.</text><text x="40" y="484" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 3: one rule: effort scales with difficulty.</text></svg>