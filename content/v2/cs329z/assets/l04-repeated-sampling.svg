<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="500" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Repeated sampling: coverage grows</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Sample many times. The chance that one sample is right keeps rising.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><g><rect x="60" y="150" width="300" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="210" y="186" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">1 sample</text><circle cx="210" cy="260" r="34" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="210" y="266" font-size="13" fill="#1B2838" text-anchor="middle">wrong</text><text x="210" y="322" font-size="13" fill="#5C6B7A" text-anchor="middle">coverage: low</text></g><g><rect x="410" y="150" width="300" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="186" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">10 samples</text><g><circle cx="500" cy="250" r="20" fill="#F3D4D8" stroke="#D9D3C7"/><circle cx="560" cy="250" r="20" fill="#F3D4D8" stroke="#D9D3C7"/><circle cx="620" cy="250" r="20" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="620" y="255" font-size="11" fill="#1F7A72" text-anchor="middle">right</text></g><text x="560" y="322" font-size="13" fill="#5C6B7A" text-anchor="middle">coverage: rising</text></g><g><rect x="760" y="150" width="300" height="200" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="910" y="186" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">1000 samples</text><g><circle cx="850" cy="250" r="16" fill="#F3D4D8" stroke="#D9D3C7"/><circle cx="890" cy="250" r="16" fill="#F3D4D8" stroke="#D9D3C7"/><circle cx="930" cy="250" r="16" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><circle cx="970" cy="250" r="16" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/></g><text x="910" y="322" font-size="13" fill="#5C6B7A" text-anchor="middle">coverage: high (verifier picks)</text></g><text x="40" y="400" font-size="15" font-weight="450" fill="#1B2838">Large Language Monkeys (2024): with a verifier, more samples keep helping. Without one, vote.</text><text x="40" y="432" font-size="13" fill="#5C6B7A">Self-consistency is the no-verifier version: majority vote over reasoning paths, taught in the intro lesson.</text><text x="40" y="470" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper. Shell 2: count the right answers as samples grow.</text></svg>