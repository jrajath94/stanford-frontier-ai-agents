<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="640" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Tree of thoughts: search over reasoning</text><text x="40" y="82" font-size="17" fill="#5C6B7A">One chain can walk into a dead end. A tree explores several and keeps the best.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="132" font-size="14" font-weight="600" fill="#5C6B7A">BEFORE: one chain</text>
<rect x="40" y="160" width="220" height="80" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="150" y="194" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">step 1</text><text x="150" y="220" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">one thought</text>
<rect x="40" y="256" width="220" height="80" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="150" y="290" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">step 2</text><text x="150" y="316" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">one thought</text>
<rect x="40" y="352" width="220" height="80" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="150" y="386" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">step 3: dead end</text><text x="150" y="412" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">no way back</text>
<line x1="150" y1="240" x2="150" y2="256" stroke="#1B2838" stroke-width="1.5" fill="none"/><line x1="150" y1="256" x2="145" y2="245" stroke="#1B2838" stroke-width="1.5"/><line x1="150" y1="256" x2="155" y2="245" stroke="#1B2838" stroke-width="1.5"/><line x1="150" y1="336" x2="150" y2="352" stroke="#1B2838" stroke-width="1.5" fill="none"/><line x1="150" y1="352" x2="145" y2="341" stroke="#1B2838" stroke-width="1.5"/><line x1="150" y1="352" x2="155" y2="341" stroke="#1B2838" stroke-width="1.5"/>
<line x1="300" y1="280" x2="400" y2="280" stroke="#1E4D8C" stroke-width="1.5" fill="none"/>
<line x1="400" y1="280" x2="389" y2="276" stroke="#1E4D8C" stroke-width="1.5"/>
<line x1="400" y1="280" x2="389" y2="284" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="350" y="272" font-size="13" fill="#1E4D8C" text-anchor="middle">branch instead</text>
<text x="440" y="132" font-size="14" font-weight="600" fill="#5C6B7A">AFTER: a tree with an evaluator</text>
<rect x="440" y="160" width="180" height="80" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="530" y="194" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">step 1</text><text x="530" y="220" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">one thought</text>
<rect x="420" y="300" width="180" height="80" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="510" y="334" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">candidate A</text><text x="510" y="360" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">kept</text>
<rect x="640" y="300" width="180" height="80" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="730" y="334" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">candidate B</text><text x="730" y="360" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">pruned</text>
<rect x="860" y="300" width="180" height="80" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="950" y="334" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">candidate C</text><text x="950" y="360" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">kept</text>
<line x1="480" y1="240" x2="480" y2="300" stroke="#1B2838" stroke-width="1.5" fill="none"/><line x1="480" y1="300" x2="475" y2="289" stroke="#1B2838" stroke-width="1.5"/><line x1="480" y1="300" x2="485" y2="289" stroke="#1B2838" stroke-width="1.5"/><line x1="560" y1="240" x2="700" y2="300" stroke="#1B2838" stroke-width="1.5" fill="none"/><line x1="700" y1="300" x2="688" y2="300" stroke="#1B2838" stroke-width="1.5"/><line x1="700" y1="300" x2="692" y2="291" stroke="#1B2838" stroke-width="1.5"/><line x1="600" y1="240" x2="920" y2="300" stroke="#1B2838" stroke-width="1.5" fill="none"/><line x1="920" y1="300" x2="908" y2="303" stroke="#1B2838" stroke-width="1.5"/><line x1="920" y1="300" x2="910" y2="293" stroke="#1B2838" stroke-width="1.5"/>
<rect x="560" y="420" width="240" height="80" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="680" y="450" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">evaluator</text>
<text x="680" y="472" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">scores each candidate,</text>
<text x="680" y="490" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">keeps the best</text>
<rect x="860" y="420" width="180" height="80" rx="12" fill="#1F7A72" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="950" y="454" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">answer</text>
<text x="950" y="480" font-size="13" font-weight="450" fill="#E7F4EF" text-anchor="middle">from the best branch</text>
<line x1="510" y1="380" x2="600" y2="440" stroke="#1B2838" stroke-width="1.5" fill="none"/><line x1="600" y1="440" x2="588" y2="438" stroke="#1B2838" stroke-width="1.5"/><line x1="600" y1="440" x2="594" y2="430" stroke="#1B2838" stroke-width="1.5"/><line x1="950" y1="380" x2="760" y2="440" stroke="#1B2838" stroke-width="1.5" fill="none"/><line x1="760" y1="440" x2="769" y2="432" stroke="#1B2838" stroke-width="1.5"/><line x1="760" y1="440" x2="772" y2="442" stroke="#1B2838" stroke-width="1.5"/>
<line x1="800" y1="460" x2="860" y2="460" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="860" y1="460" x2="849" y2="456" stroke="#1B2838" stroke-width="1.5"/>
<line x1="860" y1="460" x2="849" y2="464" stroke="#1B2838" stroke-width="1.5"/>
<text x="40" y="580" font-size="14" font-weight="450" fill="#5C6B7A">Cost: the evaluator scores every branch. Spend it where one chain keeps failing.</text>
<text x="40" y="616" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
</svg>