<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="620" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Verifiers: outcome versus process</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">Outcome checks the answer. Process checks each step. They fail differently.</text>
<line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="596" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
<text x="40" y="132" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">OUTCOME reward: check the final answer</text>
<g><rect x="40" y="152" width="300" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="190" y="186" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">5 reasoning steps</text>
<text x="190" y="212" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">... any path ...</text>
</g>
<g><rect x="380" y="152" width="220" height="96" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="490" y="186" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">verifier</text>
<text x="490" y="212" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">final answer == 75?</text>
<text x="490" y="232" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">1 or 0</text>
</g>
<line x1="340" y1="200" x2="380" y2="200" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="380" y1="200" x2="369" y2="196" stroke="#1B2838" stroke-width="1.5"/>
<line x1="380" y1="200" x2="369" y2="204" stroke="#1B2838" stroke-width="1.5"/>
<text x="40" y="290" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Cheap: one check. Blind: a lucky wrong path scores 1.</text>
<text x="40" y="330" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">PROCESS reward: check each step</text>
<g><rect x="40" y="360" width="150" height="80" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="115" y="394" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">step 1</text>
<text x="115" y="420" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">check</text>
</g>
<g><rect x="220" y="360" width="150" height="80" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="295" y="394" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">step 2</text>
<text x="295" y="420" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">check</text>
</g>
<g><rect x="400" y="360" width="150" height="80" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="475" y="394" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">step 3</text>
<text x="475" y="420" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">check</text>
</g>
<g><rect x="580" y="360" width="150" height="80" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="655" y="394" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">step 4</text>
<text x="655" y="420" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">check</text>
</g>
<g><rect x="760" y="360" width="150" height="80" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="835" y="394" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">step 5</text>
<text x="835" y="420" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">check</text>
</g>
<line x1="190" y1="400" x2="220" y2="400" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="220" y1="400" x2="209" y2="396" stroke="#1B2838" stroke-width="1.5"/>
<line x1="220" y1="400" x2="209" y2="404" stroke="#1B2838" stroke-width="1.5"/>
<line x1="370" y1="400" x2="400" y2="400" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="400" y1="400" x2="389" y2="396" stroke="#1B2838" stroke-width="1.5"/>
<line x1="400" y1="400" x2="389" y2="404" stroke="#1B2838" stroke-width="1.5"/>
<line x1="550" y1="400" x2="580" y2="400" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="580" y1="400" x2="569" y2="396" stroke="#1B2838" stroke-width="1.5"/>
<line x1="580" y1="400" x2="569" y2="404" stroke="#1B2838" stroke-width="1.5"/>
<line x1="730" y1="400" x2="760" y2="400" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="760" y1="400" x2="749" y2="396" stroke="#1B2838" stroke-width="1.5"/>
<line x1="760" y1="400" x2="749" y2="404" stroke="#1B2838" stroke-width="1.5"/>
<text x="940" y="410" font-size="14" font-weight="600" fill="#C46B2C" text-anchor="start">step 5 fails:</text>
<text x="940" y="432" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">reward 0 here,</text>
<text x="940" y="454" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">not everywhere.</text>
<text x="40" y="500" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">Process reward teaches the model where it went wrong; outcome reward only says that it did.</text>
<text x="40" y="524" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Price: a process verifier needs step-level labels, which are expensive to write.</text>
</svg>