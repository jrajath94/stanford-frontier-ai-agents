<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="600" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Embeddings: meaning becomes position</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">The embedding model turns a chunk into a vector. Similar meanings land near each other.</text>
<line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="576" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
<g><rect x="40" y="200" width="300" height="120" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="190" y="234" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">chunk</text>
<text x="190" y="260" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">&quot;The project milestone</text>
<text x="190" y="280" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">is due Week 6...&quot;</text>
</g>
<g><rect x="400" y="200" width="240" height="120" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="520" y="234" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">embedding model</text>
<text x="520" y="260" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">BERT, E5, BGE...</text>
<text x="520" y="280" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">768 numbers out</text>
</g>
<line x1="340" y1="260" x2="400" y2="260" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="400" y1="260" x2="389" y2="256" stroke="#1B2838" stroke-width="1.5"/>
<line x1="400" y1="260" x2="389" y2="264" stroke="#1B2838" stroke-width="1.5"/>
<text x="370" y="252" font-size="13" fill="#1B2838" text-anchor="middle">encode</text>
<g><rect x="700" y="200" width="340" height="120" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="870" y="234" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">vector</text>
<text x="870" y="260" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">[0.21, -0.55, 0.03, ...]</text>
<text x="870" y="280" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">768 dims, one point</text>
<text x="870" y="300" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">in meaning space</text>
</g>
<line x1="640" y1="260" x2="700" y2="260" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="700" y1="260" x2="689" y2="256" stroke="#1B2838" stroke-width="1.5"/>
<line x1="700" y1="260" x2="689" y2="264" stroke="#1B2838" stroke-width="1.5"/>
<text x="670" y="252" font-size="13" fill="#1B2838" text-anchor="middle">768 dims</text>
<text x="40" y="400" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">Two chunks about deadlines land near each other; a chunk about lunch lands far away.</text>
<text x="40" y="424" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">The retriever never reads the text. It measures distances between points.</text>
</svg>