<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="500" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">RAG-Sequence vs RAG-Token</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Weight each passage's answer by the retriever's score for it.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="130" width="500" height="270" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">RAG-Sequence</text><text x="290" y="196" font-size="13" fill="#5C6B7A" text-anchor="middle">pick one passage,</text><text x="290" y="216" font-size="13" fill="#5C6B7A" text-anchor="middle">generate the whole answer</text><text x="290" y="250" font-size="13" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">z* = argmax p(z|x)</text><text x="290" y="284" font-size="13" fill="#5C6B7A" text-anchor="middle">answer from p(y|x, z*)</text><text x="290" y="340" font-size="13" fill="#5C6B7A" text-anchor="middle">simple; one passage</text><text x="290" y="360" font-size="13" fill="#5C6B7A" text-anchor="middle">must hold the answer</text><rect x="580" y="130" width="500" height="270" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="830" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">RAG-Token</text><text x="830" y="196" font-size="13" fill="#5C6B7A" text-anchor="middle">re-pick the passage at</text><text x="830" y="216" font-size="13" fill="#5C6B7A" text-anchor="middle">every answer token</text><text x="830" y="250" font-size="13" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">p(y|x) = sum p(z|x)p(y|x,z)</text><text x="830" y="284" font-size="13" fill="#5C6B7A" text-anchor="middle">marginalize over top-K</text><text x="830" y="340" font-size="13" fill="#5C6B7A" text-anchor="middle">flexible; K generations</text><text x="830" y="360" font-size="13" fill="#5C6B7A" text-anchor="middle">of cost</text><text x="40" y="448" font-size="15" font-weight="450" fill="#1B2838">Joint training minimizes the negative marginal log-likelihood over both retriever and generator.</text><text x="40" y="478" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper. Shell 2: two strategies on the same formula.</text></svg>