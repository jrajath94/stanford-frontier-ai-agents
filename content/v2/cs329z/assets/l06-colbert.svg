<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">ColBERT: MaxSim over tokens</text><text x="40" y="82" font-size="17" fill="#5C6B7A">One vector per token. Each query token takes its best match.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><text x="40" y="150" font-size="14" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">S = sum over query tokens of max over doc tokens of (q.d)</text><g><text x="200" y="200" font-size="13" font-weight="600" fill="#5C6B7A" text-anchor="middle">doc tokens</text><g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" text-anchor="middle"><rect x="120" y="220" width="70" height="52" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/><text x="155" y="252" fill="#1B2838">0.91</text><rect x="200" y="220" width="70" height="52" rx="8" fill="#E6E2DA"/><text x="235" y="252" fill="#5C6B7A">0.12</text><rect x="280" y="220" width="70" height="52" rx="8" fill="#E6E2DA"/><text x="315" y="252" fill="#5C6B7A">0.05</text><rect x="120" y="282" width="70" height="52" rx="8" fill="#E6E2DA"/><text x="155" y="314" fill="#5C6B7A">0.20</text><rect x="200" y="282" width="70" height="52" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/><text x="235" y="314" fill="#1B2838">0.87</text><rect x="280" y="282" width="70" height="52" rx="8" fill="#E6E2DA"/><text x="315" y="314" fill="#5C6B7A">0.31</text><rect x="120" y="344" width="70" height="52" rx="8" fill="#E6E2DA"/><text x="155" y="376" fill="#5C6B7A">0.08</text><rect x="200" y="344" width="70" height="52" rx="8" fill="#E6E2DA"/><text x="235" y="376" fill="#5C6B7A">0.15</text><rect x="280" y="344" width="70" height="52" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/><text x="315" y="376" fill="#1B2838">0.94</text></g><text x="60" y="252" font-size="13" fill="#5C6B7A" text-anchor="middle">query</text><text x="60" y="314" font-size="13" fill="#5C6B7A" text-anchor="middle">tokens</text><text x="60" y="376" font-size="13" fill="#5C6B7A" text-anchor="middle">(rows)</text></g><text x="560" y="300" font-size="15" fill="#1B2838" text-anchor="middle">score = 0.91 + 0.87 + 0.94 = 2.72</text><text x="560" y="330" font-size="13" fill="#5C6B7A" text-anchor="middle">each row keeps its max; the sum is the score</text><rect x="760" y="200" width="300" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="910" y="236" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Late interaction</text><text x="910" y="266" font-size="13" fill="#5C6B7A" text-anchor="middle">encode query and passage</text><text x="910" y="286" font-size="13" fill="#5C6B7A" text-anchor="middle">independently; interact</text><text x="910" y="306" font-size="13" fill="#5C6B7A" text-anchor="middle">only at scoring time</text><text x="910" y="346" font-size="13" fill="#5C6B7A" text-anchor="middle">Khattab and Zaharia, 2020</text><text x="40" y="470" font-size="15" font-weight="450" fill="#1B2838">Token-level evidence at scale. Cost: the index holds tokens, not documents; 458 ms end-to-end.</text><text x="40" y="502" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper. Shell 3: one rule: max per row, sum the maxes.</text></svg>