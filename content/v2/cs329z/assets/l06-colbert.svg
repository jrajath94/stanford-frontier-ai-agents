<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">ColBERT: MaxSim over tokens</text><text x="40" y="82" font-size="17" fill="#5C6B7A">One vector per token. Each query token takes its best match.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="150" font-size="14" fill="#1B2838" font-family="'IBM Plex Mono', ui-monospace, monospace">S = sum over query tokens of max over doc tokens of (q.d)</text>
