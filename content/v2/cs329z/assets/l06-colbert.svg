<text x="70" y="284" font-size="13" fill="#1B2838">q1=[1,0]</text>
<rect x="170" y="260" width="70" height="44" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/><text x="205" y="288" font-size="13" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">1</text><rect x="250" y="260" width="70" height="44" rx="8" fill="#E6E2DA"/><text x="285" y="288" font-size="13" fill="#5C6B7A" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">0.2</text><rect x="330" y="260" width="70" height="44" rx="8" fill="#E6E2DA"/><text x="365" y="288" font-size="13" fill="#5C6B7A" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">0</text>
<text x="430" y="284" font-size="13" fill="#1B2838">max = 1</text>
<text x="70" y="344" font-size="13" fill="#1B2838">q2=[0,1]</text>
<rect x="170" y="320" width="70" height="44" rx="8" fill="#E6E2DA"/><text x="205" y="348" font-size="13" fill="#5C6B7A" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">0</text><rect x="250" y="320" width="70" height="44" rx="8" fill="#E6E2DA"/><text x="285" y="348" font-size="13" fill="#5C6B7A" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">0.2</text><rect x="330" y="320" width="70" height="44" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/><text x="365" y="348" font-size="13" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">1</text>
<text x="430" y="344" font-size="13" fill="#1B2838">max = 1</text>
<text x="290" y="392" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">S = 1 + 1 = 2</text>
<text x="290" y="414" font-size="13" font-weight="600" fill="#1F7A72" text-anchor="middle">winner: doc A</text>
<rect x="580" y="180" width="500" height="240" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="830" y="212" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">doc B tokens</text>
