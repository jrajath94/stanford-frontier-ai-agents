<text x="40" y="540" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">Search: enter at the top, greedy-hop toward the query, drop a layer when stuck.</text>
<text x="40" y="564" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">About log N hops for N vectors. The price is a little recall: the true nearest neighbor can hide.</text>
