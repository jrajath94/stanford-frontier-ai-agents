<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">HNSW: a layered graph for fast search</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">Few long jumps on top, many short hops below. Greedy walk descends to the answer.</text>
