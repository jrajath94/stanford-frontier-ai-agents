<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="680" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">IVF plus PQ: cluster first, compress second</text><text x="40" y="82" font-size="17" fill="#5C6B7A">IVF: probe 8 of 1024 clusters, scan 7,800 of 1,000,000 vectors, 128x faster. PQ: 3,072 to 96 bytes, 32x smaller.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="30" y="150" width="500" height="340" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="280" y="180" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">IVF: probe a few clusters</text><text x="280" y="214" font-size="14" font-weight="450" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">1,000,000 vectors -&gt; 1,024 clusters</text><text x="280" y="244" font-size="14" font-weight="450" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">k-means at index time</text><text x="280" y="274" font-size="14" font-weight="450" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">per cluster: 1,000,000 / 1,024 = ~976</text><text x="280" y="304" font-size="14" font-weight="450" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">probe 8 nearest clusters</text><text x="280" y="334" font-size="14" font-weight="450" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">scan: 8 x 976 = ~7,800 vectors</text><text x="280" y="364" font-size="14" font-weight="450" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">speedup: 1,000,000 / 7,800 = ~128x</text><rect x="54" y="410" width="452" height="56" rx="8" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="280" y="433" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">price: the true neighbor can sit in</text><text x="280" y="451" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">an unprobed cluster</text><rect x="580" y="150" width="490" height="340" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="825" y="180" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">PQ: compress each vector</text><text x="825" y="214" font-size="14" font-weight="450" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">768 dims x 4 bytes = 3,072 bytes (raw)</text><text x="825" y="244" font-size="14" font-weight="450" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">M = 96 subvectors, 256 centroids each</text><text x="825" y="274" font-size="14" font-weight="450" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">96 x 1 byte = 96 bytes (PQ)</text><text x="825" y="304" font-size="14" font-weight="450" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">compression: 3,072 / 96 = 32x</text><text x="825" y="334" font-size="14" font-weight="450" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">1M vectors: 3 GB -&gt; 96 MB</text><rect x="604" y="410" width="442" height="56" rx="8" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="825" y="433" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">price: quantization error,</text><text x="825" y="451" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">re-rank the shortlist on raw vectors</text><line x1="530" y1="320" x2="580" y2="320" stroke="#1B2838" stroke-width="1.5"/><polygon points="580,320 568.0,326.0 568.0,314.0" fill="#1B2838" stroke="none"/><text x="555" y="312" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">then</text><text x="40" y="584" font-size="15" font-weight="600" fill="#1B2838">The standard combo: IVF clusters first, PQ compresses second, re-rank third.</text><text x="40" y="608" font-size="14" fill="#5C6B7A">IVF cuts the scan. PQ cuts the memory. The knob is the probe count.</text><text x="40" y="656" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text></svg>