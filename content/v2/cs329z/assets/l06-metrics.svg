<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="540" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">What each metric rewards</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Same top-5 list. Different questions about it.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><g font-family="'IBM Plex Mono', ui-monospace, monospace"><rect x="60" y="150" width="90" height="56" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="105" y="184" font-size="13" fill="#1B2838" text-anchor="middle">rel</text><rect x="160" y="150" width="90" height="56" rx="8" fill="#E6E2DA"/><text x="205" y="184" font-size="13" fill="#5C6B7A" text-anchor="middle">-</text><rect x="260" y="150" width="90" height="56" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="305" y="184" font-size="13" fill="#1B2838" text-anchor="middle">rel</text><rect x="360" y="150" width="90" height="56" rx="8" fill="#E6E2DA"/><text x="405" y="184" font-size="13" fill="#5C6B7A" text-anchor="middle">-</text><rect x="460" y="150" width="90" height="56" rx="8" fill="#E6E2DA"/><text x="505" y="184" font-size="13" fill="#5C6B7A" text-anchor="middle">-</text></g><text x="60" y="240" font-size="13" fill="#5C6B7A">rank 1..5, two relevant passages at ranks 1 and 3</text><g><rect x="60" y="270" width="1000" height="44" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="298" font-size="14" fill="#1B2838">Hit@5 = 1: a relevant passage is in the top 5. Position does not matter.</text><rect x="60" y="322" width="1000" height="44" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="350" font-size="14" fill="#1B2838">MRR@5 = 1: first relevant at rank 1. Only the first hit counts.</text><rect x="60" y="374" width="1000" height="44" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="402" font-size="14" fill="#1B2838">nDCG@5: rank 3 scores less than rank 1. Discounted by log2(i+1).</text><rect x="60" y="426" width="1000" height="44" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="454" font-size="14" fill="#1B2838">Recall@5 = 2/2: found both relevant passages. Failed@5 = 0.</text></g><text x="40" y="508" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 2: one ranked list, four different scores.</text></svg>