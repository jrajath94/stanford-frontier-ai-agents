<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="500" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Rerank the shortlist</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Fast retriever finds candidates. Slow cross-encoder judges them.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="150" width="280" height="200" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="200" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Stage 1: bi-encoder</text><text x="200" y="220" font-size="13" fill="#5C6B7A" text-anchor="middle">query and passage</text><text x="200" y="240" font-size="13" fill="#5C6B7A" text-anchor="middle">encoded separately</text><text x="200" y="280" font-size="13" fill="#1B2838" text-anchor="middle">scans the corpus:</text><text x="200" y="300" font-size="13" fill="#1B2838" text-anchor="middle">top-100, tens of ms</text><rect x="420" y="150" width="280" height="200" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Stage 2: cross-encoder</text><text x="560" y="220" font-size="13" fill="#5C6B7A" text-anchor="middle">query + passage through</text><text x="560" y="240" font-size="13" fill="#5C6B7A" text-anchor="middle">the model together</text><text x="560" y="280" font-size="13" fill="#1B2838" text-anchor="middle">full attention across both:</text><text x="560" y="300" font-size="13" fill="#1B2838" text-anchor="middle">10,700 ms per 1k passages</text><rect x="780" y="150" width="280" height="200" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="920" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Output</text><text x="920" y="230" font-size="13" fill="#5C6B7A" text-anchor="middle">reranked top-10,</text><text x="920" y="250" font-size="13" fill="#5C6B7A" text-anchor="middle">best first</text><text x="920" y="290" font-size="13" fill="#1F7A72" text-anchor="middle">accuracy where</text><text x="920" y="310" font-size="13" fill="#1F7A72" text-anchor="middle">it matters</text><g stroke="#1B2838" stroke-width="1.5" fill="none"><line x1="340" y1="250" x2="420" y2="250"/><polygon points="420,244 430,250 420,256" fill="#1B2838" stroke="none"/><line x1="700" y1="250" x2="780" y2="250"/><polygon points="780,244 790,250 780,256" fill="#1B2838" stroke="none"/></g><text x="380" y="242" font-size="13" fill="#5C6B7A" text-anchor="middle">100</text><text x="740" y="242" font-size="13" fill="#5C6B7A" text-anchor="middle">10</text><text x="40" y="410" font-size="15" font-weight="450" fill="#1B2838">The cross-encoder never scans the corpus. It only judges the shortlist.</text><text x="40" y="442" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 3: one rule: cheap recall, expensive precision.</text></svg>