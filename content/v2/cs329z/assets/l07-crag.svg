<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="660" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">CRAG: repair the retrieval</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Retrieve 3 chunks. The evaluator marks 2 incorrect. Web search escalates. A strip replaces the noise.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="264" width="120" height="60" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="100" y="290" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">"World Series</text><text x="100" y="308" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">host 2019"</text><line x1="160" y1="294" x2="210" y2="294" stroke="#1B2838" stroke-width="1.5"/><polygon points="210,294 198.0,300.0 198.0,288.0" fill="#1B2838" stroke="none"/><text x="185" y="286" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">retrieve</text><rect x="210" y="180" width="190" height="230" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="305" y="210" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Retrieved: 3 chunks</text><rect x="228" y="232" width="154" height="44" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="305" y="260" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">2019 schedule</text><rect x="228" y="286" width="154" height="44" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="305" y="314" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">ticket ad</text><rect x="228" y="340" width="154" height="44" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="305" y="368" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">2018 recap</text><line x1="400" y1="294" x2="460" y2="294" stroke="#1B2838" stroke-width="1.5"/><polygon points="460,294 448.0,300.0 448.0,288.0" fill="#1B2838" stroke="none"/><text x="430" y="286" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">score</text><rect x="460" y="180" width="210" height="230" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="565" y="210" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Evaluator</text><rect x="478" y="232" width="174" height="44" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="565" y="260" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">schedule: correct</text><rect x="478" y="284" width="174" height="44" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="565" y="312" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">ticket ad: incorrect</text><rect x="478" y="336" width="174" height="44" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="565" y="364" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">2018 recap: incorrect</text><text x="565" y="396" font-size="13" font-weight="600" fill="#C46B2C" text-anchor="middle">2 of 3 incorrect: escalate</text><line x1="670" y1="294" x2="730" y2="294" stroke="#1B2838" stroke-width="1.5"/><polygon points="730,294 718.0,300.0 718.0,288.0" fill="#1B2838" stroke="none"/><text x="700" y="286" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">escalate</text><rect x="730" y="180" width="160" height="230" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="810" y="210" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Web search</text><text x="810" y="238" font-size="12" font-weight="450" fill="#5C6B7A" text-anchor="middle">fallback result:</text><text x="810" y="264" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">played in Houston</text><text x="810" y="284" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">and Washington.</text><text x="810" y="310" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">Nationals won.</text><line x1="890" y1="294" x2="950" y2="294" stroke="#1B2838" stroke-width="1.5"/><polygon points="950,294 938.0,300.0 938.0,288.0" fill="#1B2838" stroke="none"/><text x="915" y="286" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">refine</text><rect x="950" y="180" width="130" height="230" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="1015" y="210" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Knowledge strip</text><text x="1015" y="238" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">"2019 World Series</text><text x="1015" y="258" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">host cities:</text><text x="1015" y="278" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">Houston,</text><text x="1015" y="298" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">Washington."</text><text x="1015" y="330" font-size="12" font-weight="450" fill="#5C6B7A" text-anchor="middle">reader answers</text><text x="1015" y="350" font-size="12" font-weight="450" fill="#5C6B7A" text-anchor="middle">from the strip,</text><text x="1015" y="370" font-size="12" font-weight="450" fill="#5C6B7A" text-anchor="middle">not the chunks</text><text x="40" y="564" font-size="15" font-weight="600" fill="#1B2838">Repair, not retry: diagnose which documents failed, escalate, refine into strips.</text><text x="40" y="588" font-size="14" fill="#5C6B7A">Cost: the evaluator plus the fallback on every correction.</text><text x="40" y="636" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text></svg>