<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="620" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">GAIA: breadth across tools, graded by exact match</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">466 real-world questions. Conceptually simple for humans, brutal for agents.</text>
<line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="596" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
<g><rect x="40" y="160" width="320" height="130" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="200" y="194" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Level 1</text>
<text x="200" y="220" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">146 questions</text>
<text x="200" y="240" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">1 tool, &lt;= 5 steps</text>
</g>
<g><rect x="400" y="160" width="320" height="130" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="560" y="194" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Level 2</text>
<text x="560" y="220" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">245 questions</text>
<text x="560" y="240" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">5-10 steps, multi-tool</text>
</g>
<g><rect x="760" y="160" width="320" height="130" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="920" y="194" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Level 3</text>
<text x="920" y="220" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">75 questions</text>
<text x="920" y="240" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">arbitrarily long</text>
</g>
<g><rect x="40" y="340" width="520" height="110" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="300" y="374" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">humans: 92%</text>
<text x="300" y="400" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">94 / 92 / 87 by level</text>
</g>
<g><rect x="600" y="340" width="480" height="110" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="840" y="374" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">GPT-4 + plugins: 15%</text>
<text x="840" y="400" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">30.3 / 9.7 / 0 by level</text>
</g>
<text x="40" y="510" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">The gap is the capability-reliability gap, measured: browsing, code, and files, synthesized.</text>
<text x="40" y="534" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">SWE-bench tests depth in one repo. GAIA tests breadth across the open world.</text>
</svg>