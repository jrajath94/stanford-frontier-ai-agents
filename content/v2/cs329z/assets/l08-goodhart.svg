<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="620" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Goodhart: the metric becomes the target</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">Train on the benchmark and the score climbs while the capability stands still.</text>
<line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="596" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
<text x="40" y="132" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">BEFORE: the benchmark measures the agent</text>
<g><rect x="40" y="152" width="280" height="110" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="180" y="186" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">held-out tasks</text>
<text x="180" y="212" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">unseen problems</text>
</g>
<g><rect x="380" y="152" width="280" height="110" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="520" y="186" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">agent</text>
<text x="520" y="212" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">solves what</text>
<text x="520" y="232" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">it can solve</text>
</g>
<g><rect x="720" y="152" width="280" height="110" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="860" y="186" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">score = capability</text>
<text x="860" y="212" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">honest number</text>
</g>
<line x1="320" y1="207" x2="380" y2="207" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="380" y1="207" x2="369" y2="203" stroke="#1B2838" stroke-width="1.5"/>
<line x1="380" y1="207" x2="369" y2="211" stroke="#1B2838" stroke-width="1.5"/>
<line x1="660" y1="207" x2="720" y2="207" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="720" y1="207" x2="709" y2="203" stroke="#1B2838" stroke-width="1.5"/>
<line x1="720" y1="207" x2="709" y2="211" stroke="#1B2838" stroke-width="1.5"/>
<text x="40" y="320" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">AFTER: the agent trains on the benchmark</text>
<g><rect x="40" y="340" width="280" height="110" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="180" y="374" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">public split</text>
<text x="180" y="400" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">memorized</text>
</g>
<g><rect x="380" y="340" width="280" height="110" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="520" y="374" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">agent</text>
<text x="520" y="400" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">scaffold tuned</text>
<text x="520" y="420" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">to grader quirks</text>
</g>
<g><rect x="720" y="340" width="280" height="110" rx="12" fill="#C46B2C" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="860" y="374" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">score climbs,</text>
<text x="860" y="400" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">capability flat</text>
</g>
<line x1="320" y1="395" x2="380" y2="395" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="380" y1="395" x2="369" y2="391" stroke="#1B2838" stroke-width="1.5"/>
<line x1="380" y1="395" x2="369" y2="399" stroke="#1B2838" stroke-width="1.5"/>
<line x1="660" y1="395" x2="720" y2="395" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="720" y1="395" x2="709" y2="391" stroke="#1B2838" stroke-width="1.5"/>
<line x1="720" y1="395" x2="709" y2="399" stroke="#1B2838" stroke-width="1.5"/>
<text x="40" y="520" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">Defenses: held-out test sets, private eval splits, contamination checks.</text>
<text x="40" y="544" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Reward tampering is Goodhart with tools: the agent edits the tests instead of the code.</text>
</svg>