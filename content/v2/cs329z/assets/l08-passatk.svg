<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="640" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Pass@k: consistency as a number</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Single run p = 0.7. Pass@10 = 0.99999. The demo is one draw, not a measurement.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="160" width="470" height="230" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="275" y="190" font-size="18" font-weight="600" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">pass@k = 1 - (1 - p)^k</text><text x="275" y="224" font-size="14" font-weight="450" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">lesson toy: p = 0.7, k = 10</text><text x="275" y="262" font-size="15" font-weight="450" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">1 - 0.3^10</text><text x="275" y="296" font-size="15" font-weight="450" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">= 1 - 0.0000059</text><rect x="90" y="318" width="370" height="52" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="275" y="351" font-size="18" font-weight="600" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">= 0.99999</text><rect x="550" y="160" width="530" height="230" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="815" y="190" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Ten independent runs</text><rect x="580" y="210" width="88" height="44" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="624" y="238" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">run 1: pass</text><rect x="678" y="210" width="88" height="44" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="722" y="238" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">run 2: pass</text><rect x="776" y="210" width="88" height="44" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="820" y="238" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">run 3: pass</text><rect x="874" y="210" width="88" height="44" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="918" y="238" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">run 4: pass</text><rect x="972" y="210" width="88" height="44" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="1016" y="238" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">run 5: pass</text><rect x="580" y="266" width="88" height="44" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="624" y="294" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">run 6: pass</text><rect x="678" y="266" width="88" height="44" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="722" y="294" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">run 7: pass</text><rect x="776" y="266" width="88" height="44" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="820" y="294" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">run 8: fail</text><rect x="874" y="266" width="88" height="44" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="918" y="294" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">run 9: fail</text><rect x="972" y="266" width="88" height="44" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="1016" y="294" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">run 10: fail</text><text x="815" y="346" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">7 pass, 3 fail: at least one passes</text><text x="815" y="368" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">with probability 0.99999</text><text x="60" y="440" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">single run</text><rect x="180" y="424" width="489" height="32" rx="8" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="685" y="446" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">p = 0.7</text><text x="60" y="484" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start">pass@10</text><rect x="180" y="468" width="700" height="32" rx="8" fill="#1F7A72" stroke="#D9D3C7" stroke-width="1.5"/><text x="896" y="490" font-size="14" font-weight="600" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">0.99999</text><text x="40" y="544" font-size="15" font-weight="600" fill="#1B2838">Capability is p, measured per run. Pass@k is budget: how many tries you can afford.</text><text x="40" y="568" font-size="14" fill="#5C6B7A">Never report pass@k without the k.</text><text x="40" y="616" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text></svg>