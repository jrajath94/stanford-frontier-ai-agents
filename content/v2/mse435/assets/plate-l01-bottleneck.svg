<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Inter, 'Source Sans 3', sans-serif">
<rect width="960" height="540" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">The bottleneck moves. Labor binds underneath.</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Four years of AI infrastructure history. Shell 2. Source: original, drawn from the session.</text>
<g font-size="15" font-weight="500">
<rect x="48" y="136" width="200" height="112" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="148" y="172" text-anchor="middle" fill="#1B2838">4 years ago</text>
<text x="148" y="200" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">chips</text>
<text x="148" y="226" text-anchor="middle" fill="#5C6B7A" font-size="14">get the GPUs</text>
<line x1="248" y1="192" x2="284" y2="192" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="284,184 300,192 284,200" fill="#1B2838"/>
<rect x="300" y="136" width="200" height="112" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="400" y="172" text-anchor="middle" fill="#1B2838">then</text>
<text x="400" y="200" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">memory</text>
<text x="400" y="226" text-anchor="middle" fill="#5C6B7A" font-size="14">memory stocks rip</text>
<line x1="500" y1="192" x2="536" y2="192" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="536,184 552,192 536,200" fill="#1B2838"/>
<rect x="552" y="136" width="200" height="112" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="652" y="172" text-anchor="middle" fill="#1B2838">today</text>
<text x="652" y="200" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">energized shells</text>
<text x="652" y="226" text-anchor="middle" fill="#5C6B7A" font-size="14">a place to turn them on</text>
<line x1="752" y1="192" x2="788" y2="192" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="788,184 804,192 788,200" fill="#1B2838"/>
<rect x="804" y="136" width="108" height="112" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="858" y="178" text-anchor="middle" fill="#5C6B7A" font-size="14">next:</text>
<text x="858" y="206" text-anchor="middle" fill="#5C6B7A" font-size="14">unknown</text>
