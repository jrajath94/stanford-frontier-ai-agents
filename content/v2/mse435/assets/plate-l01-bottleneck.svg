<rect x="48" y="288" width="864" height="120" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="2"/>
<text x="480" y="330" text-anchor="middle" font-size="20" font-weight="600" fill="#1B2838">underneath, always: skilled labor</text>
<text x="480" y="360" text-anchor="middle" font-size="15" fill="#5C6B7A">electricians, welders, plumbers, construction &gt; 9,000 workers on site at Abilene</text>
<text x="480" y="386" text-anchor="middle" font-size="15" fill="#5C6B7A">one gigawatt needs 1,000x the $4.7M/MW labor bar = $4.7B in wages</text>
<rect x="48" y="440" width="864" height="56" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="474" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">Hedge: vertical integration. Energy to buildings to GPU clusters to managed services.</text>
