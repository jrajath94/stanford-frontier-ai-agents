<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="540" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">The cooling path: the recirculating loop</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Shell 3. Water carries the heat out; cold water returns. Source: original, from the session's campus walk.</text>
<text x="144" y="148" text-anchor="middle" font-size="13" fill="#5C6B7A">cold water in</text>
<text x="592" y="148" text-anchor="middle" font-size="13" fill="#C46B2C">before: hot chips</text>
<text x="816" y="148" text-anchor="middle" font-size="13" fill="#5C6B7A">after: heat out</text>
<g font-size="15" font-weight="500">
<rect x="48" y="160" width="192" height="120" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="144" y="200" text-anchor="middle" fill="#1B2838">chillers</text>
<text x="144" y="226" text-anchor="middle" fill="#5C6B7A" font-size="14">make cold water</text>
<text x="144" y="250" text-anchor="middle" fill="#5C6B7A" font-size="14">air-cooled coils</text>
<line x1="240" y1="220" x2="264" y2="220" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="264,212 280,220 264,228" fill="#1B2838"/>
<rect x="272" y="160" width="192" height="120" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="368" y="200" text-anchor="middle" fill="#1B2838">CDUs</text>
<text x="368" y="226" text-anchor="middle" fill="#5C6B7A" font-size="14">cooling distribution</text>
<text x="368" y="250" text-anchor="middle" fill="#5C6B7A" font-size="14">feed the racks</text>
<line x1="464" y1="220" x2="488" y2="220" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="488,212 504,220 488,228" fill="#1B2838"/>
<rect x="496" y="160" width="192" height="120" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="2"/>
<text x="592" y="200" text-anchor="middle" fill="#1B2838">GPU racks</text>
<text x="592" y="226" text-anchor="middle" fill="#1B2838" font-size="14">heat: chip to water</text>
<text x="592" y="250" text-anchor="middle" fill="#5C6B7A" font-size="14">the transfer event</text>
<line x1="688" y1="220" x2="712" y2="220" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="712,212 728,220 712,228" fill="#1B2838"/>
<rect x="720" y="160" width="192" height="120" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="816" y="200" text-anchor="middle" fill="#1B2838">fans</text>
<text x="816" y="226" text-anchor="middle" fill="#5C6B7A" font-size="14">blow air over coils</text>
<text x="816" y="250" text-anchor="middle" fill="#5C6B7A" font-size="14">exhaust the heat</text>
<!-- return path -->
<polyline points="816,280 816,328 144,328 144,288" fill="none" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="136,300 144,284 152,300" fill="#1B2838"/>
<text x="480" y="320" text-anchor="middle" font-size="14" fill="#1F7A72">cold water returns to the chillers</text>
</g>
<rect x="48" y="368" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="400" text-anchor="middle" font-size="15" fill="#1B2838">The loop is filled once and recirculates. Hot aisle containment and fan walls keep the air lanes separate.</text>
<text x="48" y="492" font-size="16" font-weight="500" fill="#1B2838">One claim: chips turn almost all their power into heat. The loop carries it to air and brings cold water back.</text>
</svg>
