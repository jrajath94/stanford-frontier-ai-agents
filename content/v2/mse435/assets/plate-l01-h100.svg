<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="540" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">The H100 price rebound: old chips regained value</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Shell 3. Old chips regained value when agent demand outran supply. Source: session chart, read from the slide.</text>
<!-- axes -->
<line x1="96" y1="140" x2="96" y2="440" stroke="#1B2838" stroke-width="1.5"/>
<line x1="96" y1="440" x2="880" y2="440" stroke="#1B2838" stroke-width="1.5"/>
<text x="60" y="290" font-size="14" fill="#5C6B7A" text-anchor="middle" transform="rotate(-90 60 290)">rental price</text>
<text x="488" y="470" font-size="14" fill="#5C6B7A" text-anchor="middle">time, about three years</text>
<!-- debut level -->
<line x1="96" y1="210" x2="880" y2="210" stroke="#1B2838" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="872" y="198" font-size="13" fill="#5C6B7A" text-anchor="end">debut price</text>
<!-- curve -->
<polyline points="130,210 290,335 470,312 650,252 830,158" fill="none" stroke="#1B2838" stroke-width="2.5"/>
<circle cx="130" cy="210" r="5" fill="#1B2838"/>
<circle cx="290" cy="335" r="5" fill="#1B2838"/>
<circle cx="830" cy="158" r="5" fill="#1F7A72"/>
<g font-size="14" fill="#5C6B7A">
<text x="130" y="420" text-anchor="middle">debut</text>
<text x="290" y="365" text-anchor="middle">dip: obsolescence fear</text>
<text x="650" y="282" text-anchor="middle">agent boom: demand outruns supply</text>
<text x="830" y="140" text-anchor="middle" fill="#1F7A72">above debut</text>
</g>
<text x="48" y="508" font-size="16" font-weight="500" fill="#1B2838">One claim: the rental market priced obsolescence fear first, then agent demand repriced it. Exact price levels not in source.</text>
</svg>
