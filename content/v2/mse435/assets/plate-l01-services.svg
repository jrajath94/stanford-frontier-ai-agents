<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="540" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">The services uplift: from 4-year to 2-year payback</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">Shell 4. Add services: $15M and 4 years become $30M and 2. Source: original, numbers from the session.</text>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="360" height="150" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="228" y="180" text-anchor="middle" fill="#1B2838">rent the chips</text>
<text x="228" y="210" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">$15M per MW per year</text>
<text x="228" y="242" text-anchor="middle" fill="#5C6B7A" font-size="14">payback: 60 / 15 = about 4 years</text>
<line x1="408" y1="215" x2="536" y2="215" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="536,207 552,215 536,223" fill="#1B2838"/>
<text x="472" y="200" text-anchor="middle" font-size="14" fill="#1B2838">add managed services</text>
<text x="472" y="240" text-anchor="middle" font-size="13" fill="#5C6B7A">+$5 to $15M per MW per year</text>
<rect x="552" y="140" width="360" height="150" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="732" y="180" text-anchor="middle" fill="#1B2838">rent plus services</text>
<text x="732" y="210" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">$30M per MW per year</text>
<text x="732" y="242" text-anchor="middle" fill="#1F7A72" font-size="14">payback: 60 / 30 = about 2 years</text>
<rect x="48" y="330" width="420" height="110" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="258" y="370" text-anchor="middle" fill="#1B2838">managed compute cluster</text>
<text x="258" y="398" text-anchor="middle" fill="#5C6B7A" font-size="14">for the engineer: VMs or Kubernetes</text>
<text x="258" y="420" text-anchor="middle" fill="#5C6B7A" font-size="14">customer runs the workload</text>
<rect x="492" y="330" width="420" height="110" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="702" y="370" text-anchor="middle" fill="#1B2838">model endpoint</text>
<text x="702" y="398" text-anchor="middle" fill="#5C6B7A" font-size="14">for everyone else: API for tokens</text>
<text x="702" y="420" text-anchor="middle" fill="#5C6B7A" font-size="14">Crusoe hosts the model</text>
</g>
<text x="48" y="470" font-size="13" fill="#5C6B7A">Payback on a revenue basis; OpEx of $1-2M per MW per year excluded. Optimistic case.</text>
<text x="48" y="508" font-size="16" font-weight="500" fill="#1B2838">One claim: the factory owner who sells the service captures the rent and the margin.</text>
</svg>
