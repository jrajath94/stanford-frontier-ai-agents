<text x="480" y="521" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: hold both schedules. The 2-year payback clears either. The 4-year payback survives only the 6-year book.</text>
<text x="48" y="578" font-size="15" font-weight="500" fill="#1B2838">One connection: the schedule does not change the cash. It changes whether the cash was a return or a refund.</text>
