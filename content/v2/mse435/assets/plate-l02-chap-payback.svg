<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the payback</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Renting chips against selling tokens. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the layer: rent chips</text>
<text x="328" y="124">the stored object: $60M/MW</text>
<text x="648" y="124">WITH the layer: sell tokens</text>
</g>
<g font-size="14" font-weight="500">
<rect x="48" y="140" width="264" height="330" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="180" text-anchor="middle" fill="#1B2838">$15M per MW per year</text>
<text x="180" y="204" text-anchor="middle" fill="#5C6B7A">bare chips, the commodity</text>
<text x="180" y="244" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">60 / 15 = 4 years</text>
<text x="180" y="284" text-anchor="middle" fill="#5C6B7A">on a revenue basis</text>
<text x="180" y="308" text-anchor="middle" fill="#5C6B7A">not profit; engineers omitted</text>
<text x="180" y="348" text-anchor="middle" fill="#C46B2C">runs past the 3-year line</text>
<text x="180" y="372" text-anchor="middle" fill="#5C6B7A">most exposed to the critique</text>
<rect x="328" y="140" width="304" height="330" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="200" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">$60M build</text>
<text x="480" y="226" text-anchor="middle" fill="#5C6B7A">spent once, up front</text>
<text x="480" y="266" text-anchor="middle" fill="#1B2838" font-size="24" font-weight="600">+</text>
<text x="480" y="316" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">$1-2M/yr OpEx</text>
<text x="480" y="342" text-anchor="middle" fill="#5C6B7A">power, insurance, repairs</text>
<text x="480" y="382" text-anchor="middle" fill="#1B2838">the managed layer</text>
<text x="480" y="406" text-anchor="middle" fill="#5C6B7A">from electrons to tokens</text>
<text x="480" y="440" text-anchor="middle" fill="#1B2838">customer never sees the chip</text>
<rect x="648" y="140" width="264" height="330" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="180" text-anchor="middle" fill="#1B2838">$30M per MW per year</text>
<text x="780" y="204" text-anchor="middle" fill="#5C6B7A">managed APIs, optimistic case</text>
<text x="780" y="244" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">60 / 30 = 2 years</text>
<text x="780" y="284" text-anchor="middle" fill="#5C6B7A">midpoint $25M: 2.4 years</text>
<text x="780" y="308" text-anchor="middle" fill="#5C6B7A">bottom $20M: 3 years</text>
<text x="780" y="348" text-anchor="middle" fill="#1F7A72">clears the 3-year line</text>
<text x="780" y="372" text-anchor="middle" fill="#5C6B7A">one year of margin left</text>
<text x="780" y="412" text-anchor="middle" fill="#1B2838">price net of the team</text>
<text x="780" y="436" text-anchor="middle" fill="#5C6B7A">or the 2 years are fiction</text>
</g>
<rect x="48" y="486" width="864" height="56" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="521" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: the 2-year case must clear the depreciation clock. The 4-year case survives only the 6-year book life.</text>
<text x="48" y="578" font-size="15" font-weight="500" fill="#1B2838">One connection: payback halves when the product changes from compute to finished intelligence.</text>
</svg>
