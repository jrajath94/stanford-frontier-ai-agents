<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Inter, 'Source Sans 3', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="60" font-size="30" font-weight="600" fill="#1B2838">$60M per megawatt: the full stack</text>
<text x="48" y="92" font-size="17" fill="#5C6B7A">$20M builds the factory. $40M fills it with machines. Half of the total is GPUs. Shell 2. Source: original, numbers from the session.</text>
<!-- factory $20M -->
<text x="48" y="140" font-size="20" font-weight="600" fill="#1B2838">The factory: $20M / MW</text>
<g font-size="15" font-weight="500">
<text x="48" y="178" fill="#1B2838">construction labor</text>
<rect x="260" y="162" width="188" height="24" rx="8" fill="#C46B2C"/>
<text x="452" y="180" fill="#1B2838" font-size="14">$4.7M &lt;-- the bottleneck bar</text>
<text x="48" y="214" fill="#1B2838">gas plant</text>
<rect x="260" y="198" width="100" height="24" rx="8" fill="#F6E7A8" stroke="#1B2838" stroke-width="1.5"/>
<text x="364" y="216" fill="#1B2838" font-size="14">$2-3M (turbine was $1M)</text>
<text x="48" y="250" fill="#1B2838">electrical + mechanical</text>
<rect x="260" y="234" width="160" height="24" rx="8" fill="#E6E2DA"/>
<text x="48" y="286" fill="#1B2838">materials + soft costs</text>
<rect x="260" y="270" width="140" height="24" rx="8" fill="#E6E2DA"/>
</g>
<!-- machines $40M -->
<text x="48" y="336" font-size="20" font-weight="600" fill="#1B2838">The machines: $40M / MW</text>
<g font-size="15" font-weight="500">
<text x="48" y="374" fill="#1B2838">GPUs</text>
<rect x="260" y="358" width="400" height="24" rx="8" fill="#1F7A72"/>
<text x="664" y="376" fill="#1B2838" font-size="14">$30M = 3/4 of the IT spend</text>
<text x="48" y="410" fill="#1B2838">networking</text>
<rect x="260" y="394" width="56" height="24" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="320" y="412" fill="#1B2838" font-size="14">$4M, one coherent cluster</text>
<text x="48" y="446" fill="#1B2838">CPUs + storage</text>
<rect x="260" y="430" width="44" height="24" rx="8" fill="#E6E2DA"/>
<text x="308" y="448" fill="#1B2838" font-size="14">$3M, agentic CPU surge</text>
<text x="48" y="482" fill="#1B2838">fit-out + labor/shipping</text>
<rect x="260" y="466" width="56" height="24" rx="8" fill="#E6E2DA"/>
<text x="320" y="484" fill="#1B2838" font-size="14">$4M, guest flags possible double-count</text>
</g>
<text x="48" y="544" font-size="16" font-weight="500" fill="#1B2838">One claim: the factory is a wage bill and a turbine order. The machines are a GPU invoice.</text>
<text x="48" y="572" font-size="14" fill="#5C6B7A">Bar widths are proportional within each half. 1 GW = 1,000 MW = $60B.</text>
</svg>
