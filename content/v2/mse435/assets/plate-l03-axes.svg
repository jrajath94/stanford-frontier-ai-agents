<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="560" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">The three scaling axes</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Pre-training, post-training, test-time: three dials. Shell 3. Source: original, from the session.</text>
<g>
<rect x="64" y="136" width="256" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="192" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">dial 1: pre-training</text>
<rect x="80" y="186" width="224" height="56" rx="8" fill="#E7F1F8"/>
<text x="192" y="214" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">spend: training compute</text>
<text x="192" y="274" font-size="14" font-weight="500" fill="#1E4D8C" text-anchor="middle">20 tokens per parameter</text>
<text x="192" y="298" font-size="13" fill="#5C6B7A" text-anchor="middle">70B wants 1.4T tokens</text>
<text x="192" y="336" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">buys: raw intelligence</text>
<text x="192" y="360" font-size="13" fill="#5C6B7A" text-anchor="middle">compression ~1000:1</text>
</g>
<polygon points="328,260 344,268 328,276" fill="#1B2838"/>
<g>
<rect x="352" y="136" width="256" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">dial 2: post-training</text>
<rect x="368" y="186" width="224" height="56" rx="8" fill="#E7F4EF"/>
<text x="480" y="214" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">spend: RL compute</text>
<text x="480" y="274" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">RLHF, then RLVR</text>
<text x="480" y="298" font-size="13" fill="#5C6B7A" text-anchor="middle">R1 reasoning: ~5% of pre-train</text>
<text x="480" y="336" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">buys: usable reasoning</text>
<text x="480" y="360" font-size="13" fill="#5C6B7A" text-anchor="middle">the checker is free</text>
</g>
<polygon points="616,260 632,268 616,276" fill="#1B2838"/>
<g>
<rect x="640" y="136" width="256" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="768" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">dial 3: test-time</text>
<rect x="656" y="186" width="224" height="56" rx="8" fill="#F4E6D4"/>
<text x="768" y="214" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">spend: inference tokens</text>
<text x="768" y="274" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">100 tokens vs 10,000</text>
<text x="768" y="298" font-size="13" fill="#5C6B7A" text-anchor="middle">wrong vs right, same model</text>
<text x="768" y="336" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">buys: better answers</text>
<text x="768" y="360" font-size="13" fill="#5C6B7A" text-anchor="middle">the agent loop's meter</text>
</g>
<line x1="64" y1="452" x2="896" y2="452" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="488" font-size="16" font-weight="500" fill="#1B2838">One claim: three dials buy intelligence. Train bigger, steer longer, think harder per answer.</text>
</svg>
