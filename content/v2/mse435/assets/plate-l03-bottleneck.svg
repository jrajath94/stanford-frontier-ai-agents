<text x="48" y="516" font-size="16" fill="#1B2838">Data wall: 31% of filtered web text was AI-generated by Aug 2026, up from 10% in mid-2024.</text>
<text x="48" y="552" font-size="16" font-weight="500" fill="#1B2838">One claim: whoever cracks learning from sparse real-world reward owns the next era.</text>
