<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the reasoning axis</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. From training-only scaling to thinking at answer time. Source: original synthesis.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the axis: one shot</text>
<text x="328" y="124">the stored object: the dial</text>
<text x="648" y="124">WITH the axis: think longer</text>
</g>
<g font-size="14" font-weight="500">
<rect x="48" y="140" width="264" height="330" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="180" text-anchor="middle" fill="#1B2838">all scaling before deploy</text>
<text x="180" y="204" text-anchor="middle" fill="#5C6B7A">inference a fixed cost</text>
<text x="180" y="244" text-anchor="middle" fill="#1B2838">100 tokens: wrong answer</text>
<text x="180" y="268" text-anchor="middle" fill="#5C6B7A">no second chance</text>
<text x="180" y="308" text-anchor="middle" fill="#1B2838">chain of thought</text>
<text x="180" y="332" text-anchor="middle" fill="#5C6B7A">never directly trained</text>
<text x="180" y="372" text-anchor="middle" fill="#1B2838">it emerged, untrained</text>
<text x="180" y="396" text-anchor="middle" fill="#5C6B7A">the bull case and the risk</text>
<rect x="328" y="140" width="304" height="330" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="200" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">test-time compute</text>
<text x="480" y="226" text-anchor="middle" fill="#5C6B7A">o1, late 2024</text>
<text x="480" y="266" text-anchor="middle" fill="#1B2838" font-size="24" font-weight="600">-&gt;</text>
<text x="480" y="316" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">RLVR</text>
<text x="480" y="342" text-anchor="middle" fill="#5C6B7A">verifiable rewards, not judges</text>
<text x="480" y="382" text-anchor="middle" fill="#1B2838">GRPO drops the critic</text>
<text x="480" y="406" text-anchor="middle" fill="#5C6B7A">advantages from grouped rollouts</text>
<text x="480" y="440" text-anchor="middle" fill="#5C6B7A">R1: ~5% of pre-training cost</text>
<rect x="648" y="140" width="264" height="330" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="180" text-anchor="middle" fill="#1B2838">10,000 tokens: right</text>
<text x="780" y="204" text-anchor="middle" fill="#5C6B7A">try, check, backtrack</text>
<text x="780" y="244" text-anchor="middle" fill="#1B2838">R1-Zero's aha moment</text>
<text x="780" y="268" text-anchor="middle" fill="#5C6B7A">pause, re-evaluate, correct</text>
<text x="780" y="308" text-anchor="middle" fill="#1B2838">inference becomes a dial</text>
<text x="780" y="332" text-anchor="middle" fill="#5C6B7A">cheap fast or careful dear</text>
<text x="780" y="372" text-anchor="middle" fill="#1B2838">+ tool use: agents</text>
<text x="780" y="396" text-anchor="middle" fill="#5C6B7A">plan, act, observe, correct</text>
<text x="780" y="436" text-anchor="middle" fill="#1B2838">the loop prices the thinking</text>
</g>
<rect x="48" y="486" width="864" height="56" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="521" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: the dial reprices every application. The agent business is selling thinking by the token.</text>
<text x="48" y="578" font-size="15" font-weight="500" fill="#1B2838">One connection: the new axis buys intelligence without more pre-training data.</text>
</svg>
