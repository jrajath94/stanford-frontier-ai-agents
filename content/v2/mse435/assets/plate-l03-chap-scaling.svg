<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the scaling laws</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. From spending blind to spending balanced. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: blind spend</text>
<text x="328" y="124">the stored object: the curve</text>
<text x="648" y="124">WITH the rule: balanced spend</text>
</g>
<g font-size="14" font-weight="500">
<rect x="48" y="140" width="264" height="330" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="180" text-anchor="middle" fill="#1B2838">giants starved of data</text>
<text x="180" y="204" text-anchor="middle" fill="#5C6B7A">parameters wasted</text>
<text x="180" y="244" text-anchor="middle" fill="#1B2838">no split between</text>
<text x="180" y="268" text-anchor="middle" fill="#1B2838">parameters and data</text>
<text x="180" y="308" text-anchor="middle" fill="#1B2838">Kaplan said: bigger</text>
<text x="180" y="332" text-anchor="middle" fill="#5C6B7A">GPT-3, 175B, the proof</text>
<text x="180" y="372" text-anchor="middle" fill="#1B2838">bigger alone is not enough</text>
<text x="180" y="396" text-anchor="middle" fill="#5C6B7A">the refinement was missing</text>
<rect x="328" y="140" width="304" height="330" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="200" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">loss falls</text>
<text x="480" y="226" text-anchor="middle" fill="#5C6B7A">predictably with compute</text>
<text x="480" y="266" text-anchor="middle" fill="#1B2838" font-size="24" font-weight="600">+</text>
<text x="480" y="316" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">the 20x rule</text>
<text x="480" y="342" text-anchor="middle" fill="#5C6B7A">tokens per parameter</text>
<text x="480" y="382" text-anchor="middle" fill="#1B2838">MoE stretches the laws</text>
<text x="480" y="406" text-anchor="middle" fill="#5C6B7A">675B total, 41B active</text>
<text x="480" y="440" text-anchor="middle" fill="#5C6B7A">laws apply to the active</text>
<rect x="648" y="140" width="264" height="330" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="180" text-anchor="middle" fill="#1B2838">70B wants ~1.4T tokens</text>
<text x="780" y="204" text-anchor="middle" fill="#5C6B7A">70 x 20 = 1,400, in billions</text>
<text x="780" y="244" text-anchor="middle" fill="#1B2838">1T wants ~20T tokens</text>
<text x="780" y="268" text-anchor="middle" fill="#5C6B7A">starve it: money wasted</text>
<text x="780" y="308" text-anchor="middle" fill="#1B2838">returns are predictable</text>
<text x="780" y="332" text-anchor="middle" fill="#5C6B7A">so spending is rational</text>
<text x="780" y="372" text-anchor="middle" fill="#1B2838">the falsifier: if curves</text>
<text x="780" y="396" text-anchor="middle" fill="#1B2838">flatten, factories strand</text>
<text x="780" y="436" text-anchor="middle" fill="#5C6B7A">hedge: post-training axes</text>
</g>
<rect x="48" y="486" width="864" height="56" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="521" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: intelligence becomes a capital allocation problem. The CapEx chart is this rule, financed.</text>
<text x="48" y="578" font-size="15" font-weight="500" fill="#1B2838">One connection: science gave investors a curve. Finance is now climbing it.</text>
</svg>
