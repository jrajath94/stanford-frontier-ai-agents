<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Inter, 'Source Sans 3', sans-serif">
<rect width="960" height="520" fill="#F7F4EE"/>
<text x="48" y="60" font-size="30" font-weight="600" fill="#1B2838">$100 of training spend: the 5 percent</text>
<text x="48" y="92" font-size="17" fill="#5C6B7A">Post-training is 5% of the compute and buys the reasoning. Its share is rising. Shell 2. Source: original, DeepSeek V3/R1 numbers from the session.</text>
<rect x="48" y="132" width="864" height="80" rx="12" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<rect x="48" y="132" width="820" height="80" rx="12" fill="#1E4D8C"/>
<rect x="868" y="132" width="44" height="80" rx="12" fill="#1F7A72"/>
<text x="458" y="180" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">pre-training: $95 &gt; 2.4-2.5M H800-hours, builds the representations</text>
<text x="890" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">$5</text>
<g font-size="15" font-weight="500">
<rect x="48" y="248" width="412" height="120" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="254" y="284" text-anchor="middle" fill="#1B2838" font-size="17" font-weight="600">reading 1: cheap</text>
<text x="254" y="312" text-anchor="middle" fill="#5C6B7A" font-size="14">single-digit % of compute</text>
<text x="254" y="336" text-anchor="middle" fill="#5C6B7A" font-size="14">for the defining behavior</text>
<rect x="500" y="248" width="412" height="120" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="706" y="284" text-anchor="middle" fill="#1B2838" font-size="17" font-weight="600">reading 2: rising</text>
<text x="706" y="312" text-anchor="middle" fill="#5C6B7A" font-size="14">data-center-wide RL,</text>
<text x="706" y="336" text-anchor="middle" fill="#5C6B7A" font-size="14">its own scaling laws</text>
</g>
<rect x="48" y="400" width="864" height="64" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/>
<text x="480" y="438" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">The 5% only works on top of the 95%. RLVR steers representations it did not build.</text>
</svg>
