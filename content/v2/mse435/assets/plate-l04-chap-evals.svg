<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: evals set the roadmap</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The eval is the steering wheel, so getting it right is the highest-impact work in the lab.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="418" y="124">the rule: define the hill</text>
<text x="648" y="124">WITH the rule</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="284" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="184" text-anchor="middle" fill="#1B2838">the boat problem</text>
<text x="190" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">reward the targets,</text>
<text x="190" y="236" text-anchor="middle" fill="#5C6B7A" font-size="14">get endless circles</text>
<text x="190" y="280" text-anchor="middle" fill="#C46B2C" font-size="14">excellent at the wrong thing,</text>
<text x="190" y="304" text-anchor="middle" fill="#C46B2C" font-size="14">tens of thousands of points,</text>
<text x="190" y="328" text-anchor="middle" fill="#C46B2C" font-size="14">the race never finished</text>
<text x="190" y="372" text-anchor="middle" fill="#5C6B7A" font-size="14">a sloppy reward builds</text>
<text x="190" y="396" text-anchor="middle" fill="#5C6B7A" font-size="14">a sloppy hill</text>
<rect x="348" y="140" width="284" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="490" y="184" text-anchor="middle" fill="#1B2838">an eval: fixed tasks</text>
<text x="490" y="208" text-anchor="middle" fill="#1B2838">with right answers</text>
<text x="490" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">SWE-bench: real GitHub issues,</text>
<text x="490" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">pass or fail by the repo's tests</text>
<text x="490" y="324" text-anchor="middle" fill="#1E4D8C" font-size="14">the score: a hill with</text>
<text x="490" y="348" text-anchor="middle" fill="#1E4D8C" font-size="14">a measured height</text>
<text x="490" y="392" text-anchor="middle" fill="#5C6B7A" font-size="14">four kinds: static, agentic,</text>
<text x="490" y="416" text-anchor="middle" fill="#5C6B7A" font-size="14">human, LLM-as-judge</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">RL is the eval-maxing</text>
<text x="780" y="208" text-anchor="middle" fill="#1B2838">machine: it climbs</text>
<text x="780" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">train shaped like the eval,</text>
<text x="780" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">on different data</text>
<text x="780" y="324" text-anchor="middle" fill="#1F7A72" font-size="14">SWE-bench started</text>
<text x="780" y="348" text-anchor="middle" fill="#1F7A72" font-size="14">the code-model race</text>
<text x="780" y="392" text-anchor="middle" fill="#5C6B7A" font-size="14">then pick the next hill:</text>
<text x="780" y="416" text-anchor="middle" fill="#5C6B7A" font-size="14">its flaws are the next constraint</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="488" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: Goodhart, when a measure becomes a target it stops being a good measure. Contamination: the test leaks into training.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">The discipline: train on similar tasks, different data. It is a discipline, not a guarantee.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: whoever writes the eval writes everyone's roadmap. Labs guard the eval, not the questions.</text>
</svg>
