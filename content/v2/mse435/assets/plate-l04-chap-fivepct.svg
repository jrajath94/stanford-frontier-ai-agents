<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the 5 percent</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Out of $100 of training spend, $95 builds the representations and $5 buys the reasoning.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="416" y="124">the rule: post-train on top</text>
<text x="648" y="124">WITH the rule</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="284" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="184" text-anchor="middle" fill="#1B2838">pre-training or nothing</text>
<text x="190" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">2.664M H800-hours,</text>
<text x="190" y="236" text-anchor="middle" fill="#5C6B7A" font-size="14">14.8 trillion tokens</text>
<text x="190" y="280" text-anchor="middle" fill="#C46B2C" font-size="14">the billions gate: only</text>
<text x="190" y="304" text-anchor="middle" fill="#C46B2C" font-size="14">the labs can pay it</text>
<text x="190" y="348" text-anchor="middle" fill="#5C6B7A" font-size="14">try RLVR on a weak base:</text>
<text x="190" y="372" text-anchor="middle" fill="#5C6B7A" font-size="14">nothing to steer</text>
<rect x="348" y="140" width="284" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="490" y="184" text-anchor="middle" fill="#1B2838">steer the floor, do not</text>
<text x="490" y="208" text-anchor="middle" fill="#1B2838">rebuild it</text>
<text x="490" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">the RL behind R1: about</text>
<text x="490" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">150,000 GPU-hours</text>
<rect x="374" y="308" width="232" height="48" rx="8" fill="#1F7A72"/>
<text x="490" y="339" text-anchor="middle" fill="#FFFFFF" font-size="15">150k / 2,664k = 5.6%</text>
<text x="490" y="388" text-anchor="middle" fill="#5C6B7A" font-size="14">the guest rounds to 5%</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">$95 builds the floor,</text>
<text x="780" y="208" text-anchor="middle" fill="#1B2838">$5 buys the ceiling</text>
<text x="780" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">single-digit percent of compute</text>
<text x="780" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">for the reasoning that</text>
<text x="780" y="304" text-anchor="middle" fill="#5C6B7A" font-size="14">defines the product</text>
<text x="780" y="348" text-anchor="middle" fill="#1F7A72" font-size="14">a startup plays at the layer</text>
<text x="780" y="372" text-anchor="middle" fill="#1F7A72" font-size="14">without a frontier budget</text>
<text x="780" y="416" text-anchor="middle" fill="#5C6B7A" font-size="14">Applied Compute lives here</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="488" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: the 5% only works on top of the 95%. Pre-training is the fixed cost of the floor.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">And the share is rising: labs run data-center-wide RL, and post-training has its own scaling laws.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: cheap post-training prices the specialization layer. The floor is built; buy the ceiling.</text>
</svg>
