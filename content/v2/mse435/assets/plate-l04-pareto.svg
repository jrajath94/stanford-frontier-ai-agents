<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Inter, 'Source Sans 3', sans-serif">
<rect width="960" height="540" fill="#F7F4EE"/>
<text x="48" y="60" font-size="30" font-weight="600" fill="#1B2838">The Pareto frontier: small, fast, specialized</text>
<text x="48" y="92" font-size="17" fill="#5C6B7A">One task, trained relentlessly: big-model performance at small-model cost. Shell 3. Source: original, drawn from the session.</text>
<g font-size="15" font-weight="500">
<rect x="48" y="132" width="412" height="160" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="254" y="168" text-anchor="middle" fill="#1B2838" font-size="17" font-weight="600">general model</text>
<text x="254" y="198" text-anchor="middle" fill="#5C6B7A" font-size="14">bug-catch: 90% at</text>
<text x="254" y="222" text-anchor="middle" fill="#5C6B7A" font-size="14">$0.02/call, 8 seconds</text>
<text x="254" y="250" text-anchor="middle" fill="#C46B2C" font-size="14">too slow, too costly</text>
<rect x="500" y="132" width="412" height="160" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="706" y="168" text-anchor="middle" fill="#1B2838" font-size="17" font-weight="600">small specialist</text>
<text x="706" y="198" text-anchor="middle" fill="#5C6B7A" font-size="14">bug-catch: 91% at</text>
<text x="706" y="222" text-anchor="middle" fill="#5C6B7A" font-size="14">$0.0002/call, 1.5 seconds</text>
<text x="706" y="250" text-anchor="middle" fill="#1F7A72" font-size="14">100x cheaper, 5x faster</text>
</g>
<text x="48" y="344" font-size="20" font-weight="600" fill="#1B2838">The production pattern: the ensemble</text>
<g font-size="15" font-weight="500">
<rect x="48" y="364" width="280" height="80" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="188" y="398" text-anchor="middle" fill="#1B2838">orchestrator</text>
<text x="188" y="422" text-anchor="middle" fill="#5C6B7A" font-size="14">general model decides</text>
<rect x="344" y="364" width="280" height="80" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="484" y="398" text-anchor="middle" fill="#1B2838">specialists</text>
<text x="484" y="422" text-anchor="middle" fill="#5C6B7A" font-size="14">fast models execute</text>
<rect x="640" y="364" width="272" height="80" rx="12" fill="#F6E7A8" stroke="#1B2838" stroke-width="1.5"/>
<text x="776" y="398" text-anchor="middle" fill="#1B2838">proprietary data</text>
<text x="776" y="422" text-anchor="middle" fill="#5C6B7A" font-size="14">fills the gaps</text>
</g>
<text x="48" y="496" font-size="16" font-weight="500" fill="#1B2838">One claim: the frontier is not one model. It is a team, and the specialists are cheap.</text>
</svg>
