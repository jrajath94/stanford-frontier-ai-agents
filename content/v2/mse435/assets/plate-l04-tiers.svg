<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="560" fill="#F7F4EE"/>
<text x="48" y="60" font-size="30" font-weight="600" fill="#1B2838">Whose good: the tiered eval stack</text>
<text x="48" y="92" font-size="17" fill="#5C6B7A">General models set the floor. Your evals set the ceiling. Shell 3. Source: original, drawn from the session.</text>
<g font-size="15" font-weight="500">
<rect x="48" y="132" width="300" height="216" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="198" y="170" text-anchor="middle" fill="#1B2838" font-size="17" font-weight="600">tier 1: lab evals</text>
<text x="198" y="198" text-anchor="middle" fill="#5C6B7A" font-size="14">shared benchmarks</text>
<text x="198" y="220" text-anchor="middle" fill="#5C6B7A" font-size="14">MMLU, HumanEval, SWE-bench</text>
<rect x="76" y="244" width="244" height="32" rx="8" fill="#FFFDF8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="198" y="266" text-anchor="middle" fill="#1B2838" font-size="14">steer the base models</text>
<text x="198" y="310" text-anchor="middle" fill="#5C6B7A" font-size="14">public: one hill for</text>
<text x="198" y="332" text-anchor="middle" fill="#5C6B7A" font-size="14">every competitor</text>
<line x1="348" y1="240" x2="392" y2="240" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="392,232 408,240 392,248" fill="#1B2838"/>
<rect x="416" y="132" width="128" height="216" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="2"/>
<text x="480" y="196" text-anchor="middle" fill="#1B2838" font-size="16" font-weight="600">the rule:</text>
<text x="480" y="224" text-anchor="middle" fill="#1B2838" font-size="16" font-weight="600">specialize</text>
<text x="480" y="268" text-anchor="middle" fill="#5C6B7A" font-size="13">optimize against</text>
<text x="480" y="290" text-anchor="middle" fill="#5C6B7A" font-size="13">your own evals</text>
<text x="480" y="322" text-anchor="middle" fill="#5C6B7A" font-size="13">proprietary</text>
<text x="480" y="344" text-anchor="middle" fill="#5C6B7A" font-size="13">by construction</text>
<line x1="544" y1="240" x2="588" y2="240" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="588,232 604,240 588,248" fill="#1B2838"/>
