<text x="762" y="170" text-anchor="middle" fill="#1B2838" font-size="17" font-weight="600">tier 2: enterprise evals</text>
<text x="762" y="198" text-anchor="middle" fill="#5C6B7A" font-size="14">your private tasks</text>
<text x="762" y="220" text-anchor="middle" fill="#5C6B7A" font-size="14">steer your specialization</text>
<rect x="628" y="244" width="130" height="56" rx="8" fill="#FFFDF8" stroke="#1F7A72" stroke-width="1.5"/>
<text x="693" y="266" text-anchor="middle" fill="#1B2838" font-size="13">JPMorgan</text>
<text x="693" y="288" text-anchor="middle" fill="#5C6B7A" font-size="13">flag this trade</text>
<rect x="766" y="244" width="130" height="56" rx="8" fill="#FFFDF8" stroke="#1F7A72" stroke-width="1.5"/>
<text x="831" y="266" text-anchor="middle" fill="#1B2838" font-size="13">Goldman</text>
<text x="831" y="288" text-anchor="middle" fill="#5C6B7A" font-size="13">flag that trade</text>
<text x="762" y="330" text-anchor="middle" fill="#1F7A72" font-size="14">same base model,</text>
<text x="762" y="352" text-anchor="middle" fill="#1F7A72" font-size="14">two different products</text>
</g>
<rect x="48" y="384" width="864" height="96" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="76" y="420" font-size="16" fill="#1B2838"><tspan font-weight="600">Applied Compute lives at tier 2:</tspan> your style guide, your telemetry, your traces.</text>
<text x="76" y="448" font-size="16" fill="#5C6B7A">Tier-2 evals are proprietary by construction, so the layer is defensible. The ceiling is where companies differentiate.</text>
<text x="48" y="522" font-size="16" font-weight="500" fill="#1B2838">One claim: good is not universal. Whose eval you optimize decides whose product you become.</text>
</svg>
