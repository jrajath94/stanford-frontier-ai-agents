<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the SaaS reckoning</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The compromise was arithmetic. Generation got cheap, so the arithmetic flipped.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the flip</text>
<text x="406" y="124">the rule: generation gets cheap</text>
<text x="648" y="124">WITH the flip</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="284" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="184" text-anchor="middle" fill="#1B2838">one interface for the</text>
<text x="190" y="208" text-anchor="middle" fill="#1B2838">most customers</text>
<text x="190" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">$2M to build, 1,000 customers,</text>
<text x="190" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">$2,000 each</text>
<text x="190" y="324" text-anchor="middle" fill="#C46B2C" font-size="14">1,000 tailored interfaces</text>
<text x="190" y="348" text-anchor="middle" fill="#C46B2C" font-size="14">would cost $2B</text>
<text x="190" y="392" text-anchor="middle" fill="#5C6B7A" font-size="14">the compromise is not</text>
<text x="190" y="416" text-anchor="middle" fill="#5C6B7A" font-size="14">a choice. It is arithmetic.</text>
<rect x="348" y="140" width="284" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="490" y="184" text-anchor="middle" fill="#1B2838">the cost of a tailored</text>
<text x="490" y="208" text-anchor="middle" fill="#1B2838">interface collapses</text>
<text x="490" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">tailored costs prompts,</text>
<text x="490" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">not engineers</text>
<text x="490" y="324" text-anchor="middle" fill="#1E4D8C" font-size="14">the loop: prompt, generate,</text>
<text x="490" y="348" text-anchor="middle" fill="#1E4D8C" font-size="14">deploy, observe, iterate</text>
<text x="490" y="392" text-anchor="middle" fill="#5C6B7A" font-size="14">decision rule: if a CEO can</text>
<text x="490" y="416" text-anchor="middle" fill="#5C6B7A" font-size="14">rebuild it in an afternoon...</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">the parking lot</text>
<text x="780" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">a CEO vibe-coded the parking</text>
<text x="780" y="236" text-anchor="middle" fill="#5C6B7A" font-size="14">software in v0</text>
<text x="780" y="280" text-anchor="middle" fill="#1B2838">the Salesforce rebuild</text>
<text x="780" y="308" text-anchor="middle" fill="#5C6B7A" font-size="14">two people rebuilt the surface</text>
<text x="780" y="332" text-anchor="middle" fill="#5C6B7A" font-size="14">for their own company</text>
<text x="780" y="376" text-anchor="middle" fill="#1F7A72" font-size="14">the presentation layer</text>
<text x="780" y="400" text-anchor="middle" fill="#1F7A72" font-size="14">goes plastic</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="488" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: the system of record stays. The database, the access controls, and the workflows are not regenerated.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">SaaS keeps the system of record and grows an agent-shaped surface: MCP, CLIs, APIs, consumption pricing.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the honest version of "software is dead" is "undifferentiated software is dead."</text>
</svg>
