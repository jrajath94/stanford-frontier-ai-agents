<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: agentic infrastructure</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The cloud is being rebuilt around the agent as the unit. The triangle is the map.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rebuild</text>
<text x="420" y="124">the rule: the unit is the agent</text>
<text x="648" y="124">WITH the rebuild</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="284" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="184" text-anchor="middle" fill="#1B2838">EC2 for human-written</text>
<text x="190" y="208" text-anchor="middle" fill="#1B2838">code: pages and servers</text>
<text x="190" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">demand capped by</text>
<text x="190" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">programmer headcount</text>
<text x="190" y="324" text-anchor="middle" fill="#C46B2C" font-size="14">the agent has no home:</text>
<text x="190" y="348" text-anchor="middle" fill="#C46B2C" font-size="14">no computer of its own,</text>
<text x="190" y="372" text-anchor="middle" fill="#C46B2C" font-size="14">no delivery network</text>
<rect x="348" y="140" width="284" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="490" y="184" text-anchor="middle" fill="#1B2838">the shippable entity</text>
<text x="490" y="208" text-anchor="middle" fill="#1B2838">changed: page to agent</text>
<text x="490" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">long-running, token-</text>
<text x="490" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">consuming, deploying</text>
<text x="490" y="324" text-anchor="middle" fill="#1E4D8C" font-size="14">decision rule: when the entity</text>
<text x="490" y="348" text-anchor="middle" fill="#1E4D8C" font-size="14">changes, the primitives</text>
<text x="490" y="372" text-anchor="middle" fill="#1E4D8C" font-size="14">get rebuilt</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">side 1: FOR agents</text>
<text x="780" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">somewhere for agent-written</text>
<text x="780" y="236" text-anchor="middle" fill="#5C6B7A" font-size="14">code to deploy</text>
<text x="780" y="280" text-anchor="middle" fill="#1B2838">side 2: TO BUILD</text>
<text x="780" y="308" text-anchor="middle" fill="#5C6B7A" font-size="14">support agent answers 93%</text>
<text x="780" y="332" text-anchor="middle" fill="#5C6B7A" font-size="14">of inquiries</text>
<text x="780" y="376" text-anchor="middle" fill="#1B2838">side 3: BY agents</text>
<text x="780" y="404" text-anchor="middle" fill="#5C6B7A" font-size="14">the Eve fleet: 100+ agents,</text>
<text x="780" y="428" text-anchor="middle" fill="#5C6B7A" font-size="14">lead agent returns 32x</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="488" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: agent-to-agent commerce. The software company of the agent era sells to programs first, people second.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Rauch is long companies with instant signup, consumption pricing, and agent-ready interfaces.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the agent-era buyer is a token budget with a goal. Sell to it or be invisible to it.</text>
</svg>
