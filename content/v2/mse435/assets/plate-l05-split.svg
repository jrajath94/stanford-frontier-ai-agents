<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Inter, 'Source Sans 3', sans-serif">
<rect width="960" height="560" fill="#F7F4EE"/>
<text x="48" y="60" font-size="30" font-weight="600" fill="#1B2838">What goes plastic and what holds</text>
<text x="48" y="92" font-size="17" fill="#5C6B7A">The presentation layer is regenerated per business. The system of record is not. Shell 3. Source: original, drawn from the session.</text>
<g font-size="15" font-weight="500">
<rect x="48" y="132" width="412" height="200" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="254" y="168" text-anchor="middle" fill="#1B2838" font-size="18" font-weight="600">goes plastic (dies)</text>
<text x="254" y="200" text-anchor="middle" fill="#5C6B7A" font-size="14">lowest-common-denominator SaaS</text>
<text x="254" y="226" text-anchor="middle" fill="#5C6B7A" font-size="14">parking-lot-grade internal tools</text>
<text x="254" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">one-call demo software</text>
<text x="254" y="278" text-anchor="middle" fill="#5C6B7A" font-size="14">drag-and-drop builders</text>
<rect x="500" y="132" width="412" height="200" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="706" y="168" text-anchor="middle" fill="#1B2838" font-size="18" font-weight="600">stays hard (holds)</text>
<text x="706" y="200" text-anchor="middle" fill="#5C6B7A" font-size="14">system of record: data, ACLs</text>
<text x="706" y="226" text-anchor="middle" fill="#5C6B7A" font-size="14">infrastructure plumbing</text>
<text x="706" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">trust, distribution, taste</text>
<text x="706" y="278" text-anchor="middle" fill="#5C6B7A" font-size="14">the deployment layer itself</text>
</g>
<rect x="48" y="364" width="864" height="104" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="76" y="400" font-size="16" fill="#1B2838"><tspan font-weight="600">Two exhibits:</tspan> a CEO vibe-coded the parking software in v0. Two people rebuilt Salesforce's surface.</text>
<text x="76" y="430" font-size="16" fill="#1B2838">In both cases the data layer stayed. Only the pixels on top went plastic.</text>
<text x="48" y="512" font-size="16" font-weight="500" fill="#1B2838">One claim: SaaS was a compromise, and the compromise was arithmetic. The arithmetic flipped.</text>
</svg>
