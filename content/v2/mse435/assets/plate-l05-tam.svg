<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Inter, 'Source Sans 3', sans-serif">
<rect width="960" height="540" fill="#F7F4EE"/>
<text x="48" y="60" font-size="30" font-weight="600" fill="#1B2838">The TAM expansion: who can create software</text>
<text x="48" y="92" font-size="17" fill="#5C6B7A">Each wave multiplies the creators. Agents break the programmer-headcount cap. Shell 2. Source: original, drawn from the session.</text>
<g font-size="14" font-weight="500">
<rect x="48" y="128" width="200" height="110" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="148" y="160" text-anchor="middle" fill="#5C6B7A">mainframes</text>
<text x="148" y="188" text-anchor="middle" fill="#1B2838" font-size="16" font-weight="600">a priesthood</text>
<text x="148" y="212" text-anchor="middle" fill="#5C6B7A">thousands</text>
<rect x="264" y="128" width="200" height="110" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="364" y="160" text-anchor="middle" fill="#5C6B7A">PC + web + open source</text>
<text x="364" y="188" text-anchor="middle" fill="#1B2838" font-size="16" font-weight="600">millions</text>
<text x="364" y="212" text-anchor="middle" fill="#5C6B7A">the circle widens</text>
<rect x="480" y="128" width="200" height="110" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="580" y="160" text-anchor="middle" fill="#5C6B7A">Vercel's bet</text>
<text x="580" y="188" text-anchor="middle" fill="#1B2838" font-size="16" font-weight="600">~20M developers</text>
<text x="580" y="212" text-anchor="middle" fill="#5C6B7A">can deploy</text>
<rect x="696" y="128" width="216" height="110" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="804" y="160" text-anchor="middle" fill="#5C6B7A">agents</text>
<text x="804" y="188" text-anchor="middle" fill="#1B2838" font-size="16" font-weight="600">anyone who can</text>
<text x="804" y="212" text-anchor="middle" fill="#1B2838" font-size="16" font-weight="600">describe it</text>
</g>
<rect x="48" y="272" width="864" height="120" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="2"/>
<text x="480" y="314" text-anchor="middle" font-size="18" font-weight="600" fill="#1B2838">The cap breaks: Oct 2025, strong coding models arrive, Vercel deployments surge</text>
<text x="480" y="346" text-anchor="middle" font-size="15" fill="#5C6B7A">Cloud demand was capped by programmer headcount. Now agents write, repair, and secure software around the clock.</text>
<text x="480" y="370" text-anchor="middle" font-size="15" fill="#5C6B7A">The marginal creator is an agent with a token budget, not a person with a salary.</text>
<text x="48" y="446" font-size="16" font-weight="500" fill="#1B2838">One claim: the biggest TAM expansion in software history is a demand shock for compute.</text>
</svg>
