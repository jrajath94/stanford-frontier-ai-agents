<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the block economy</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Agents assemble blocks they can reason about locally. Build those blocks.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT local reasoning</text>
<text x="400" y="124">the rule: agentic ergonomics</text>
<text x="648" y="124">WITH local reasoning</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="284" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="184" text-anchor="middle" fill="#1B2838">global coupling:</text>
<text x="190" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">a component needing the whole</text>
<text x="190" y="236" text-anchor="middle" fill="#5C6B7A" font-size="14">50,000-token file to modify</text>
<text x="190" y="280" text-anchor="middle" fill="#C46B2C" font-size="14">the agent cannot swallow</text>
<text x="190" y="304" text-anchor="middle" fill="#C46B2C" font-size="14">the world: its context window</text>
<text x="190" y="328" text-anchor="middle" fill="#C46B2C" font-size="14">holds about a million tokens</text>
<text x="190" y="372" text-anchor="middle" fill="#5C6B7A" font-size="14">too many tokens to reason,</text>
<text x="190" y="396" text-anchor="middle" fill="#5C6B7A" font-size="14">so the block is never chosen</text>
<rect x="348" y="140" width="284" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="490" y="184" text-anchor="middle" fill="#1B2838">minimize the tokens an agent</text>
<text x="490" y="208" text-anchor="middle" fill="#1B2838">needs to use your block</text>
<text x="490" y="232" text-anchor="middle" fill="#1B2838">correctly</text>
<text x="490" y="276" text-anchor="middle" fill="#5C6B7A" font-size="14">Rauch's example is Tailwind:</text>
<text x="490" y="304" text-anchor="middle" fill="#5C6B7A" font-size="14">it works the same</text>
<text x="490" y="328" text-anchor="middle" fill="#5C6B7A" font-size="14">wherever it is placed</text>
<text x="490" y="372" text-anchor="middle" fill="#1E4D8C" font-size="14">build open blocks with</text>
<text x="490" y="396" text-anchor="middle" fill="#1E4D8C" font-size="14">agentic ergonomics</text>
<text x="490" y="420" text-anchor="middle" fill="#5C6B7A" font-size="14">(Mitchell Hashimoto's term)</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">200 tokens of context</text>
<text x="780" y="208" text-anchor="middle" fill="#1B2838">to modify</text>
<text x="780" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">React, Next.js, shadcn:</text>
<text x="780" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">local-reasoning blocks</text>
<text x="780" y="324" text-anchor="middle" fill="#1F7A72" font-size="14">86 out of 86 agent runs</text>
<text x="780" y="348" text-anchor="middle" fill="#1F7A72" font-size="14">chose Vercel's deployment</text>
<text x="780" y="372" text-anchor="middle" fill="#1F7A72" font-size="14">90.1% "near monopoly"</text>
<text x="780" y="416" text-anchor="middle" fill="#5C6B7A" font-size="14">agents vote for the blocks</text>
<text x="780" y="440" text-anchor="middle" fill="#5C6B7A" font-size="14">they know</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="488" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: agents reuse what they know. The stack most represented in training data wins every run.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Open infrastructure wins because agents need a target to throw code at.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: in the block economy, composability is money.</text>
</svg>
