<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the token CDN</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The pixel CDN did this for images in 1998. The token CDN does it for cognition in 2026.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the gateway</text>
<text x="412" y="124">the rule: route and cache</text>
<text x="648" y="124">WITH the gateway</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="284" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="184" text-anchor="middle" fill="#1B2838">"thanks" wakes</text>
<text x="190" y="208" text-anchor="middle" fill="#1B2838">about 300 GPUs</text>
<text x="190" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">the flagship answers</text>
<text x="190" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">every trivial request</text>
<text x="190" y="324" text-anchor="middle" fill="#C46B2C" font-size="14">everyone pays the list</text>
<text x="190" y="348" text-anchor="middle" fill="#C46B2C" font-size="14">price, every time</text>
<text x="190" y="392" text-anchor="middle" fill="#5C6B7A" font-size="14">no failover, no caching,</text>
<text x="190" y="416" text-anchor="middle" fill="#5C6B7A" font-size="14">no balance</text>
<rect x="348" y="140" width="284" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="490" y="184" text-anchor="middle" fill="#1B2838">cache by meaning,</text>
<text x="490" y="208" text-anchor="middle" fill="#1B2838">not exact text</text>
<text x="490" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">"thanks" and "thank you"</text>
<text x="490" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">hit the same entry</text>
<text x="490" y="324" text-anchor="middle" fill="#1E4D8C" font-size="14">pick the cheapest capable</text>
<text x="490" y="348" text-anchor="middle" fill="#1E4D8C" font-size="14">model; wake the flagship</text>
<text x="490" y="372" text-anchor="middle" fill="#1E4D8C" font-size="14">only if the task demands it</text>
<text x="490" y="416" text-anchor="middle" fill="#5C6B7A" font-size="14">95% of the CDN machinery</text>
<text x="490" y="440" text-anchor="middle" fill="#5C6B7A" font-size="14">reused: same engine, new fuel</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">$990 a day kept</text>
<text x="780" y="208" text-anchor="middle" fill="#1B2838">on politeness alone</text>
<text x="780" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">20M trivial tokens a day:</text>
<text x="780" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">$1,000 flagship vs $10 small</text>
<text x="780" y="324" text-anchor="middle" fill="#1F7A72" font-size="14">the discount stack applied</text>
<text x="780" y="348" text-anchor="middle" fill="#1F7A72" font-size="14">on every request: batch 50%</text>
<text x="780" y="372" text-anchor="middle" fill="#1F7A72" font-size="14">off, cache reads 20x cheaper</text>
<text x="780" y="416" text-anchor="middle" fill="#5C6B7A" font-size="14">the list price is the ceiling</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="488" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: the August index barbell. Open weights carry 56% of tokens but 14% of spend.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Cheap open weights absorb bulk processing; frontier closed models take the hard work where quality pays.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the gateway does not just route tokens. It measures the commoditization in real time.</text>
</svg>
