<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the token economy</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Tokens are the new hot commodity: the unit of the new economy.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the unit</text>
<text x="410" y="124">the rule: sell the unit</text>
<text x="648" y="124">WITH the unit</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="284" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="184" text-anchor="middle" fill="#1B2838">seats: $20 per user</text>
<text x="190" y="208" text-anchor="middle" fill="#1B2838">per month</text>
<text x="190" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">1,000 seats, $20,000 a month,</text>
<text x="190" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">whether users work or sleep</text>
<text x="190" y="324" text-anchor="middle" fill="#C46B2C" font-size="14">the customer pays for access</text>
<text x="190" y="348" text-anchor="middle" fill="#C46B2C" font-size="14">whether anyone logs in</text>
<text x="190" y="392" text-anchor="middle" fill="#5C6B7A" font-size="14">usage was free to the</text>
<text x="190" y="416" text-anchor="middle" fill="#5C6B7A" font-size="14">customer, costly to the vendor</text>
<rect x="348" y="140" width="284" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="490" y="184" text-anchor="middle" fill="#1B2838">sell intelligence</text>
<text x="490" y="208" text-anchor="middle" fill="#1B2838">by the unit</text>
<text x="490" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">Vercel used to stream pixels</text>
<text x="490" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">to users; now it streams</text>
<text x="490" y="304" text-anchor="middle" fill="#5C6B7A" font-size="14">intelligence as tokens</text>
<text x="490" y="348" text-anchor="middle" fill="#1E4D8C" font-size="14">the meter moved from the</text>
<text x="490" y="372" text-anchor="middle" fill="#1E4D8C" font-size="14">user to the unit of cognition</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">$2 per million</text>
<text x="780" y="208" text-anchor="middle" fill="#1B2838">input tokens</text>
<text x="780" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">10,000 chats x 5,000 tokens:</text>
<text x="780" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">$100 of input</text>
<text x="780" y="324" text-anchor="middle" fill="#1F7A72" font-size="14">the ladder spans $0.50</text>
<text x="780" y="348" text-anchor="middle" fill="#1F7A72" font-size="14">to $50 per million output:</text>
<text x="780" y="372" text-anchor="middle" fill="#1F7A72" font-size="14">a hundredfold</text>
<text x="780" y="416" text-anchor="middle" fill="#5C6B7A" font-size="14">nobody pays the list price</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="488" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: output costs 5x input, always. Generating costs more compute than reading.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Decision rule: when you optimize cost, shrink the output first.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: pricing follows the meter. The meter is now the token.</text>
</svg>
