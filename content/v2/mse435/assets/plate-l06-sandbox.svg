<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="60" font-size="30" font-weight="600" fill="#1B2838">The sandbox: EC2 for agents</text>
<text x="48" y="92" font-size="17" fill="#5C6B7A">An ephemeral computer per agent task, provisioned and destroyed. Shell 3. Source: original, drawn from the session.</text>
<g font-size="15" font-weight="500">
<text x="48" y="148" font-size="17" font-weight="600" fill="#1B2838">before: EC2, built for human-written code</text>
<rect x="48" y="164" width="288" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="192" y="196" text-anchor="middle" fill="#5C6B7A">human-written code</text>
<text x="192" y="220" text-anchor="middle" fill="#5C6B7A" font-size="14">pages and servers</text>
<line x1="192" y1="236" x2="192" y2="280" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="184,280 200,280 192,296" fill="#1B2838"/>
<rect x="48" y="296" width="288" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="192" y="328" text-anchor="middle" fill="#1B2838">a computer per credit card</text>
<text x="192" y="352" text-anchor="middle" fill="#5C6B7A" font-size="14">elastic compute for humans</text>
<text x="400" y="264" font-size="16" font-weight="600" fill="#C46B2C">the rule: the unit changes</text>
<text x="400" y="290" font-size="16" font-weight="600" fill="#C46B2C">from the page to the agent</text>
<line x1="336" y1="220" x2="640" y2="220" stroke="#C46B2C" stroke-width="2"/>
<polygon points="640,212 656,220 640,228" fill="#C46B2C"/>
<text x="672" y="148" font-size="17" font-weight="600" fill="#1F7A72">after: sandbox, built for agents</text>
<rect x="672" y="164" width="240" height="72" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="792" y="196" text-anchor="middle" fill="#1B2838">agent + token budget</text>
<text x="792" y="220" text-anchor="middle" fill="#5C6B7A" font-size="14">the new shippable entity</text>
<line x1="792" y1="236" x2="792" y2="280" stroke="#1F7A72" stroke-width="1.5"/>
<polygon points="784,280 800,280 792,296" fill="#1F7A72"/>
<rect x="672" y="296" width="240" height="88" rx="12" fill="#FFFDF8" stroke="#1F7A72" stroke-width="1.5" stroke-dasharray="10,6"/>
<text x="792" y="330" text-anchor="middle" fill="#1B2838">ephemeral computer</text>
<text x="792" y="356" text-anchor="middle" fill="#5C6B7A" font-size="14">provisioned, used, destroyed</text>
<rect x="672" y="408" width="112" height="48" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="728" y="438" text-anchor="middle" fill="#1B2838" font-size="14">tools</text>
<rect x="800" y="408" width="112" height="48" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="856" y="438" text-anchor="middle" fill="#1B2838" font-size="14">pre-installed</text>
<text x="856" y="484" text-anchor="middle" fill="#5C6B7A" font-size="14">like IT for the hire's laptop</text>
</g>
<text x="48" y="548" font-size="16" font-weight="500" fill="#1B2838">One claim: models plus computers beat models alone, the way hires plus laptops beat hires alone.</text>
</svg>
