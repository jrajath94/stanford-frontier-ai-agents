<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="520" fill="#F7F4EE"/>
<text x="48" y="60" font-size="30" font-weight="600" fill="#1B2838">Seats versus tokens: the meter moves</text>
<text x="48" y="92" font-size="17" fill="#5C6B7A">SaaS sold access per seat. The token economy sells intelligence per unit. Shell 3. Source: original, drawn from the session.</text>
<g font-size="15" font-weight="500">
<rect x="48" y="132" width="412" height="190" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="254" y="168" text-anchor="middle" fill="#1B2838" font-size="18" font-weight="600">SaaS: the seat</text>
<text x="254" y="198" text-anchor="middle" fill="#5C6B7A" font-size="14">$20 / seat / month</text>
<text x="254" y="224" text-anchor="middle" fill="#5C6B7A" font-size="14">1,000 seats = $20,000</text>
<text x="254" y="250" text-anchor="middle" fill="#5C6B7A" font-size="14">whether users work or sleep</text>
<text x="254" y="280" text-anchor="middle" fill="#C46B2C" font-size="14">the seat is insurance</text>
<rect x="500" y="132" width="412" height="190" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="706" y="168" text-anchor="middle" fill="#1B2838" font-size="18" font-weight="600">token economy: the unit</text>
<text x="706" y="198" text-anchor="middle" fill="#5C6B7A" font-size="14">$2 / million input tokens</text>
<text x="706" y="224" text-anchor="middle" fill="#5C6B7A" font-size="14">10k chats x 5k tokens = $100</text>
<text x="706" y="250" text-anchor="middle" fill="#5C6B7A" font-size="14">heavy users pay more</text>
<text x="706" y="280" text-anchor="middle" fill="#1F7A72" font-size="14">the token is a utility bill</text>
</g>
<rect x="48" y="356" width="864" height="88" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="76" y="392" font-size="16" fill="#1B2838"><tspan font-weight="600">Who wins:</tspan> vendors whose product gets more valuable with usage.</text>
<text x="76" y="418" font-size="16" fill="#1B2838"><tspan font-weight="600">Who loses:</tspan> vendors whose pricing assumed usage was free. Their power users leave first.</text>
<text x="48" y="486" font-size="16" font-weight="500" fill="#1B2838">One claim: the meter moved from the user to the unit of cognition. Pricing follows the meter.</text>
</svg>
