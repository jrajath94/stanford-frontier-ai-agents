<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">The course on one plate</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Generate, verify, train. Each lecture strengthens one stage or names its price.</text><rect x="40" y="136" width="78.08" height="32" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="79.03999999999999" y="157" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">L01 loop</text><rect x="230" y="136" width="105.12" height="32" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="282.56" y="157" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">L02 generate</text><rect x="420" y="136" width="71.32" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="455.65999999999997" y="157" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">L03 act</text><rect x="610" y="136" width="84.84" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="652.42" y="157" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">L04 train</text><rect x="800" y="136" width="78.08" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="839.04" y="157" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">L05 plan</text><rect x="40" y="200" width="84.84" height="32" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="82.42" y="221" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">L06 scale</text><rect x="230" y="200" width="78.08" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="269.04" y="221" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">L07 know</text><rect x="420" y="200" width="84.84" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="462.42" y="221" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">L08 learn</text><rect x="610" y="200" width="84.84" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="652.42" y="221" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">L09 judge</text><rect x="800" y="200" width="98.36" height="32" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="849.18" y="221" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">L10 measure</text><text x="40" y="300" text-anchor="start" font-size="14" font-weight="450" fill="#1E4D8C">engine: generate -&gt; verify -&gt; train -&gt; repeat. stalls: verifier, diversity, cost.</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 4. Ten chapters, one engine. Source: original.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original</text></svg>