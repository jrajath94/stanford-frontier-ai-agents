="1.5" rx="999"/><text x="402.96" y="265" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">59min vs 15min</text><text x="510" y="266" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">AlphaCode 2 vs 1</text><rect x="810" y="244" width="147.76" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="883.88" y="265" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">100 vs 1M samples</text><text x="40" y="322" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">IMO shortlist best-of-32</text><rect x="340" y="300" width="48" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="364.0" y="321" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">42%</text><text x="510" y="322" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">DeepScholar top score</text><rect x="810" y="300" width="53.120000000000005" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="836.56" y="321" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">&lt;19%</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. Quote these in interviews. Source: lessons.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: lessons</text></svg>