<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="600" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">Thinking out loud beats one leap</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">The tennis toy: 5 + 2 x 3 = 11. Steps check each other.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="496" height="360" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="288" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">One leap</text>
<rect x="168" y="190" width="240" height="80" rx="12" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="288.0" y="220.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">5 + 2 x 3 = ?</text>
<text x="288.0" y="244.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">just says a number</text>
<line x1="288" y1="290" x2="288" y2="350" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="298.0" y="320.0" font-size="13" font-weight="500" fill="#1F7A72">guess</text>
<rect x="168" y="360" width="240" height="80" rx="12" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="288.0" y="390.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">11 ?</text>
<text x="288.0" y="414.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">no checks on the way</text>
<rect x="584" y="120" width="496" height="360" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="832" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Chain of thought</text>
<rect x="616.0" y="196.0" width="128" height="88" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/>
<text x="680" y="236" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Start</text>
<text x="680" y="260" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">5 balls</text>
<rect x="768.0" y="196.0" width="128" height="88" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/>
<text x="832" y="236" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Cans</text>
<text x="832" y="260" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">2 x 3 = 6</text>
<rect x="920.0" y="196.0" width="128" height="88" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/>
<text x="984" y="236" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Total</text>
<text x="984" y="260" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">5 + 6 = 11</text>
<line x1="748" y1="240" x2="800" y2="240" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<line x1="900" y1="240" x2="952" y2="240" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="832" y="330" font-size="14" fill="#5C6B7A" text-anchor="middle">each step is checkable</text>
<text x="832" y="360" font-size="14" fill="#5C6B7A" text-anchor="middle">on its own</text>
<rect x="692" y="396" width="280" height="60" rx="12" fill="#FFFDF8" stroke="#1E4D8C" stroke-width="2.5"/>
<text x="832.0" y="432.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">2 x 3 = 6, 5 + 6 = 11</text>
<text x="40" y="544" font-size="15" font-weight="450" fill="#1B2838">One leap guesses. Steps check each other, so errors get caught.</text>
<text x="40" y="572" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: lecture slide. Shell 3.</text>
</svg>