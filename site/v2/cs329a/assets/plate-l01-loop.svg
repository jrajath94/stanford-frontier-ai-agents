<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="620" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">The self-improvement loop</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">Generate many tries. Verify automatically. Train on winners. Repeat.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="60" y="180" width="280" height="130" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="200.0" y="235.0" font-size="18" font-weight="600" fill="#1B2838" text-anchor="middle">Generate</text>
<text x="200.0" y="259.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">many attempts</text>
<rect x="420" y="180" width="280" height="130" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="560.0" y="235.0" font-size="18" font-weight="600" fill="#1B2838" text-anchor="middle">Verify</text>
<text x="560.0" y="259.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">automatically</text>
<rect x="780" y="180" width="280" height="130" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="920.0" y="235.0" font-size="18" font-weight="600" fill="#1B2838" text-anchor="middle">Train</text>
<text x="920.0" y="259.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">on winners</text>
<line x1="344" y1="245" x2="416" y2="245" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="337.8" y="219.0" width="84.39999999999999" height="20" rx="4" fill="#F7F4EE"/>
<text x="380.0" y="234.0" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">test time</text>
<line x1="704" y1="245" x2="776" y2="245" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="694.0" y="219.0" width="92.0" height="20" rx="4" fill="#F7F4EE"/>
<text x="740.0" y="234.0" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">train time</text>
<path d="M 920 330 C 920 420, 200 420, 200 340" fill="none" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="560" y="448" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">repeat with the better model</text>
<text x="40" y="564" font-size="15" font-weight="450" fill="#1B2838">Test-time compute makes the data. Train-time compute absorbs it.</text>
<text x="40" y="592" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original. Shell 3.</text>
</svg>