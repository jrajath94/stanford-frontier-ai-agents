<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">The self-improvement loop</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Generate many tries. Verify automatically. Train on winners. Repeat.</text><rect x="56" y="176" width="240" height="120" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="176" y="224" text-anchor="middle" font-size="20" font-weight="600" fill="#1B2838">generate</text><text x="176" y="252" text-anchor="middle" font-size="14" font-weight="450" fill="#5C6B7A">many attempts</text><line x1="288" y1="236" x2="360" y2="236" stroke="#1B2838" stroke-width="2"/><polygon points="360,236 350.78939005997114,239.8941834230865 350.78939005997114,232.1058165769135" fill="#1B2838"/><rect x="368" y="176" width="240" height="120" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="488" y="224" text-anchor="middle" font-size="20" font-weight="600" fill="#1B2838">verify</text><text x="488" y="252" text-anchor="middle" font-size="14" font-weight="450" fill="#5C6B7A">keep winners</text><line x1="600" y1="236" x2="672" y2="236" stroke="#1B2838" stroke-width="2"/><polygon points="672,236 662.7893900599712,239.8941834230865 662.7893900599712,232.1058165769135" fill="#1B2838"/><rect x="680" y="176" width="240" height="120" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="800" y="224" text-anchor="middle" font-size="20" font-weight="600" fill="#1B2838">train</text><text x="800" y="252" text-anchor="middle" font-size="14" font-weight="450" fill="#5C6B7A">fine-tune</text><text x="480" y="328" text-anchor="middle" font-size="14" font-weight="450" fill="#1E4D8C">repeat: the better model generates better attempts</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Test-time compute makes data. Train-time compute absorbs it. Source: original.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original toy</text></svg>