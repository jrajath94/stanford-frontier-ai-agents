<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="660" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">Two kinds of compute, one flywheel</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">Test-time: weights fixed, answers improve. Train-time: weights change, first tries get cheaper.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="496" height="360" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="288" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Test-time compute</text>
<rect x="168" y="190" width="240" height="84" rx="12" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="288.0" y="222.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">weights fixed</text>
<text x="288.0" y="246.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">locked, unchanged</text>
<line x1="288" y1="294" x2="288" y2="354" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="298.0" y="324.0" font-size="13" font-weight="500" fill="#1F7A72">spend inference</text>
<rect x="168" y="364" width="240" height="84" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/>
<text x="288.0" y="396.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">answers improve</text>
<text x="288.0" y="420.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">better picks, no retraining</text>
<rect x="584" y="120" width="496" height="360" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="832" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Train-time compute</text>
<rect x="712" y="190" width="240" height="84" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="832.0" y="222.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">weights change</text>
<text x="832.0" y="246.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">train on the winners</text>
<line x1="832" y1="294" x2="832" y2="354" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="842.0" y="324.0" font-size="13" font-weight="500" fill="#1F7A72">update</text>
<rect x="712" y="364" width="240" height="84" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2.5"/>
<text x="832.0" y="396.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">first tries get cheaper</text>
<text x="832.0" y="420.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">tomorrow's one shot</text>
<path d="M 288 492 L 288 528 C 288 564, 832 564, 832 528 L 832 492" fill="none" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="560" y="584" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">flywheel: better first tries make the next round of sampling cheaper</text>
<text x="40" y="604" font-size="15" font-weight="450" fill="#1B2838">Spend compute at test time to find wins, then spend it at train time to keep them.</text>
<text x="40" y="632" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original. Shell 3.</text>
</svg>