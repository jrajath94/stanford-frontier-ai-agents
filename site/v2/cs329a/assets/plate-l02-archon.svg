<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="680" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">Archon stacks inference-time components</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">Layers of generators, fusers, critics, rankers, verifiers. Bayesian optimization picks the stack.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="640" height="400" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="360" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">One model stack</text>
<rect x="140" y="190" width="440" height="52" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="360.0" y="217.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Generators</text>
<rect x="140" y="250" width="440" height="52" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="360.0" y="277.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Fusers</text>
<rect x="140" y="310" width="440" height="52" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="360.0" y="337.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Critics</text>
<rect x="140" y="370" width="440" height="52" rx="12" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="360.0" y="397.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Rankers</text>
<rect x="140" y="430" width="440" height="52" rx="12" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="360.0" y="457.0" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Verifiers</text>
<text x="360" y="504" font-size="13" fill="#5C6B7A" text-anchor="middle">Bayesian optimization (ITAS) tries stacks and keeps what measures best</text>
<rect x="728" y="120" width="352" height="400" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="904" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Headline result</text>
<text x="904" y="220" font-size="15" fill="#5C6B7A" text-anchor="middle">average pass@1 gain</text>
<text x="904" y="280" font-size="44" font-weight="600" fill="#1F7A72" text-anchor="middle">+14.1%</text>
<text x="904" y="316" font-size="13" fill="#5C6B7A" text-anchor="middle">over GPT-4o and Claude 3.5 Sonnet</text>
<text x="904" y="340" font-size="13" fill="#5C6B7A" text-anchor="middle">with open-source models</text>
<text x="904" y="400" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">0.60 pass@1 becomes about 0.685</text>
<text x="904" y="428" font-size="13" fill="#5C6B7A" text-anchor="middle">fusion beats even oracle selection</text>
<text x="40" y="624" font-size="15" font-weight="450" fill="#1B2838">Search the inference-time architecture, and small models beat big ones on average.</text>
<text x="40" y="652" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper, Archon (v1). Shell 2.</text>
</svg>