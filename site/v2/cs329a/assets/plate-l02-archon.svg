<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Archon: spend inference compute as architecture</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Generators diversify. Critic judges. Ranker orders. Fuser writes the final answer.</text><rect x="40" y="168" width="200" height="128" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="140" y="216" text-anchor="middle" font-size="17" font-weight="600" fill="#1B2838">generators</text><text x="140" y="244" text-anchor="middle" font-size="12" font-weight="450" fill="#5C6B7A">10 open models, 1 sample each</text><line x1="240" y1="232" x2="276" y2="232" stroke="#1B2838" stroke-width="2"/><polygon points="276,232 266.78939005997114,235.8941834230865 266.78939005997114,228.1058165769135" fill="#1B2838"/><rect x="276" y="168" width="200" height="128" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="376" y="216" text-anchor="middle" font-size="17" font-weight="600" fill="#1B2838">critic</text><text x="376" y="244" text-anchor="middle" font-size="12" font-weight="450" fill="#5C6B7A">strengths and weaknesses</text><line x1="476" y1="232" x2="512" y2="232" stroke="#1B2838" stroke-width="2"/><polygon points="512,232 502.78939005997114,235.8941834230865 502.78939005997114,228.1058165769135" fill="#1B2838"/><rect x="512" y="168" width="200" height="128" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="612" y="216" text-anchor="middle" font-size="17" font-weight="600" fill="#1B2838">ranker</text><text x="612" y="244" text-anchor="middle" font-size="12" font-weight="450" fill="#5C6B7A">orders candidates</text><line x1="712" y1="232" x2="748" y2="232" stroke="#1B2838" stroke-width="2"/><polygon points="748,232 738.7893900599712,235.8941834230865 738.7893900599712,228.1058165769135" fill="#1B2838"/><rect x="748" y="168" width="200" height="128" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="848" y="216" text-anchor="middle" font-size="17" font-weight="600" fill="#1B2838">fuser</text><text x="848" y="244" text-anchor="middle" font-size="12" font-weight="450" fill="#5C6B7A">writes final answer</text><text x="480" y="336" text-anchor="middle" font-size="14" font-weight="450" fill="#1E4D8C">+14.1% average pass@1 over GPT-4o and Claude 3.5 Sonnet, open models only</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Fusion beats picking: the fuser synthesizes instead of selecting. Source: paper: Archon.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: paper: Archon</text></svg>