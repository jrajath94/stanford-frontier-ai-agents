<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Parallelism saves latency, not money</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">100 samples in parallel finish as fast as 1. They cost 100x the compute.</text><rect x="32" y="96" width="420" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">1 sample</text><rect x="56" y="176" width="120" height="80" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="116.0" y="221.25" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">1x</text><text x="56" y="292" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">latency T, cost C</text><rect x="508" y="96" width="420" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="524" y="122" font-size="14" font-weight="600" fill="#5C6B7A">100 samples, parallel</text><rect x="532" y="176" width="88" height="80" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="576.0" y="221.25" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">1x</text><rect x="628" y="176" width="88" height="80" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="672.0" y="221.25" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">1x</text><rect x="724" y="176" width="88" height="80" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="768.0" y="221.25" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">1x</text><rect x="820" y="176" width="88" height="80" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="864.0" y="221.25" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2838">1x</text><text x="532" y="224" text-anchor="start" font-size="18" font-weight="600" fill="#1B2838">...</text><text x="532" y="292" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">latency T, cost 100xC</text><line x1="460" y1="216" x2="500" y2="216" stroke="#1B2838" stroke-width="2"/><polygon points="500,216 490.78939005997114,219.8941834230865 490.78939005997114,212.1058165769135" fill="#1B2838"/><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. The bill is per question, paid every time. Source: original.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original</text></svg>