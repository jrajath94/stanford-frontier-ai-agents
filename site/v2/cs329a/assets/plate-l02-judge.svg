<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">The verifier decides what sampling buys</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Oracle: every gain is real. A 90%-accurate judge approves 10 wrong answers per 100 samples.</text><rect x="32" y="96" width="420" height="240" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">oracle verifier</text><text x="56" y="168" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">100 samples</text><text x="56" y="196" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">keeps only true wins</text><rect x="56" y="224" width="176.88" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="144.44" y="245" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">coverage up, trust up</text><rect x="508" y="96" width="420" height="240" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="524" y="122" font-size="14" font-weight="600" fill="#5C6B7A">90%-accurate judge</text><text x="532" y="168" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">100 samples on unsolvable problem</text><text x="532" y="196" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">judge approves ~10 wrong answers</text><rect x="532" y="224" width="191.44" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="627.72" y="245" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">coverage up, trust down</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Sampling converts generation into verification. A weak judge converts it back into noise. Source: original toy.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original toy</text></svg>