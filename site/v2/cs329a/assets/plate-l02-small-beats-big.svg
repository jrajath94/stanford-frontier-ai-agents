<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Verification lets small models beat giants</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Llama 3 8B with thousands of verified samples outperforms GPT-4o-class models at one try.</text><rect x="200" y="136" width="180" height="48" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="290.0" y="164.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2838">GPT-4o-class, 1 try</text><rect x="200" y="200" width="420" height="48" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="410.0" y="228.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2838">Llama 3 8B, thousands of tries + verifier</text><text x="200" y="284" text-anchor="start" font-size="13" font-weight="450" fill="#5C6B7A">hard math and coding benchmarks, lecture-reported</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. The small model did not get smarter. It got more chances. Source: paper: Large Language Monkeys.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: paper: Large Language Monkeys</text></svg>