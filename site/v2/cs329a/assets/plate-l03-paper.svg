<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">ReAct&#x27;s measured wins</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">1-2 in-context examples. Absolute gains over imitation and RL baselines.</text><text x="64" y="160" text-anchor="start" font-size="16" font-weight="600" fill="#1B2838">ALFWorld</text><rect x="240" y="136" width="118.64" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="299.32" y="157" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">+34% absolute</text><text x="440" y="160" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">best trial 71% avg</text><text x="64" y="216" text-anchor="start" font-size="16" font-weight="600" fill="#1B2838">WebShop</text><rect x="240" y="192" width="118.64" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="299.32" y="213" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">+10% absolute</text><text x="440" y="216" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">vs baselines</text><text x="64" y="264" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">HotpotQA and Fever: cuts hallucination by letting the model go check</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. The traces are legible: you can read what the model believed at step 4. Source: paper: ReAct.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: paper: ReAct</text></svg>