<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="620" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">Two tiers of tests</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">Public tests drive revision in the episode. Private tests drive the reward.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="496" height="360" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="288" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Public tests, visible</text>
<rect x="148" y="190" width="280" height="84" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="288.0" y="222.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">model sees failures</text>
<text x="288.0" y="246.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">runs code, reads output</text>
<line x1="288" y1="294" x2="288" y2="354" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="298.0" y="324.0" font-size="13" font-weight="500" fill="#1F7A72">revise in-episode</text>
<rect x="148" y="364" width="280" height="84" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2.5"/>
<text x="288.0" y="396.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">ships a linear fix</text>
<text x="288.0" y="420.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">timeout seen, fixed</text>
<rect x="584" y="120" width="496" height="360" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="832" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Private tests, hidden</text>
<rect x="692" y="190" width="280" height="84" rx="12" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="832.0" y="222.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">never shown</text>
<text x="832.0" y="246.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">kept secret from the model</text>
<line x1="832" y1="294" x2="832" y2="354" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="842.0" y="324.0" font-size="13" font-weight="500" fill="#1F7A72">score the reward</text>
<rect x="692" y="364" width="280" height="84" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/>
<text x="832.0" y="396.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">final code scored</text>
<text x="832.0" y="420.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">real correctness</text>
<text x="560" y="530" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">The split stops test-gaming: no gaming the visible tests.</text>
<text x="40" y="564" font-size="15" font-weight="450" fill="#1B2838">Where feedback is automatic, reinforcement learning closes the loop without human labels.</text>
<text x="40" y="592" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper, RLEF. Shell 3.</text>
</svg>