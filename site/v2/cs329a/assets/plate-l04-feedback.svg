<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">The feedback the model actually reads</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Failures arrive as assertion errors with runtime values, not as a bare 0.</text><rect x="32" y="96" width="896" height="220" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">execution feedback template</text><text x="56" y="160" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">Your code failed some test cases:</text><text x="56" y="192" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">- Failure: test_3: AssertionError: got 14, expected 10</text><text x="56" y="220" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">- Failure: test_7: Execution took too long.</text><text x="56" y="248" text-anchor="start" font-size="14" font-weight="450" fill="#1F7A72">- Success: test_1, test_2, test_4, test_5, test_6</text><text x="56" y="284" text-anchor="start" font-size="15" font-weight="600" fill="#1E4D8C">Give it another try.</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. Informative failures make retries targeted. Source: paper: RLEF.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: paper: RLEF</text></svg>