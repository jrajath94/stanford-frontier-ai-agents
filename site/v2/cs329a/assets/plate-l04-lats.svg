<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="720" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">Search grows a tree, not a line</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">Six stages: select, expand, evaluate, simulate, backpropagate, reflect.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="1040" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="56.0" y="164.0" width="128" height="72" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="120" y="206" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">select</text>
<line x1="188" y1="200" x2="212" y2="200" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="216.0" y="164.0" width="128" height="72" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="280" y="206" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">expand</text>
<line x1="348" y1="200" x2="372" y2="200" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="376.0" y="164.0" width="128" height="72" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="440" y="206" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">evaluate</text>
<line x1="508" y1="200" x2="532" y2="200" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="536.0" y="164.0" width="128" height="72" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="600" y="206" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">simulate</text>
<line x1="668" y1="200" x2="692" y2="200" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="696.0" y="164.0" width="128" height="72" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="760" y="206" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">backpropagate</text>
<line x1="828" y1="200" x2="852" y2="200" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="856.0" y="164.0" width="128" height="72" rx="12" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="920" y="206" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">reflect</text>
<rect x="40" y="348" width="496" height="220" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="288" y="380" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">UCT selection toy</text>
<text x="288" y="420" font-size="15" fill="#1B2838" text-anchor="middle">UCT = V(s) + c x sqrt(ln(12)/4)</text>
<text x="288" y="452" font-size="15" fill="#1B2838" text-anchor="middle">= 0.62 + 0.788 = <tspan font-weight="600" fill="#1F7A72">1.408</tspan></text>
<text x="288" y="484" font-size="13" fill="#5C6B7A" text-anchor="middle">the untried child gets an exploration bonus</text>
<text x="288" y="510" font-size="13" fill="#5C6B7A" text-anchor="middle">that shrinks as it is visited</text>
<rect x="584" y="348" width="496" height="220" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="832" y="380" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Backpropagation toy</text>
<text x="832" y="420" font-size="15" fill="#1B2838" text-anchor="middle">new value = (0.55 x 5 + 1.0) / 6</text>
<text x="832" y="452" font-size="15" fill="#1B2838" text-anchor="middle">= <tspan font-weight="600" fill="#1F7A72">0.625</tspan></text>
<text x="832" y="484" font-size="13" fill="#5C6B7A" text-anchor="middle">one step up, one value updated</text>
<text x="832" y="510" font-size="13" fill="#5C6B7A" text-anchor="middle">reflection adds words, not just numbers</text>
<text x="40" y="664" font-size="15" font-weight="450" fill="#1B2838">Explore branches, remember what paid off, backtrack. Irreversible actions break the tree.</text>
<text x="40" y="692" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper, LATS. Shell 3.</text>
</svg>