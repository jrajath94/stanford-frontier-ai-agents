<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Binary reward is honest and sparse</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">9 of 10 tests pass: reward 0. Syntax error on line 1: reward 0. All pass: reward 1.</text><text x="64" y="176" text-anchor="start" font-size="16" font-weight="450" fill="#1B2838">9/10 tests pass</text><rect x="360" y="152" width="82.24000000000001" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="401.12" y="173" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">reward 0</text><text x="64" y="236" text-anchor="start" font-size="16" font-weight="450" fill="#1B2838">syntax error</text><rect x="360" y="212" width="82.24000000000001" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="401.12" y="233" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">reward 0</text><text x="64" y="296" text-anchor="start" font-size="16" font-weight="450" fill="#1B2838">all tests pass</text><rect x="360" y="272" width="82.24000000000001" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="401.12" y="293" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">reward 1</text><text x="64" y="340" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">the gradient has nothing to climb until something passes</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. Near misses teach nothing. The model must already pass sometimes. Source: original toy.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original toy</text></svg>