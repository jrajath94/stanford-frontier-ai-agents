<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Three answers to multi-step reasoning</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">LATS searches at test time. SPRINT parallelizes inside one model. SWiRL rewards the process.</text><text x="48" y="160" text-anchor="start" font-size="16" font-weight="600" fill="#1B2838">LATS</text><rect x="200" y="136" width="184.16" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="292.08" y="157" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">tree search over plans</text><text x="560" y="160" text-anchor="start" font-size="13" font-weight="450" fill="#5C6B7A">hundreds of calls per task</text><text x="48" y="220" text-anchor="start" font-size="16" font-weight="600" fill="#1B2838">SPRINT</text><rect x="200" y="196" width="206.0" height="32" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="303.0" y="217" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">parallel plan and execute</text><text x="560" y="220" text-anchor="start" font-size="13" font-weight="450" fill="#5C6B7A">explore early, converge late</text><text x="48" y="280" text-anchor="start" font-size="16" font-weight="600" fill="#1B2838">SWiRL</text><rect x="200" y="256" width="271.52" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="335.76" y="277" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">process reward before tools answer</text><text x="560" y="280" text-anchor="start" font-size="13" font-weight="450" fill="#5C6B7A">process-filtered data wins</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Same problem, three different places to put the smarts. Source: lecture-reported.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: lecture-reported</text></svg>