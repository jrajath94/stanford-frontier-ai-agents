<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Two weak signals make one value</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Judge 0.6 + self-consistency 0.75 = 1.35. Backprop: (1.35 x 3 + 1) / 4 = 1.26.</text><rect x="32" y="96" width="420" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">evaluation</text><rect x="56" y="168" width="96.8" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="104.4" y="189" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">judge: 0.6</text><text x="220" y="192" text-anchor="start" font-size="20" font-weight="600" fill="#1B2838">+</text><rect x="248" y="168" width="147.76" height="32" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="321.88" y="189" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">consistency: 0.75</text><text x="56" y="248" text-anchor="start" font-size="20" font-weight="600" fill="#1E4D8C">value = 1.35</text><rect x="508" y="96" width="420" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="524" y="122" font-size="14" font-weight="600" fill="#5C6B7A">backpropagation</text><text x="532" y="168" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">3 visits at 1.35, return 1</text><text x="532" y="204" text-anchor="start" font-size="16" font-weight="600" fill="#1B2838">(1.35 x 3 + 1) / 4</text><text x="532" y="244" text-anchor="start" font-size="20" font-weight="600" fill="#1F7A72">new value = 1.26</text><line x1="452" y1="216" x2="508" y2="216" stroke="#1B2838" stroke-width="2"/><polygon points="508,216 498.78939005997114,219.8941834230865 498.78939005997114,212.1058165769135" fill="#1B2838"/><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. Values converge toward observed outcomes with visits. Source: original toy.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original toy</text></svg>