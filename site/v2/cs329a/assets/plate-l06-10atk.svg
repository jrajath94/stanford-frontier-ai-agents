<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">10@k: generate k, submit 10</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">The metric measures search power and filtering together.</text><rect x="32" y="96" width="420" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">generate: k samples</text><text x="56" y="184" text-anchor="start" font-size="16" font-weight="600" fill="#1B2838">k = up to 1,000,000</text><text x="56" y="220" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">programs per problem</text><rect x="508" y="96" width="420" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="524" y="122" font-size="14" font-weight="600" fill="#5C6B7A">submit: at most 10</text><text x="532" y="184" text-anchor="start" font-size="16" font-weight="600" fill="#1B2838">10 programs graded</text><text x="532" y="220" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">on hidden tests</text><line x1="452" y1="216" x2="508" y2="216" stroke="#1E4D8C" stroke-width="2"/><polygon points="508,216 498.78939005997114,219.8941834230865 498.78939005997114,212.1058165769135" fill="#1E4D8C"/><rect x="431.44" y="192.0" width="97.12" height="24" fill="#F7F4EE"/><text x="480.0" y="210.0" text-anchor="middle" font-size="13" font-weight="500" fill="#1E4D8C">filter picks</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. The 10-submission limit models reality: you cannot try a million things against the world. Source: paper: AlphaCode.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: paper: AlphaCode</text></svg>