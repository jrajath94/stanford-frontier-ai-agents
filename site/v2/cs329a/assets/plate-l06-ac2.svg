<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">AlphaCode 2: learn the selector</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Better base. Diversity by design. A learned scoring model replaces the heuristic.</text><text x="48" y="160" text-anchor="start" font-size="16" font-weight="600" fill="#1B2838">better base</text><rect x="300" y="136" width="300.64" height="32" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="450.32" y="157" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">fine-tune Gemini Pro, not from scratch</text><text x="48" y="220" text-anchor="start" font-size="16" font-weight="600" fill="#1B2838">diversity by design</text><rect x="300" y="196" width="322.48" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="461.24" y="217" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">family of variants: different tags, mixes</text><text x="48" y="280" text-anchor="start" font-size="16" font-weight="600" fill="#1B2838">learned selector</text><rect x="300" y="256" width="271.52" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="435.76" y="277" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">scoring model predicts correctness</text><text x="48" y="332" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">result: ~85% of Codeforces participants beaten; 43% of problems in 10 attempts</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. 100 samples matched AlphaCode&#x27;s million. Source: lecture-reported.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: lecture-reported</text></svg>