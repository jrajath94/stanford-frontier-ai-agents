<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">The bottleneck is selection, not generation</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Unlimited submissions pass 40%. Ten submissions stall near 30%.</text><rect x="32" y="96" width="420" height="240" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">unlimited submissions</text><rect x="56" y="184" width="111.36" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="111.68" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">pass@k: 40%+</text><text x="56" y="244" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">the winner is usually in the set</text><rect x="508" y="96" width="420" height="240" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="524" y="122" font-size="14" font-weight="600" fill="#5C6B7A">10 submissions</text><rect x="532" y="184" width="96.8" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="580.4" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">10@k: ~30%</text><text x="532" y="244" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">the filter cannot always find it</text><line x1="452" y1="216" x2="508" y2="216" stroke="#C46B2C" stroke-width="2"/><polygon points="508,216 498.78939005997114,219.8941834230865 498.78939005997114,212.1058165769135" fill="#C46B2C"/><rect x="428.06" y="192.0" width="103.88000000000001" height="24" fill="#F7F4EE"/><text x="480.0" y="210.0" text-anchor="middle" font-size="13" font-weight="500" fill="#C46B2C">selection gap</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. The missing 10 points were generated but not picked. Source: lecture-reported.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: lecture-reported</text></svg>