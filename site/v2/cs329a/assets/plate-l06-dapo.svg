<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="720" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">Six rungs, one recipe</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">AIME 30 to 36 to 38 to 41 to 42 to 50. Each rung names a failure and its fix.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="1040" height="430" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="560" y="152" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">AIME accuracy, trained on Qwen 32B</text>
<line x1="120" y1="210" x2="120" y2="490" stroke="#5C6B7A" stroke-width="1.5"/>
<line x1="120" y1="490" x2="920" y2="490" stroke="#5C6B7A" stroke-width="1.5"/>
<text x="108" y="350.0" font-size="13" fill="#5C6B7A" text-anchor="end" transform="rotate(-90 108 350.0)">AIME accuracy %</text>
<path d="M 120,443 L 280,387 L 440,369 L 600,341 L 760,331 L 920,257" fill="none" stroke="#1F7A72" stroke-width="3"/>
<circle cx="120" cy="443" r="9" fill="#1F7A72" stroke="#F7F4EE" stroke-width="2"/>
<text x="120" y="425" font-size="15" font-weight="600" fill="#1F7A72" text-anchor="middle">30</text>
<circle cx="280" cy="387" r="9" fill="#1F7A72" stroke="#F7F4EE" stroke-width="2"/>
<text x="280" y="369" font-size="15" font-weight="600" fill="#1F7A72" text-anchor="middle">36</text>
<text x="280" y="516" font-size="12" font-weight="500" fill="#1B2838" text-anchor="middle">overlong filtering</text>
<circle cx="440" cy="369" r="9" fill="#1F7A72" stroke="#F7F4EE" stroke-width="2"/>
<text x="440" y="351" font-size="15" font-weight="600" fill="#1F7A72" text-anchor="middle">38</text>
<text x="440" y="516" font-size="12" font-weight="500" fill="#1B2838" text-anchor="middle">asymmetric clipping</text>
<circle cx="600" cy="341" r="9" fill="#1F7A72" stroke="#F7F4EE" stroke-width="2"/>
<text x="600" y="323" font-size="15" font-weight="600" fill="#1F7A72" text-anchor="middle">41</text>
<text x="600" y="516" font-size="12" font-weight="500" fill="#1B2838" text-anchor="middle">soft overlong punishment</text>
<circle cx="760" cy="331" r="9" fill="#1F7A72" stroke="#F7F4EE" stroke-width="2"/>
<text x="760" y="313" font-size="15" font-weight="600" fill="#1F7A72" text-anchor="middle">42</text>
<text x="760" y="516" font-size="12" font-weight="500" fill="#1B2838" text-anchor="middle">token-level loss</text>
<circle cx="920" cy="257" r="9" fill="#1F7A72" stroke="#F7F4EE" stroke-width="2"/>
<text x="920" y="239" font-size="15" font-weight="600" fill="#1F7A72" text-anchor="middle">50</text>
<text x="920" y="516" font-size="12" font-weight="500" fill="#1B2838" text-anchor="middle">dynamic sampling</text>
<text x="560" y="594" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">AIME accuracy: 30 to 36 to 38 to 41 to 42 to 50</text>
<text x="40" y="664" font-size="15" font-weight="450" fill="#1B2838">Stable reasoning RL is a ladder of named fixes: dynamic sampling fights entropy collapse.</text>
<text x="40" y="692" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper, DAPO. Shell 2.</text>
</svg>