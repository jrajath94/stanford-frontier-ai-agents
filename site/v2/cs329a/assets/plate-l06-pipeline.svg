<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">AlphaCode: generate, filter, cluster, submit</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Example tests remove 95%. Clustering buys diversity. One pick per cluster.</text><rect x="32" y="168" width="200" height="128" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="132" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">generate</text><text x="132" y="242" text-anchor="middle" font-size="12" font-weight="450" fill="#5C6B7A">up to 1M programs</text><line x1="232" y1="232" x2="264" y2="232" stroke="#1B2838" stroke-width="2"/><polygon points="264,232 254.78939005997114,235.8941834230865 254.78939005997114,228.1058165769135" fill="#1B2838"/><rect x="264" y="168" width="200" height="128" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="364" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">filter</text><text x="364" y="242" text-anchor="middle" font-size="12" font-weight="450" fill="#5C6B7A">example tests: -95%</text><line x1="464" y1="232" x2="496" y2="232" stroke="#1B2838" stroke-width="2"/><polygon points="496,232 486.78939005997114,235.8941834230865 486.78939005997114,228.1058165769135" fill="#1B2838"/><rect x="496" y="168" width="200" height="128" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="596" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">cluster</text><text x="596" y="242" text-anchor="middle" font-size="12" font-weight="450" fill="#5C6B7A">group by behavior</text><line x1="696" y1="232" x2="728" y2="232" stroke="#1B2838" stroke-width="2"/><polygon points="728,232 718.7893900599712,235.8941834230865 718.7893900599712,228.1058165769135" fill="#1B2838"/><rect x="728" y="168" width="200" height="128" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="828" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2838">submit</text><text x="828" y="242" text-anchor="middle" font-size="12" font-weight="450" fill="#5C6B7A">1 per cluster, max 10</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Filtering is cheap. Clustering is the diversity heuristic. Source: lecture-reported.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: lecture-reported</text></svg>