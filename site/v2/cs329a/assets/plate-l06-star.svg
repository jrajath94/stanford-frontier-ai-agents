<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="680" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">Teach yourself from your own wins</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">Generate rationale. Keep it if the answer is right. Rationalize with the answer as hint if wrong.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="1040" height="300" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="80" y="190" width="220" height="120" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="190.0" y="229.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Generate</text>
<text x="190.0" y="253.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">rationale + answer</text>
<text x="190.0" y="275.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">per problem</text>
<line x1="312" y1="250" x2="372" y2="250" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="315.0" y="224.0" width="54.0" height="20" rx="4" fill="#F7F4EE"/>
<text x="342.0" y="239.0" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">check</text>
<rect x="384" y="160" width="280" height="80" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/>
<text x="524.0" y="190.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">answer right: keep it</text>
<text x="524.0" y="214.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">training data</text>
<rect x="384" y="260" width="280" height="80" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="524.0" y="290.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">answer wrong: rationalize</text>
<text x="524.0" y="314.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">hint with the answer</text>
<line x1="676" y1="200" x2="736" y2="200" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="682.8" y="174.0" width="46.4" height="20" rx="4" fill="#F7F4EE"/>
<text x="706.0" y="189.0" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">keep</text>
<line x1="676" y1="300" x2="736" y2="300" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="656.2" y="274.0" width="99.6" height="20" rx="4" fill="#F7F4EE"/>
<text x="706.0" y="289.0" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">keep hinted</text>
<rect x="748" y="190" width="252" height="120" rx="12" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="874.0" y="229.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Fine-tune, repeat</text>
<text x="874.0" y="253.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">lift by your own</text>
<text x="874.0" y="275.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">correct answers</text>
<text x="560" y="400" font-size="13" fill="#5C6B7A" text-anchor="middle">GPT-J 6B on GSM8K and CommonsenseQA; uses 70 to 87 percent of the data across rounds</text>
<rect x="40" y="448" width="1040" height="90" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="560" y="490" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">GSM8K accuracy rose to 51.7 percent.</text>
<text x="560" y="516" font-size="13" fill="#5C6B7A" text-anchor="middle">honest limit: it only learns from successes, never from the shape of failures</text>
<text x="40" y="624" font-size="15" font-weight="450" fill="#1B2838">The simplest train-time loop: bootstrap on the problems you can already solve, plus hints.</text>
<text x="40" y="652" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper, STaR. Shell 3.</text>
</svg>