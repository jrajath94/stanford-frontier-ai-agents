<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Every search spends from a budget</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Searches cost latency. Chunks cost context. Stop when chunks stop helping.</text><rect x="32" y="96" width="440" height="240" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">costs</text><text x="56" y="168" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">1 search = latency + 1 tool call</text><text x="56" y="204" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">1 chunk = context the model must reason over</text><text x="56" y="244" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">20 searches = 20 calls + long prompt</text><rect x="488" y="96" width="440" height="240" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="504" y="122" font-size="14" font-weight="600" fill="#5C6B7A">budget rule</text><text x="512" y="168" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">search where the gap is load-bearing</text><text x="512" y="204" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">extract tightly</text><text x="512" y="244" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">stop when answers stop changing</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. The binding constraint is what the model reasons over well. Source: original.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original</text></svg>