<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">One guessed fact infects the chain</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">A wrong guess at step 3 makes steps 4-7 wrong. No later step can recover.</text><rect x="40" y="168" width="160" height="128" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="120" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">step 1-2</text><text x="120" y="242" text-anchor="middle" font-size="12" font-weight="450" fill="#5C6B7A">facts</text><line x1="200" y1="232" x2="224" y2="232" stroke="#C46B2C" stroke-width="2"/><polygon points="224,232 214.78939005997114,235.8941834230865 214.78939005997114,228.1058165769135" fill="#C46B2C"/><rect x="224" y="168" width="160" height="128" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="304" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">step 3</text><text x="304" y="242" text-anchor="middle" font-size="12" font-weight="450" fill="#5C6B7A">GUESS</text><line x1="384" y1="232" x2="408" y2="232" stroke="#C46B2C" stroke-width="2"/><polygon points="408,232 398.78939005997114,235.8941834230865 398.78939005997114,228.1058165769135" fill="#C46B2C"/><rect x="408" y="168" width="160" height="128" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="488" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">step 4</text><text x="488" y="242" text-anchor="middle" font-size="12" font-weight="450" fill="#5C6B7A">built on guess</text><line x1="568" y1="232" x2="592" y2="232" stroke="#C46B2C" stroke-width="2"/><polygon points="592,232 582.7893900599712,235.8941834230865 582.7893900599712,228.1058165769135" fill="#C46B2C"/><rect x="592" y="168" width="160" height="128" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="672" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">step 5</text><text x="672" y="242" text-anchor="middle" font-size="12" font-weight="450" fill="#5C6B7A">built on guess</text><line x1="752" y1="232" x2="776" y2="232" stroke="#C46B2C" stroke-width="2"/><polygon points="776,232 766.7893900599712,235.8941834230865 766.7893900599712,228.1058165769135" fill="#C46B2C"/><rect x="776" y="168" width="160" height="128" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="12"/><text x="856" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2838">step 6-7</text><text x="856" y="242" text-anchor="middle" font-size="12" font-weight="450" fill="#5C6B7A">wrong answer</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. Fill the gap when met, before reasoning continues. Source: original toy.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original toy</text></svg>