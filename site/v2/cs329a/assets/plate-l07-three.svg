<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Dumping documents is not reading them</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Guess: 14, wrong. Dump 10 docs: still wrong. Search, read, extract: 10, right.</text><text x="48" y="152" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">pure reasoning</text><text x="300" y="152" text-anchor="start" font-size="13" font-weight="450" fill="#5C6B7A">gap -&gt; guess -&gt; cascade</text><rect x="680" y="132" width="147.76" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="753.88" y="153" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">14 carbons: wrong</text><text x="48" y="216" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">single-shot RAG</text><text x="300" y="216" text-anchor="start" font-size="13" font-weight="450" fill="#5C6B7A">10 docs dumped -&gt; noise</text><rect x="680" y="196" width="104.08" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="732.04" y="217" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">still wrong</text><text x="48" y="280" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">agentic search</text><text x="300" y="280" text-anchor="start" font-size="13" font-weight="450" fill="#5C6B7A">gap -&gt; search -&gt; read -&gt; extract</text><rect x="680" y="260" width="147.76" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="753.88" y="281" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">10 carbons: right</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. The difference is not the search. It is the reading. Source: original toy.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original toy</text></svg>