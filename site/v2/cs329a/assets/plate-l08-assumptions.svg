<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">STaR stands on three assumptions</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Break any one and the loop stalls or teaches bad reasoning.</text><text x="48" y="156" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">1. right answer =&gt; good rationale</text><rect x="520" y="136" width="235.12" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="637.56" y="157" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">lucky guesses pass the filter</text><text x="48" y="220" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">2. the model can rationalize</text><rect x="520" y="200" width="278.8" height="32" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="659.4" y="221" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">too-hard problems get confabulation</text><text x="48" y="284" text-anchor="start" font-size="15" font-weight="600" fill="#1B2838">3. the base can bootstrap</text><rect x="520" y="264" width="227.84" height="32" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="633.92" y="285" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">round 1 must solve something</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. The first assumption is the live wire. Source: lecture-reported.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: lecture-reported</text></svg>