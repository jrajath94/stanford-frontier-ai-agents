<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="640" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">Debate keeps the society diverse</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">Generators propose. Critics attack. Debate converges. Majority-vote SFT trains all.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="1040" height="300" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="80" y="190" width="220" height="120" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="190.0" y="229.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Generators</text>
<text x="190.0" y="253.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">several agents</text>
<text x="190.0" y="275.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">propose answers</text>
<line x1="312" y1="250" x2="372" y2="250" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="307.4" y="224.0" width="69.19999999999999" height="20" rx="4" fill="#F7F4EE"/>
<text x="342.0" y="239.0" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">propose</text>
<rect x="384" y="190" width="220" height="120" rx="12" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="494.0" y="229.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Critics</text>
<text x="494.0" y="253.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">attack them</text>
<text x="494.0" y="275.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">trained adversaries</text>
<line x1="616" y1="250" x2="676" y2="250" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="615.2" y="224.0" width="61.599999999999994" height="20" rx="4" fill="#F7F4EE"/>
<text x="646.0" y="239.0" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">debate</text>
<rect x="688" y="190" width="200" height="120" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/>
<text x="788.0" y="229.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Converge</text>
<text x="788.0" y="253.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">reasoning chains</text>
<text x="788.0" y="275.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">survive attack</text>
<line x1="900" y1="250" x2="960" y2="250" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="895.4" y="224.0" width="69.19999999999999" height="20" rx="4" fill="#F7F4EE"/>
<text x="930.0" y="239.0" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">collect</text>
<text x="560" y="380" font-size="14" fill="#5C6B7A" text-anchor="middle">majority-vote SFT fine-tunes every agent on the converged chains</text>
<text x="560" y="406" font-size="14" font-weight="600" fill="#1F7A72" text-anchor="middle">diversity survives: critics are rewarded for finding what others missed</text>
<text x="40" y="584" font-size="15" font-weight="450" fill="#1B2838">No single model judges itself. The verifier is a society of trained adversaries.</text>
<text x="40" y="612" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper, Multiagent Finetuning. Shell 3.</text>
</svg>