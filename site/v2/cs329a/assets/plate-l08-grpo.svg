<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">GRPO: compare attempts in groups</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">Sample a group per prompt. Normalize advantages inside the group. Push toward the better ones.</text><rect x="32" y="96" width="560" height="240" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">one prompt, 4 sampled attempts</text><rect x="56" y="168" width="120" height="96" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="116" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2838">attempt A</text><text x="116" y="234" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">wrong</text><rect x="188" y="168" width="120" height="96" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="248" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2838">attempt B</text><text x="248" y="234" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">right</text><rect x="320" y="168" width="120" height="96" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="380" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2838">attempt C</text><text x="380" y="234" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">right</text><rect x="452" y="168" width="120" height="96" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="8"/><text x="512" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2838">attempt D</text><text x="512" y="234" text-anchor="middle" font-size="13" font-weight="450" fill="#5C6B7A">wrong</text><rect x="628" y="96" width="300" height="240" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="644" y="122" font-size="14" font-weight="600" fill="#5C6B7A">update</text><text x="652" y="192" text-anchor="start" font-size="15" font-weight="450" fill="#1B2838">advantage =</text><text x="652" y="220" text-anchor="start" font-size="15" font-weight="600" fill="#1E4D8C">score - group mean</text><text x="652" y="260" text-anchor="start" font-size="14" font-weight="450" fill="#5C6B7A">push toward B, C</text><line x1="592" y1="216" x2="628" y2="216" stroke="#1B2838" stroke-width="2"/><polygon points="628,216 618.7893900599712,219.8941834230865 618.7893900599712,212.1058165769135" fill="#1B2838"/><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Improves majority@K, not pass@K: more consistent, not smarter. Source: lecture-reported.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: lecture-reported</text></svg>