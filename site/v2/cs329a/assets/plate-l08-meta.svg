<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="660" fill="#F7F4EE"/>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1B2838">The regress stops at formal proof</text>
<text x="40" y="80" font-size="16" fill="#5C6B7A">Generator writes proofs. Verifier checks. Meta-verifier checks the verifier.</text>
<line x1="40" y1="96" x2="1080" y2="96" stroke="#D9D3C7" stroke-width="1.5"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A72"/></marker></defs>
<rect x="40" y="120" width="1040" height="300" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<rect x="80" y="190" width="240" height="120" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="200.0" y="240.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Generator</text>
<text x="200.0" y="264.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">writes proofs</text>
<line x1="332" y1="250" x2="392" y2="250" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="335.0" y="224.0" width="54.0" height="20" rx="4" fill="#F7F4EE"/>
<text x="362.0" y="239.0" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">check</text>
<rect x="404" y="190" width="240" height="120" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="524.0" y="240.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Verifier</text>
<text x="524.0" y="264.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">judges proofs</text>
<line x1="656" y1="250" x2="716" y2="250" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<rect x="659.0" y="224.0" width="54.0" height="20" rx="4" fill="#F7F4EE"/>
<text x="686.0" y="239.0" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">check</text>
<rect x="728" y="190" width="240" height="120" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2.5"/>
<text x="848.0" y="240.0" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Meta-verifier</text>
<text x="848.0" y="264.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">judges the judge</text>
<path d="M 848 322 C 848 380, 200 380, 200 322" fill="none" stroke="#1F7A72" stroke-width="2" marker-end="url(#arr)"/>
<text x="524" y="404" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">each turn, a sharper verifier faces the generator</text>
<rect x="40" y="448" width="1040" height="80" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="560" y="498" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">8 iterations, best-of-32: about 42 percent on the IMO 2024 shortlist.</text>
<text x="40" y="604" font-size="15" font-weight="450" fill="#1B2838">Ground the top of the stack in something the model cannot game: formal proof.</text>
<text x="40" y="632" font-size="13" fill="#5C6B7A">Project: Stanford Frontier AI. Source: lecture and paper, DeepSeekMath-V2. Shell 3.</text>
</svg>