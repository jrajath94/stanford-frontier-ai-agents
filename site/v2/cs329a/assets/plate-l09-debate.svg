<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Debate maintains what fine-tuning collapses</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">One agent converges on favorites. Generators plus a critic keep disagreeing productively.</text><rect x="32" y="96" width="420" height="240" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">single-agent fine-tuning</text><text x="56" y="184" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">round 1: diverse chains</text><text x="56" y="216" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">round 3: favorite patterns</text><text x="56" y="248" text-anchor="start" font-size="14" font-weight="450" fill="#C46B2C">round 5: accuracy collapses</text><rect x="508" y="96" width="420" height="240" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="524" y="122" font-size="14" font-weight="600" fill="#5C6B7A">multi-agent debate</text><text x="532" y="184" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">generators answer in parallel</text><text x="532" y="216" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">critic critiques the set</text><text x="532" y="248" text-anchor="start" font-size="14" font-weight="450" fill="#1F7A72">revise, vote; chains stay diverse</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Diversity is not a starting condition. The debate structure maintains it. Source: lecture-reported.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: lecture-reported</text></svg>