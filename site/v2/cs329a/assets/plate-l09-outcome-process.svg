<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Outcome checks miss broken reasoning</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">The final line matches. Step 4 does not follow from step 3. The outcome verifier approves.</text><rect x="32" y="96" width="420" height="240" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">outcome reward</text><text x="56" y="168" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">proof steps 1-6</text><text x="56" y="200" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">final line: matches</text><rect x="56" y="232" width="82.24000000000001" height="32" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="97.12" y="253" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">APPROVED</text><text x="56" y="280" text-anchor="start" font-size="14" font-weight="450" fill="#C46B2C">gap at step 4 unseen</text><rect x="508" y="96" width="420" height="240" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="524" y="122" font-size="14" font-weight="600" fill="#5C6B7A">process reward</text><text x="532" y="168" text-anchor="start" font-size="14" font-weight="450" fill="#1B2838">step 1: ok ... step 3: ok</text><text x="532" y="200" text-anchor="start" font-size="14" font-weight="450" fill="#C46B2C">step 4: does not follow</text><rect x="532" y="232" width="147.76" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="605.88" y="253" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">FLAGGED at step 4</text><text x="532" y="280" text-anchor="start" font-size="14" font-weight="450" fill="#1F7A72">scores the steps, not the ending</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 3. Saturating benchmarks on outcome rewards does not mean the reasoning got better. Source: original toy.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original toy</text></svg>