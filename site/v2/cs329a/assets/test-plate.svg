<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="960" height="480" fill="#F7F4EE" rx="0"/><text x="32" y="44" font-size="30" font-weight="600" fill="#1B2838">Coverage climbs fast, then flattens</text><text x="32" y="72" font-size="16" font-weight="450" fill="#5C6B7A">p = 0.05 per try. Coverage = 1 - (1-p)^k.</text><rect x="32" y="96" width="280" height="200" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="48" y="122" font-size="14" font-weight="600" fill="#5C6B7A">k = 10</text><rect x="56" y="160" width="111.36" height="32" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="111.68" y="181" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">40% coverage</text><rect x="400" y="96" width="280" height="200" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5" rx="12"/><text x="416" y="122" font-size="14" font-weight="600" fill="#5C6B7A">k = 100</text><rect x="424" y="160" width="125.92" height="32" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5" rx="999"/><text x="486.96" y="181" text-anchor="middle" font-size="14" font-weight="500" fill="#1B2838">99.4% coverage</text><line x1="320" y1="196" x2="392" y2="196" stroke="#1B2838" stroke-width="2"/><polygon points="392,196 382.78939005997114,199.8941834230865 382.78939005997114,192.1058165769135" fill="#1B2838"/><rect x="310.82" y="172.0" width="90.36" height="24" fill="#F7F4EE"/><text x="356.0" y="190.0" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2838">10x samples</text><text x="32" y="456" font-size="15" font-weight="500" fill="#1B2838">Shell 2. Ten tries lift 5 percent to 40 percent; 100 tries reach 99.4 percent.</text><text x="928" y="456" text-anchor="end" font-size="12" font-weight="450" fill="#5C6B7A">source: original toy</text></svg>