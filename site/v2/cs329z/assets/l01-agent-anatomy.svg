<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="620" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Anatomy of an agent</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Five named blocks. Two named edges to the world.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="380" y="130" width="360" height="110" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="2"/><text x="560" y="168" font-size="17" font-weight="600" fill="#1B2838" text-anchor="middle">LLM core</text><text x="560" y="196" font-size="13" fill="#5C6B7A" text-anchor="middle">the model that reasons</text><text x="560" y="216" font-size="13" fill="#5C6B7A" text-anchor="middle">and decides</text><rect x="60" y="290" width="300" height="100" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="210" y="328" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Planning and reasoning</text><text x="210" y="354" font-size="13" fill="#5C6B7A" text-anchor="middle">internal actions, Thought</text><rect x="410" y="290" width="300" height="100" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="328" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Memory</text><text x="560" y="354" font-size="13" fill="#5C6B7A" text-anchor="middle">traces so far, episodic,</text><text x="560" y="372" font-size="13" fill="#5C6B7A" text-anchor="middle">semantic, procedural</text><rect x="760" y="290" width="300" height="100" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="910" y="328" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Tools</text><text x="910" y="354" font-size="13" fill="#5C6B7A" text-anchor="middle">search, code, calculator,</text><text x="910" y="372" font-size="13" fill="#5C6B7A" text-anchor="middle">retrieval, file ops</text><g stroke="#1B2838" stroke-width="1.5" fill="none"><line x1="210" y1="290" x2="480" y2="240"/><line x1="560" y1="290" x2="560" y2="240"/><line x1="910" y1="290" x2="640" y2="240"/></g><rect x="380" y="430" width="360" height="100" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="468" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Environment</text><text x="560" y="494" font-size="13" fill="#5C6B7A" text-anchor="middle">browser, OS, databases, games</text><g stroke="#1B2838" stroke-width="2" fill="none"><line x1="480" y1="300" x2="480" y2="430"/><polygon points="474,420 480,430 486,420" fill="#1B2838" stroke="none"/><line x1="640" y1="430" x2="640" y2="300"/><polygon points="634,310 640,300 646,310" fill="#1B2838" stroke="none"/></g><text x="455" y="380" font-size="13" fill="#5C6B7A" text-anchor="end">act</text><text x="665" y="380" font-size="13" fill="#5C6B7A" text-anchor="start">observe</text><text x="40" y="572" font-size="15" font-weight="450" fill="#1B2838">Agent actions are three kinds: tool call, interaction, response to the user.</text><text x="40" y="600" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 3: one rule per edge; the loop plate reuses these blocks.</text></svg>