<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The agent loop</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Every agent runs the same five steps, in order, until the check passes.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><g><rect x="40" y="160" width="180" height="120" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="130" y="205" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Perceive</text><text x="130" y="230" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">read the task and</text><text x="130" y="250" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">the world state</text></g><g><rect x="252" y="160" width="180" height="120" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="342" y="205" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Plan</text><text x="342" y="230" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">reason: choose the</text><text x="342" y="250" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">next step</text></g><g><rect x="464" y="160" width="180" height="120" rx="12" fill="#FFFDF8" stroke="#1F7A72" stroke-width="2.5"/><text x="554" y="205" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Act</text><text x="554" y="230" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">tool call, message,</text><text x="554" y="250" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">or final answer</text></g><g><rect x="676" y="160" width="180" height="120" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="766" y="205" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Observe</text><text x="766" y="230" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">read what the world</text><text x="766" y="250" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">returned</text></g><g><rect x="888" y="160" width="180" height="120" rx="12" fill="#D9E8D3" stroke="#D9D3C7" stroke-width="1.5"/><text x="978" y="205" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Check</text><text x="978" y="230" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">is the goal met?</text><text x="978" y="250" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">pass or retry</text></g><g stroke="#1B2838" stroke-width="1.5" fill="none"><line x1="220" y1="220" x2="252" y2="220"/><polygon points="252,214 262,220 252,226" fill="#1B2838" stroke="none"/><line x1="432" y1="220" x2="464" y2="220"/><polygon points="464,214 474,220 464,226" fill="#1B2838" stroke="none"/><line x1="644" y1="220" x2="676" y2="220"/><polygon points="676,214 686,220 676,226" fill="#1B2838" stroke="none"/><line x1="856" y1="220" x2="888" y2="220"/><polygon points="888,214 898,220 888,226" fill="#1B2838" stroke="none"/></g><text x="236" y="212" font-size="13" fill="#5C6B7A" text-anchor="middle">decide</text><text x="448" y="212" font-size="13" fill="#5C6B7A" text-anchor="middle">execute</text><text x="660" y="212" font-size="13" fill="#5C6B7A" text-anchor="middle">return</text><text x="872" y="212" font-size="13" fill="#5C6B7A" text-anchor="middle">test</text><path d="M 978 280 L 978 380 L 130 380 L 130 280" fill="none" stroke="#C46B2C" stroke-width="1.5" stroke-dasharray="6 4"/><polygon points="124,290 130,280 136,290" fill="#C46B2C" stroke="none"/><text x="554" y="372" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">check fails: loop back to perceive with the new observation</text><line x1="1068" y1="280" x2="1068" y2="380" stroke="#1F7A72" stroke-width="1.5"/><line x1="1068" y1="380" x2="1120" y2="380" stroke="#1F7A72" stroke-width="1.5" fill="none"/><polygon points="1068,274 1074,284 1062,284" fill="#1F7A72" stroke="none"/><text x="1094" y="350" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle" transform="rotate(90 1094 350)"></text><rect x="880" y="400" width="196" height="56" rx="8" fill="#1F7A72" stroke="#1F7A72" stroke-width="1.5"/><text x="978" y="434" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">check passes: answer</text><text x="40" y="500" font-size="15" font-weight="450" fill="#1B2838">The loop is the unit of agent engineering. Reliability, memory, tool design, and evaluation all attach to one of these five steps.</text><text x="40" y="532" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original. Shell 5: this symbol is reused by CS329A for every agent lesson.</text></svg>