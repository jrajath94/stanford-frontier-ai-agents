<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="480" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Multi-agent debate</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Several agents argue. A judge picks the winner. Answers improve.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
