<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="640" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Guardrails: the check runs beside the agent</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Input guardrail checks the request. Output guardrail checks the answer. Neither sits inside the loop.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="262" width="110" height="56" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="95" y="296" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Request</text><line x1="150" y1="290" x2="196" y2="290" stroke="#1B2838" stroke-width="1.5"/><polygon points="196,290 184.0,296.0 184.0,284.0" fill="#1B2838" stroke="none"/><text x="173" y="282" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">checks</text><rect x="196" y="180" width="210" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="301" y="210" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Input guardrail</text><text x="301" y="238" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">checks the request</text><rect x="216" y="254" width="170" height="40" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="301" y="280" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">billing question: pass</text><rect x="216" y="302" width="170" height="40" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="301" y="328" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">medical advice: block</text><text x="301" y="364" font-size="12" font-weight="450" fill="#5C6B7A" text-anchor="middle">never reaches the loop</text><line x1="301" y1="380" x2="301" y2="436" stroke="#C46B2C" stroke-width="1.5" stroke-dasharray="6 4"/><polygon points="301,436 295.0,424.0 307.0,424.0" fill="#C46B2C" stroke="none"/><rect x="211" y="436" width="180" height="44" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="301" y="464" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">blocked: hard stop</text><rect x="452" y="180" width="320" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="612" y="210" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Agent loop</text><rect x="468" y="226" width="288" height="26" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="612" y="244" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">Perceive</text><rect x="468" y="257" width="288" height="26" rx="8" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="612" y="275" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">Plan</text><rect x="468" y="288" width="288" height="26" rx="8" fill="#FFFDF8" stroke="#1F7A72" stroke-width="2.5"/><text x="612" y="306" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">Act</text><rect x="468" y="319" width="288" height="26" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="612" y="337" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">Observe</text><rect x="468" y="350" width="288" height="26" rx="8" fill="#D9E8D3" stroke="#D9D3C7" stroke-width="1.5"/><text x="612" y="368" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">Check</text><line x1="406" y1="290" x2="452" y2="290" stroke="#1B2838" stroke-width="1.5"/><polygon points="452,290 440.0,296.0 440.0,284.0" fill="#1B2838" stroke="none"/><text x="429.0" y="282" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">pass</text><line x1="772" y1="290" x2="822" y2="290" stroke="#1B2838" stroke-width="1.5"/><polygon points="822,290 810.0,296.0 810.0,284.0" fill="#1B2838" stroke="none"/><text x="797" y="282" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">answer</text><rect x="822" y="180" width="210" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="927" y="210" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Output guardrail</text><text x="927" y="238" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">checks the answer</text><rect x="842" y="254" width="170" height="40" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="927" y="272" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">no account numbers</text><text x="927" y="290" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">no SSN \d{3}-\d{2}-\d{4}</text><rect x="842" y="302" width="170" height="40" rx="8" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="927" y="328" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">big refund: human approves</text><line x1="1032" y1="290" x2="1080" y2="290" stroke="#1F7A72" stroke-width="1.5"/><polygon points="1080,290 1068.0,296.0 1068.0,284.0" fill="#1F7A72" stroke="none"/><text x="1076" y="314" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="end">pass to user</text><line x1="927" y1="380" x2="927" y2="436" stroke="#C46B2C" stroke-width="1.5" stroke-dasharray="6 4"/><polygon points="927,436 921.0,424.0 933.0,424.0" fill="#C46B2C" stroke="none"/><rect x="837" y="436" width="180" height="44" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="927" y="464" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">blocked: never sent</text><text x="40" y="544" font-size="15" font-weight="600" fill="#1B2838">A guardrail failure is a hard stop, not a model opinion.</text><text x="40" y="568" font-size="14" fill="#5C6B7A">Keep guardrails outside the model's reach: code the agent cannot edit.</text><text x="40" y="616" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text></svg>