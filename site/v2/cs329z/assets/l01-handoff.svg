<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="600" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Handoff: delegation as a tool call</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">The triage agent does not do the work. It hands the conversation to a specialist.</text>
<line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="576" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
<g><rect x="40" y="200" width="240" height="120" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="160" y="234" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Triage agent</text>
<text x="160" y="260" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">reads the request</text>
<text x="160" y="280" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">picks a specialist</text>
</g>
<g><rect x="360" y="140" width="240" height="110" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="480" y="174" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Billing agent</text>
<text x="480" y="200" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">refunds, invoices</text>
</g>
<g><rect x="360" y="270" width="240" height="110" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="480" y="304" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Search agent</text>
<text x="480" y="330" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">flights, hotels</text>
</g>
<g><rect x="360" y="400" width="240" height="110" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="480" y="434" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Escalation agent</text>
<text x="480" y="460" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">human review</text>
</g>
<line x1="280" y1="240" x2="360" y2="195" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="360" y1="195" x2="348" y2="197" stroke="#1B2838" stroke-width="1.5"/>
<line x1="360" y1="195" x2="352" y2="204" stroke="#1B2838" stroke-width="1.5"/>
<text x="320" y="210" font-size="13" fill="#1B2838" text-anchor="middle">handoff(billing)</text>
<line x1="280" y1="260" x2="360" y2="325" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="360" y1="325" x2="354" y2="315" stroke="#1B2838" stroke-width="1.5"/>
<line x1="360" y1="325" x2="349" y2="321" stroke="#1B2838" stroke-width="1.5"/>
<text x="320" y="284" font-size="13" fill="#1B2838" text-anchor="middle">handoff(search)</text>
<line x1="280" y1="280" x2="360" y2="455" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="360" y1="455" x2="359" y2="443" stroke="#1B2838" stroke-width="1.5"/>
<line x1="360" y1="455" x2="352" y2="446" stroke="#1B2838" stroke-width="1.5"/>
<text x="320" y="360" font-size="13" fill="#1B2838" text-anchor="middle">handoff(escalation)</text>
<g><rect x="680" y="200" width="360" height="160" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="860" y="234" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">The specialist continues</text>
<text x="860" y="260" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">same conversation history</text>
<text x="860" y="280" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">its own instructions + tools</text>
<text x="860" y="300" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">Runner switches the active agent</text>
</g>
<line x1="600" y1="260" x2="680" y2="260" stroke="#1F7A72" stroke-width="1.5" fill="none"/>
<line x1="680" y1="260" x2="669" y2="256" stroke="#1F7A72" stroke-width="1.5"/>
<line x1="680" y1="260" x2="669" y2="264" stroke="#1F7A72" stroke-width="1.5"/>
<text x="640" y="252" font-size="13" fill="#1F7A72" text-anchor="middle">transfer</text>
<line x1="600" y1="300" x2="680" y2="300" stroke="#1F7A72" stroke-width="1.5" fill="none"/>
<line x1="680" y1="300" x2="669" y2="296" stroke="#1F7A72" stroke-width="1.5"/>
<line x1="680" y1="300" x2="669" y2="304" stroke="#1F7A72" stroke-width="1.5"/>
<text x="640" y="292" font-size="13" fill="#1F7A72" text-anchor="middle">transfer</text>
<line x1="600" y1="420" x2="680" y2="340" stroke="#1F7A72" stroke-width="1.5" fill="none"/>
<line x1="680" y1="340" x2="669" y2="345" stroke="#1F7A72" stroke-width="1.5"/>
<line x1="680" y1="340" x2="675" y2="351" stroke="#1F7A72" stroke-width="1.5"/>
<text x="640" y="372" font-size="13" fill="#1F7A72" text-anchor="middle">transfer</text>
<text x="40" y="480" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">Handoff is delegation implemented as a tool call.</text>
<text x="40" y="504" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">OpenAI Agents SDK pattern: triage in front, specialists behind. Guardrails check each handoff.</text>
</svg>