<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="520" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">ReAct: reasoning grounds acting</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Act alone guesses. Reason alone hallucinates. ReAct alternates.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="130" width="320" height="290" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="200" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Reason only</text><text x="200" y="196" font-size="13" fill="#5C6B7A" text-anchor="middle">chain of thought,</text><text x="200" y="216" font-size="13" fill="#5C6B7A" text-anchor="middle">no tools</text><rect x="70" y="250" width="260" height="60" rx="8" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/><text x="200" y="276" font-size="13" fill="#1B2838" text-anchor="middle">Thought: Apple TV links to</text><text x="200" y="296" font-size="13" fill="#1B2838" text-anchor="middle">iPhone, iPad, iPod Touch</text><text x="200" y="352" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">wrong: hallucinated links</text><rect x="400" y="130" width="320" height="290" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Act only</text><text x="560" y="196" font-size="13" fill="#5C6B7A" text-anchor="middle">tools, no reasoning</text><rect x="430" y="250" width="260" height="60" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="276" font-size="13" fill="#1B2838" text-anchor="middle">Search[Apple Remote]</text><text x="560" y="296" font-size="13" fill="#1B2838" text-anchor="middle">Obs: ... (long text)</text><text x="560" y="352" font-size="14" font-weight="500" fill="#5C6B7A" text-anchor="middle">works, but no plan</text><rect x="760" y="130" width="320" height="290" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="920" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">ReAct</text><text x="920" y="196" font-size="13" fill="#5C6B7A" text-anchor="middle">thought, act, observe,</text><text x="920" y="216" font-size="13" fill="#5C6B7A" text-anchor="middle">repeat</text><rect x="790" y="244" width="260" height="40" rx="999" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="920" y="270" font-size="13" fill="#1B2838" text-anchor="middle">Thought 1: search Apple Remote</text><rect x="790" y="292" width="260" height="40" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="920" y="318" font-size="13" fill="#1B2838" text-anchor="middle">Act 1: Search[Apple Remote]</text><rect x="790" y="340" width="260" height="40" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="920" y="366" font-size="13" fill="#1B2838" text-anchor="middle">Obs 1: Front Row program</text><text x="920" y="404" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">answer: keyboard function keys</text><text x="40" y="462" font-size="15" font-weight="450" fill="#1B2838">Yao et al. (2022): ReAct beats act-only consistently and cuts the hallucination that chain-of-thought suffers.</text><text x="40" y="494" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper. Shell 4: the new symbol is the interleaved Thought-Act-Obs trace.</text></svg>