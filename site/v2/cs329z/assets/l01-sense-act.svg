<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="440" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">What counts as an agent</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Russell and Norvig, 1995: anything that perceives through sensors and acts through actuators.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="160" width="240" height="140" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="180" y="205" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Sensors</text><text x="180" y="232" font-size="13" fill="#5C6B7A" text-anchor="middle">perceive</text><text x="180" y="254" font-size="13" fill="#5C6B7A" text-anchor="middle">web page, file, log,</text><text x="180" y="274" font-size="13" fill="#5C6B7A" text-anchor="middle">tool result</text><rect x="440" y="160" width="240" height="140" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="205" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Agent</text><text x="560" y="232" font-size="13" fill="#5C6B7A" text-anchor="middle">decide</text><text x="560" y="254" font-size="13" fill="#5C6B7A" text-anchor="middle">LLM + loop +</text><text x="560" y="274" font-size="13" fill="#5C6B7A" text-anchor="middle">memory</text><rect x="820" y="160" width="240" height="140" rx="12" fill="#D9E8D3" stroke="#D9D3C7" stroke-width="1.5"/><text x="940" y="205" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Actuators</text><text x="940" y="232" font-size="13" fill="#5C6B7A" text-anchor="middle">act</text><text x="940" y="254" font-size="13" fill="#5C6B7A" text-anchor="middle">API call, code run,</text><text x="940" y="274" font-size="13" fill="#5C6B7A" text-anchor="middle">message sent</text><g stroke="#1B2838" stroke-width="1.5" fill="none"><line x1="300" y1="230" x2="440" y2="230"/><polygon points="440,224 450,230 440,236" fill="#1B2838" stroke="none"/><line x1="680" y1="230" x2="820" y2="230"/><polygon points="820,224 830,230 820,236" fill="#1B2838" stroke="none"/></g><text x="370" y="222" font-size="13" fill="#5C6B7A" text-anchor="middle">observe</text><text x="750" y="222" font-size="13" fill="#5C6B7A" text-anchor="middle">execute</text><text x="40" y="360" font-size="15" font-weight="450" fill="#1B2838">Wooldridge and Jennings (1995) add four tests: autonomy, social ability, reactivity, proactivity.</text><text x="40" y="392" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 2: the definition as three blocks with two named edges.</text></svg>