<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="500" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The capability-reliability gap</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Agents can do the task. They cannot do it the same way twice.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><line x1="120" y1="150" x2="120" y2="380" stroke="#1B2838" stroke-width="1.5"/><line x1="120" y1="380" x2="1020" y2="380" stroke="#1B2838" stroke-width="1.5"/><path d="M 160 340 L 940 160" stroke="#1F7A72" stroke-width="3" fill="none"/><path d="M 160 350 L 940 330" stroke="#C46B2C" stroke-width="3" fill="none" stroke-dasharray="8 5"/><text x="700" y="200" font-size="14" font-weight="600" fill="#1F7A72">capability</text><text x="700" y="330" font-size="14" font-weight="600" fill="#C46B2C">reliability</text><text x="90" y="395" font-size="12" fill="#5C6B7A">time</text><text x="40" y="395" font-size="12" fill="#5C6B7A">score</text><rect x="120" y="400" width="880" height="1" fill="#F7F4EE"/><text x="570" y="440" font-size="15" font-weight="450" fill="#1B2838" text-anchor="middle">Three reliability questions: consistent across runs? robust to small prompt shifts? legible failure modes?</text><text x="40" y="472" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 3: two curves, one rule: capability climbs, reliability lags.</text></svg>