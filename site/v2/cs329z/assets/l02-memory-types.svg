<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="540" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Three kinds of memory</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Categorized by content, like human long-term memory.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><g><rect x="40" y="140" width="320" height="240" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="200" y="178" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Episodic</text><text x="200" y="204" font-size="13" fill="#5C6B7A" text-anchor="middle">stores experience</text><text x="200" y="240" font-size="13" fill="#1B2838" text-anchor="middle">write: append-only</text><text x="200" y="262" font-size="13" fill="#1B2838" text-anchor="middle">event streams</text><text x="200" y="298" font-size="13" fill="#1B2838" text-anchor="middle">read: heuristic</text><text x="200" y="320" font-size="13" fill="#1B2838" text-anchor="middle">retrieval scores</text><text x="200" y="356" font-size="13" fill="#5C6B7A" text-anchor="middle">Example: generative</text><text x="200" y="376" font-size="13" fill="#5C6B7A" text-anchor="middle">agents (Park 2023)</text></g><g><rect x="400" y="140" width="320" height="240" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="178" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Semantic</text><text x="560" y="204" font-size="13" fill="#5C6B7A" text-anchor="middle">stores knowledge</text><text x="560" y="240" font-size="13" fill="#1B2838" text-anchor="middle">write: LLM reasons</text><text x="560" y="262" font-size="13" fill="#1B2838" text-anchor="middle">over events</text><text x="560" y="298" font-size="13" fill="#1B2838" text-anchor="middle">read: retrieval</text><text x="560" y="356" font-size="13" fill="#5C6B7A" text-anchor="middle">Example: distilled</text><text x="560" y="376" font-size="13" fill="#5C6B7A" text-anchor="middle">fact summaries</text></g><g><rect x="760" y="140" width="320" height="240" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="920" y="178" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Procedural</text><text x="920" y="204" font-size="13" fill="#5C6B7A" text-anchor="middle">stores skills</text><text x="920" y="240" font-size="13" fill="#1B2838" text-anchor="middle">write: code-based</text><text x="920" y="262" font-size="13" fill="#1B2838" text-anchor="middle">skills</text><text x="920" y="298" font-size="13" fill="#1B2838" text-anchor="middle">read: embedding</text><text x="920" y="320" font-size="13" fill="#1B2838" text-anchor="middle">retrieval</text><text x="920" y="356" font-size="13" fill="#5C6B7A" text-anchor="middle">Example: Voyager</text><text x="920" y="376" font-size="13" fill="#5C6B7A" text-anchor="middle">(Wang 2023)</text></g><text x="40" y="430" font-size="15" font-weight="450" fill="#1B2838">Why memory at all: the context window cannot hold every event, and attention over everything is weak.</text><text x="40" y="462" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 4: the new symbols are the three memory kinds.</text></svg>