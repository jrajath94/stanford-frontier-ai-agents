<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="620" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Error handling: append the error, do not raise it</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">A tool that throws kills the loop. A tool that reports lets the model route around the failure.</text>
<line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="596" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
<text x="40" y="132" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">BEFORE: the exception escapes</text>
<g><rect x="40" y="152" width="260" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="170" y="186" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">call read_file</text>
<text x="170" y="212" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">path: missing.txt</text>
</g>
<g><rect x="40" y="264" width="260" height="96" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="170" y="298" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">FileNotFoundError</text>
<text x="170" y="324" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">raised to the harness</text>
</g>
<g><rect x="40" y="376" width="260" height="96" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="170" y="410" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">loop crashes</text>
<text x="170" y="436" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">or the model sees a</text>
<text x="170" y="456" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">stack trace it cannot use</text>
</g>
<line x1="170" y1="248" x2="170" y2="264" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="170" y1="264" x2="174" y2="253" stroke="#1B2838" stroke-width="1.5"/>
<line x1="170" y1="264" x2="166" y2="253" stroke="#1B2838" stroke-width="1.5"/>
<line x1="170" y1="360" x2="170" y2="376" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="170" y1="376" x2="174" y2="365" stroke="#1B2838" stroke-width="1.5"/>
<line x1="170" y1="376" x2="166" y2="365" stroke="#1B2838" stroke-width="1.5"/>
<line x1="360" y1="260" x2="440" y2="260" stroke="#1E4D8C" stroke-width="1.5" fill="none"/>
<line x1="440" y1="260" x2="429" y2="256" stroke="#1E4D8C" stroke-width="1.5"/>
<line x1="440" y1="260" x2="429" y2="264" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="400" y="252" font-size="13" fill="#1E4D8C" text-anchor="middle">append as a result</text>
<text x="500" y="132" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">AFTER: the error is an observation</text>
<g><rect x="500" y="152" width="280" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="640" y="186" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">call read_file</text>
<text x="640" y="212" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">path: missing.txt</text>
</g>
<g><rect x="500" y="264" width="280" height="96" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="640" y="298" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">tool_result: error</text>
<text x="640" y="324" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">“file not found;</text>
<text x="640" y="344" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">tried /sandbox/missing.txt”</text>
</g>
<g><rect x="500" y="376" width="280" height="96" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="640" y="410" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Thought: try ls first</text>
<text x="640" y="436" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">then retry the read</text>
</g>
<line x1="640" y1="248" x2="640" y2="264" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="640" y1="264" x2="644" y2="253" stroke="#1B2838" stroke-width="1.5"/>
<line x1="640" y1="264" x2="636" y2="253" stroke="#1B2838" stroke-width="1.5"/>
<line x1="640" y1="360" x2="640" y2="376" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="640" y1="376" x2="644" y2="365" stroke="#1B2838" stroke-width="1.5"/>
<line x1="640" y1="376" x2="636" y2="365" stroke="#1B2838" stroke-width="1.5"/>
<g><rect x="840" y="264" width="240" height="208" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="960" y="298" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Retry policy</text>
<text x="960" y="324" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">backoff 1s, 2s, 4s</text>
<text x="960" y="344" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">max 3 tries</text>
<text x="960" y="364" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">then dead-letter</text>
<text x="960" y="384" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">to a human</text>
</g>
<text x="40" y="520" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">Rule: tools return results, even for failures.</text>
<text x="40" y="544" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Bounded retries with backoff; the budget, not hope, decides when to stop.</text>
</svg>