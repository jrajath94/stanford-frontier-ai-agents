<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="640" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Beam search: keep the k best alive</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Beam of 2: 'to be' at 0.048 beats the greedy 'to the'. Each step keeps the k best.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="150" width="290" height="260" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="185" y="180" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Step 1: rank candidates</text><rect x="64" y="200" width="242" height="44" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="185" y="228" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">to: 0.32  (kept)</text><rect x="64" y="254" width="242" height="44" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="185" y="282" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">as: 0.05  (kept)</text><rect x="64" y="308" width="242" height="44" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="185" y="336" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">the: 0.04  (dropped)</text><text x="185" y="388" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">beam = top 2</text><line x1="330" y1="300" x2="430" y2="300" stroke="#1B2838" stroke-width="1.5"/><polygon points="430,300 418.0,306.0 418.0,294.0" fill="#1B2838" stroke="none"/><text x="380" y="258" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">extend each,</text><text x="380" y="276" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">keep top 2</text><rect x="430" y="150" width="650" height="260" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="755" y="180" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Step 2: extend each hypothesis</text><rect x="454" y="200" width="602" height="40" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="755" y="226" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">from "to":  "to be" = 0.32 x 0.15 = 0.048  (kept)</text><rect x="454" y="250" width="602" height="40" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="755" y="276" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">"to begin" = 0.32 x 0.09 = 0.0288  (kept)</text><rect x="454" y="300" width="602" height="40" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="755" y="326" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">from "as":  "as the" = 0.05 x 0.20 = 0.010  (dropped)</text><rect x="454" y="350" width="290" height="44" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="599" y="378" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">beam winner: "to be" 0.048</text><rect x="756" y="350" width="290" height="44" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="901" y="378" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">greedy: "to the"</text><text x="40" y="544" font-size="15" font-weight="600" fill="#1B2838">The beam kept 'as' alive at step 1, then checked 'as the' against 'to begin'.</text><text x="40" y="568" font-size="14" fill="#5C6B7A">Price: k hypotheses, k times the memory and roughly k times the time, per step.</text><text x="40" y="616" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text></svg>