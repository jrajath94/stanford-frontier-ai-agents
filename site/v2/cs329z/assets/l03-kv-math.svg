<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="620" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The KV cache, priced</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">Every token kept in context is memory paid per decode step. Here is the bill.</text>
<line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="596" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
<text x="40" y="132" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">BEFORE: one token&#x27;s cache</text>
<g><rect x="40" y="152" width="220" height="96" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="150" y="186" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">keys + values</text>
<text x="150" y="212" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">2 vectors</text>
<text x="150" y="232" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">4096 dims, fp16</text>
</g>
<text x="340" y="132" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">AFTER: the full cache</text>
<g><rect x="340" y="152" width="200" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="440" y="186" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">x 4096 tokens</text>
<text x="440" y="212" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">the context</text>
</g>
<g><rect x="560" y="152" width="200" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="660" y="186" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">x 32 layers</text>
<text x="660" y="212" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">every layer</text>
</g>
<line x1="260" y1="200" x2="340" y2="200" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="340" y1="200" x2="329" y2="196" stroke="#1B2838" stroke-width="1.5"/>
<line x1="340" y1="200" x2="329" y2="204" stroke="#1B2838" stroke-width="1.5"/>
<text x="300" y="192" font-size="13" fill="#1B2838" text-anchor="middle">x tokens</text>
<line x1="540" y1="200" x2="560" y2="200" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="560" y1="200" x2="549" y2="196" stroke="#1B2838" stroke-width="1.5"/>
<line x1="560" y1="200" x2="549" y2="204" stroke="#1B2838" stroke-width="1.5"/>
<text x="550" y="192" font-size="13" fill="#1B2838" text-anchor="middle">x layers</text>
<g><rect x="800" y="152" width="280" height="96" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="940" y="186" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">2.0 GiB</text>
<text x="940" y="212" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">2 x 32 x 4096 x 4096 x 2 B</text>
<text x="940" y="232" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">= 2,147,483,648 bytes</text>
</g>
<line x1="760" y1="200" x2="800" y2="200" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="800" y1="200" x2="789" y2="196" stroke="#1B2838" stroke-width="1.5"/>
<line x1="800" y1="200" x2="789" y2="204" stroke="#1B2838" stroke-width="1.5"/>
<text x="40" y="330" font-size="16" font-weight="450" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">2 (K,V) x 32 layers x 4096 tokens x 4096 dims x 2 B = 2.00 GiB.</text>
<text x="40" y="380" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">Decode reads this cache once per generated token: the step is memory-bound.</text>
<text x="40" y="404" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Halve the context and you halve the bandwidth tax on every future token.</text>
<text x="40" y="428" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">GQA and MLA shrink what is stored; the formula stays the same.</text>
</svg>