<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Linear attention: drop the softmax</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Same Q, K, V. Different order of multiplication.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="130" width="500" height="300" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Before: softmax attention</text><text x="290" y="200" font-size="14" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">softmax(QK^T / sqrt(d)) V</text><text x="290" y="240" font-size="13" fill="#5C6B7A" text-anchor="middle">every token looks back at</text><text x="290" y="260" font-size="13" fill="#5C6B7A" text-anchor="middle">every prior token: O(n^2)</text><text x="290" y="300" font-size="13" fill="#1B2838" text-anchor="middle">KV cache grows O(n)</text><text x="290" y="330" font-size="13" fill="#5C6B7A" text-anchor="middle">long context: easy</text><text x="290" y="360" font-size="13" fill="#5C6B7A" text-anchor="middle">long context: expensive</text><rect x="580" y="130" width="500" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="830" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">After: linear attention</text><text x="830" y="200" font-size="14" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">Q (K^T V): multiply K,V first</text><text x="830" y="240" font-size="13" fill="#5C6B7A" text-anchor="middle">new tokens meet a compressed</text><text x="830" y="260" font-size="13" fill="#5C6B7A" text-anchor="middle">state S: O(n), constant memory</text><text x="830" y="300" font-size="13" fill="#1B2838" text-anchor="middle">update rule: save state,</text><text x="830" y="320" font-size="13" fill="#1B2838" text-anchor="middle">clear unimportant memory</text><text x="830" y="360" font-size="13" fill="#5C6B7A" text-anchor="middle">long context: harder (RULER)</text><text x="830" y="380" font-size="13" fill="#5C6B7A" text-anchor="middle">long context: cheap</text><text x="560" y="280" font-size="24" fill="#1F7A72">&#8594;</text><text x="40" y="478" font-size="15" font-weight="450" fill="#1B2838">In practice: mix global and linear layers. Kimi K3 stacks both.</text><text x="40" y="510" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 3: one rule: drop softmax, change associativity.</text></svg>