<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="620" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Temperature: one dial, three distributions</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">Same logits. T = 0.5 sharpens toward greedy; T = 2 flattens toward uniform.</text>
<line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="596" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
<text x="40" y="150" font-size="16" font-weight="450" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">logits: [2.0, 1.0, 0.5]</text>
<text x="40" y="180" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">T = 0.5 (cool): the leader takes 0.84</text>
<rect x="40" y="196" width="270" height="40" rx="8" fill="#1F7A72" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="376" y="224" font-size="14" font-weight="450" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">token 1: 0.84</text>
<rect x="40" y="252" width="37" height="40" rx="8" fill="#1F7A72" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="376" y="280" font-size="14" font-weight="450" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">token 2: 0.11</text>
<rect x="40" y="308" width="13" height="40" rx="8" fill="#1F7A72" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="376" y="336" font-size="14" font-weight="450" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">token 3: 0.04</text>
<text x="620" y="180" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">T = 2 (warm): the tail gets 0.23</text>
<rect x="620" y="196" width="154" height="40" rx="8" fill="#C46B2C" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="956" y="224" font-size="14" font-weight="450" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">token 1: 0.48</text>
<rect x="620" y="252" width="93" height="40" rx="8" fill="#C46B2C" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="956" y="280" font-size="14" font-weight="450" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">token 2: 0.29</text>
<rect x="620" y="308" width="73" height="40" rx="8" fill="#C46B2C" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="956" y="336" font-size="14" font-weight="450" fill="#1B2838" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace">token 3: 0.23</text>
<text x="40" y="420" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">Formula: raise each score to 1/T, renormalize.</text>
<text x="40" y="444" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Cool for acting: tool calls must be steady. Warm for thinking: plans need variety.</text>
<text x="40" y="468" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Agents split the difference in one loop: cool act, warm thought.</text>
</svg>