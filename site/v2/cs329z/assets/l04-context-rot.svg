<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="520" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Context rot</text><text x="40" y="82" font-size="17" fill="#5C6B7A">More context is not more understanding. Stale tokens drown the signal.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="130" width="500" height="280" rx="12" fill="#F3D4D8" stroke="#C46B2C" stroke-width="2"/><text x="290" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Before: stuff everything in</text><g><rect x="80" y="200" width="420" height="40" rx="8" fill="#E6E2DA"/><text x="290" y="226" font-size="13" fill="#5C6B7A" text-anchor="middle">50 tool schemas (use 3)</text><rect x="80" y="248" width="420" height="40" rx="8" fill="#E6E2DA"/><text x="290" y="274" font-size="13" fill="#5C6B7A" text-anchor="middle">full chat history (stale)</text><rect x="80" y="296" width="420" height="40" rx="8" fill="#E6E2DA"/><text x="290" y="322" font-size="13" fill="#5C6B7A" text-anchor="middle">10 retrieved docs (2 relevant)</text></g><text x="290" y="380" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">reasoning degrades (OOLONG)</text><rect x="580" y="130" width="500" height="280" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="830" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">After: curate and retrieve</text><g><rect x="620" y="200" width="420" height="40" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="830" y="226" font-size="13" fill="#1B2838" text-anchor="middle">3 tool schemas</text><rect x="620" y="248" width="420" height="40" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="830" y="274" font-size="13" fill="#1B2838" text-anchor="middle">compacted history</text><rect x="620" y="296" width="420" height="40" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="830" y="322" font-size="13" fill="#1B2838" text-anchor="middle">top-k retrieved docs</text></g><text x="830" y="380" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">signal survives</text><text x="40" y="458" font-size="15" font-weight="450" fill="#1B2838">OOLONG (2025): long-context reasoning and aggregation degrade as context fills with distractors.</text><text x="40" y="490" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper. Shell 3: one rule: every token must earn its place.</text></svg>