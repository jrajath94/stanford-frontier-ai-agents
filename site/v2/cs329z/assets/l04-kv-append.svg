<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="540" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Append, do not edit</text><text x="40" y="82" font-size="17" fill="#5C6B7A">The KV cache is positional. Edits in the middle invalidate everything after.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="130" width="500" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="290" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Good: append sequentially</text><g font-family="'IBM Plex Mono', ui-monospace, monospace"><rect x="80" y="200" width="100" height="44" rx="8" fill="#E6E2DA"/><text x="130" y="228" font-size="13" fill="#5C6B7A" text-anchor="middle">tok 1-4</text><rect x="190" y="200" width="100" height="44" rx="8" fill="#E6E2DA"/><text x="240" y="228" font-size="13" fill="#5C6B7A" text-anchor="middle">tok 5-8</text><rect x="300" y="200" width="140" height="44" rx="8" fill="#1F7A72"/><text x="370" y="228" font-size="13" fill="#FFFFFF" text-anchor="middle">new tokens</text></g><text x="290" y="300" font-size="13" fill="#5C6B7A" text-anchor="middle">positions 1-8 unchanged:</text><text x="290" y="320" font-size="13" fill="#5C6B7A" text-anchor="middle">cache stays valid</text><text x="290" y="380" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">cheap: reuse the cache</text><rect x="580" y="130" width="500" height="300" rx="12" fill="#F3D4D8" stroke="#C46B2C" stroke-width="2"/><text x="830" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Bad: insert in the middle</text><g font-family="'IBM Plex Mono', ui-monospace, monospace"><rect x="620" y="200" width="100" height="44" rx="8" fill="#E6E2DA"/><text x="670" y="228" font-size="13" fill="#5C6B7A" text-anchor="middle">tok 1-4</text><rect x="730" y="200" width="120" height="44" rx="8" fill="#C46B2C"/><text x="790" y="228" font-size="13" fill="#FFFFFF" text-anchor="middle">EDIT</text><rect x="860" y="200" width="100" height="44" rx="8" fill="#E6E2DA" stroke="#C46B2C" stroke-width="2" stroke-dasharray="5 4"/><text x="910" y="228" font-size="13" fill="#C46B2C" text-anchor="middle">tok 5-8</text></g><text x="830" y="300" font-size="13" fill="#5C6B7A" text-anchor="middle">positions of tok 5-8 changed:</text><text x="830" y="320" font-size="13" fill="#5C6B7A" text-anchor="middle">embeddings invalidated</text><text x="830" y="380" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">expensive: recompute</text><text x="40" y="478" font-size="15" font-weight="450" fill="#1B2838">Design the loop to append: tool results go at the end, never spliced into history.</text><text x="40" y="510" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 3: one rule: position is state.</text></svg>