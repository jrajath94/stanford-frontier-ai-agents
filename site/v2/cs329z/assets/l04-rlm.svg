<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="500" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Recursive LMs: the model calls itself</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Instead of one giant context, recurse over chunks.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="380" y="140" width="360" height="80" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="176" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Top call: answer the query</text><text x="560" y="200" font-size="13" fill="#5C6B7A" text-anchor="middle">over the whole document</text><g><rect x="80" y="280" width="280" height="80" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="220" y="316" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Sub-call: chunk 1</text><text x="220" y="340" font-size="13" fill="#5C6B7A" text-anchor="middle">summarize this part</text></g><g><rect x="420" y="280" width="280" height="80" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="316" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Sub-call: chunk 2</text><text x="560" y="340" font-size="13" fill="#5C6B7A" text-anchor="middle">summarize this part</text></g><g><rect x="760" y="280" width="280" height="80" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="900" y="316" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Sub-call: chunk 3</text><text x="900" y="340" font-size="13" fill="#5C6B7A" text-anchor="middle">summarize this part</text></g><g stroke="#1B2838" stroke-width="1.5" fill="none"><line x1="470" y1="220" x2="220" y2="280"/><polygon points="226,270 220,280 230,278" fill="#1B2838" stroke="none"/><line x1="560" y1="220" x2="560" y2="280"/><polygon points="554,270 560,280 566,270" fill="#1B2838" stroke="none"/><line x1="650" y1="220" x2="900" y2="280"/><polygon points="890,278 900,280 894,270" fill="#1B2838" stroke="none"/></g><text x="40" y="412" font-size="15" font-weight="450" fill="#1B2838">Each call sees a small context. The top call reasons over summaries, not raw tokens.</text><text x="40" y="444" font-size="13" fill="#5C6B7A">Recursive Language Models (2025): a different philosophy from stuffing one context. Depth replaces width.</text><text x="40" y="478" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper. Shell 4: the new symbol is the recursive call.</text></svg>