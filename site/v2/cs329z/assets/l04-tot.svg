<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="640" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Tree of thoughts: search over reasoning</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">One chain can walk into a dead end. A tree explores several and keeps the best.</text>
<line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="616" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
<text x="40" y="132" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">BEFORE: one chain</text>
<g><rect x="40" y="160" width="220" height="80" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="150" y="194" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">step 1</text>
<text x="150" y="220" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">one thought</text>
</g>
<g><rect x="40" y="256" width="220" height="80" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="150" y="290" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">step 2</text>
<text x="150" y="316" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">one thought</text>
</g>
<g><rect x="40" y="352" width="220" height="80" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="150" y="386" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">step 3: dead end</text>
<text x="150" y="412" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">no way back</text>
</g>
<line x1="150" y1="240" x2="150" y2="256" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="150" y1="256" x2="154" y2="245" stroke="#1B2838" stroke-width="1.5"/>
<line x1="150" y1="256" x2="146" y2="245" stroke="#1B2838" stroke-width="1.5"/>
<line x1="150" y1="336" x2="150" y2="352" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="150" y1="352" x2="154" y2="341" stroke="#1B2838" stroke-width="1.5"/>
<line x1="150" y1="352" x2="146" y2="341" stroke="#1B2838" stroke-width="1.5"/>
<line x1="300" y1="260" x2="380" y2="260" stroke="#1E4D8C" stroke-width="1.5" fill="none"/>
<line x1="380" y1="260" x2="369" y2="256" stroke="#1E4D8C" stroke-width="1.5"/>
<line x1="380" y1="260" x2="369" y2="264" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="340" y="252" font-size="13" fill="#1E4D8C" text-anchor="middle">branch instead</text>
<text x="440" y="132" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">AFTER: a tree with an evaluator</text>
<g><rect x="440" y="160" width="180" height="80" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="530" y="194" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">step 1</text>
<text x="530" y="220" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">one thought</text>
</g>
<g><rect x="440" y="300" width="180" height="80" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="530" y="334" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">candidate A</text>
<text x="530" y="360" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">score 0.8</text>
</g>
<g><rect x="440" y="396" width="180" height="80" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="530" y="430" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">candidate B</text>
<text x="530" y="456" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">score 0.2, prune</text>
</g>
<g><rect x="440" y="492" width="180" height="80" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="530" y="526" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">candidate C</text>
<text x="530" y="552" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">score 0.7</text>
</g>
<line x1="530" y1="240" x2="530" y2="300" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="530" y1="300" x2="534" y2="289" stroke="#1B2838" stroke-width="1.5"/>
<line x1="530" y1="300" x2="526" y2="289" stroke="#1B2838" stroke-width="1.5"/>
<line x1="500" y1="280" x2="440" y2="340" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="440" y1="340" x2="451" y2="335" stroke="#1B2838" stroke-width="1.5"/>
<line x1="440" y1="340" x2="445" y2="329" stroke="#1B2838" stroke-width="1.5"/>
<line x1="560" y1="280" x2="620" y2="430" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="620" y1="430" x2="620" y2="418" stroke="#1B2838" stroke-width="1.5"/>
<line x1="620" y1="430" x2="612" y2="421" stroke="#1B2838" stroke-width="1.5"/>
<g><rect x="680" y="340" width="220" height="80" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="790" y="374" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">keep A and C</text>
<text x="790" y="400" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">evaluator scores</text>
<text x="790" y="420" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">each candidate</text>
</g>
<line x1="620" y1="340" x2="680" y2="360" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="680" y1="360" x2="671" y2="353" stroke="#1B2838" stroke-width="1.5"/>
<line x1="680" y1="360" x2="668" y2="360" stroke="#1B2838" stroke-width="1.5"/>
<line x1="620" y1="492" x2="680" y2="400" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="680" y1="400" x2="670" y2="407" stroke="#1B2838" stroke-width="1.5"/>
<line x1="680" y1="400" x2="677" y2="412" stroke="#1B2838" stroke-width="1.5"/>
<g><rect x="940" y="340" width="140" height="80" rx="12" fill="#1F7A72" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="1010" y="374" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">answer</text>
<text x="1010" y="400" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">from the best</text>
<text x="1010" y="420" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">branch</text>
</g>
<line x1="900" y1="380" x2="940" y2="380" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="940" y1="380" x2="929" y2="376" stroke="#1B2838" stroke-width="1.5"/>
<line x1="940" y1="380" x2="929" y2="384" stroke="#1B2838" stroke-width="1.5"/>
<text x="40" y="580" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Cost: the evaluator scores every branch. Spend it where one chain keeps failing.</text>
</svg>