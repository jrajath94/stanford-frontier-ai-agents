<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="540" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Contextual retrieval</text><text x="40" y="82" font-size="17" fill="#5C6B7A">A chunk alone is ambiguous. The document context disambiguates it.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="130" width="500" height="280" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Before: bare chunk</text><rect x="80" y="200" width="420" height="80" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="230" font-size="13" fill="#5C6B7A" text-anchor="middle">"The company's revenue grew</text><text x="290" y="250" font-size="13" fill="#5C6B7A" text-anchor="middle">by 3% over the previous quarter."</text><text x="290" y="320" font-size="13" fill="#5C6B7A" text-anchor="middle">which company? which quarter?</text><text x="290" y="360" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">retrieval misses the query</text><rect x="580" y="130" width="500" height="280" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="830" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">After: contextualized chunk</text><rect x="620" y="200" width="420" height="100" rx="8" fill="#FFFDF8" stroke="#1F7A72" stroke-width="1.5"/><text x="830" y="228" font-size="13" fill="#1B2838" text-anchor="middle">"From ACME Corp's Q2 2023 SEC</text><text x="830" y="248" font-size="13" fill="#1B2838" text-anchor="middle">filing; Q1 revenue was $314M.</text><text x="830" y="268" font-size="13" fill="#1B2838" text-anchor="middle">The company's revenue grew by 3%..."</text><text x="830" y="330" font-size="13" fill="#5C6B7A" text-anchor="middle">an LLM wrote the prefix from</text><text x="830" y="350" font-size="13" fill="#5C6B7A" text-anchor="middle">the whole document</text><text x="830" y="388" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">query "ACME Q2 2023" matches</text><text x="40" y="458" font-size="15" font-weight="450" fill="#1B2838">Anthropic's recipe: one LLM call per chunk, plus BM25 for exact terms. Retrieval failures drop.</text><text x="40" y="490" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 3: one rule: situate the chunk in its document.</text></svg>