<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="520" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Late chunking vs contextual retrieval</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Two ways to put document context into a chunk vector.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="130" width="500" height="290" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Contextual retrieval</text><text x="290" y="200" font-size="13" fill="#5C6B7A" text-anchor="middle">LLM writes context text,</text><text x="290" y="220" font-size="13" fill="#5C6B7A" text-anchor="middle">then embed chunk + text</text><g><rect x="80" y="260" width="200" height="48" rx="8" fill="#F6E7A8"/><text x="180" y="290" font-size="13" fill="#1B2838" text-anchor="middle">LLM call</text><rect x="300" y="260" width="200" height="48" rx="8" fill="#E7F1F8"/><text x="400" y="290" font-size="13" fill="#1B2838" text-anchor="middle">embed</text></g><text x="290" y="360" font-size="13" fill="#5C6B7A" text-anchor="middle">cost: one LLM call and</text><text x="290" y="380" font-size="13" fill="#5C6B7A" text-anchor="middle">extra tokens per chunk</text><rect x="580" y="130" width="500" height="290" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="830" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Late chunking</text><text x="830" y="200" font-size="13" fill="#5C6B7A" text-anchor="middle">embed the whole document,</text><text x="830" y="220" font-size="13" fill="#5C6B7A" text-anchor="middle">mean-pool each chunk span</text><g><rect x="620" y="260" width="420" height="48" rx="8" fill="#E7F1F8"/><text x="830" y="290" font-size="13" fill="#1B2838" text-anchor="middle">long-context encoder over the doc</text></g><text x="830" y="360" font-size="13" fill="#5C6B7A" text-anchor="middle">cost: no LLM call, no added</text><text x="830" y="380" font-size="13" fill="#5C6B7A" text-anchor="middle">tokens; context rides in the vector</text><text x="40" y="468" font-size="15" font-weight="450" fill="#1B2838">Günther et al. (2024): same goal, cheaper path. Needs a long-context encoder.</text><text x="40" y="498" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper. Shell 3: one rule: context before pooling, not after.</text></svg>