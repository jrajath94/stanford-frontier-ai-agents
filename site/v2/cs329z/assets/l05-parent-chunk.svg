<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="640" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Parent-document chunking: match small, return big</text><text x="40" y="82" font-size="17" fill="#5C6B7A">The child 'Thursday 9am averages 3 waiting' brings the whole queue log back.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="180" width="280" height="120" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="180" y="210" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Query</text><text x="180" y="238" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">Which office hour</text><text x="180" y="258" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">is least crowded?</text><line x1="320" y1="240" x2="360" y2="240" stroke="#1B2838" stroke-width="1.5"/><polygon points="360,240 348.0,246.0 348.0,234.0" fill="#1B2838" stroke="none"/><text x="340" y="232" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">match</text><rect x="360" y="150" width="300" height="280" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="510" y="180" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Child chunks (indexed)</text><rect x="380" y="200" width="260" height="52" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="510" y="232" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">Tuesday 4pm averages 14 waiting.</text><rect x="380" y="262" width="260" height="52" rx="8" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5"/><text x="510" y="294" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">Thursday 9am averages 3 waiting.</text><rect x="380" y="324" width="260" height="52" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="510" y="356" font-size="12" font-weight="600" fill="#1B2838" text-anchor="middle">Friday 2pm averages 9 waiting.</text><text x="510" y="410" font-size="12" font-weight="450" fill="#5C6B7A" text-anchor="middle">short, on-topic: scores high</text><line x1="660" y1="290" x2="770" y2="290" stroke="#1B2838" stroke-width="1.5"/><polygon points="770,290 758.0,296.0 758.0,284.0" fill="#1B2838" stroke="none"/><text x="715" y="282" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">return the parent</text><rect x="770" y="150" width="340" height="280" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="940" y="180" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Parent chunk (returned)</text><text x="940" y="208" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">Office hours queue log, week of Oct 6.</text><text x="940" y="240" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">Tuesday 4pm averages 14 waiting.</text><text x="940" y="270" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">Thursday 9am averages 3 waiting.</text><text x="940" y="300" font-size="13" font-weight="600" fill="#1B2838" text-anchor="middle">Friday 2pm averages 9 waiting.</text><text x="940" y="348" font-size="12" font-weight="450" fill="#5C6B7A" text-anchor="middle">all sessions, for comparison</text><text x="940" y="372" font-size="12" font-weight="450" fill="#5C6B7A" text-anchor="middle">reader gets the table, not one row</text><text x="40" y="544" font-size="15" font-weight="600" fill="#1B2838">Match on the small chunk, return the big one: precision at match time, context at read time.</text><text x="40" y="568" font-size="14" fill="#5C6B7A">Cost: children plus parents, roughly double the chunks.</text><text x="40" y="616" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text></svg>