<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">RAPTOR: a tree over the document</text><text x="40" y="82" font-size="17" fill="#5C6B7A">For answers spread across many chunks, retrieve at the right level.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><g><rect x="440" y="140" width="240" height="64" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="168" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Root summary</text><text x="560" y="190" font-size="12" fill="#5C6B7A" text-anchor="middle">"the whole story's theme"</text></g><g><rect x="220" y="250" width="280" height="64" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="360" y="278" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Cluster summary A</text><text x="360" y="300" font-size="12" fill="#5C6B7A" text-anchor="middle">"the ball and the slipper"</text></g><g><rect x="620" y="250" width="280" height="64" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="760" y="278" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle">Cluster summary B</text><text x="760" y="300" font-size="12" fill="#5C6B7A" text-anchor="middle">"the search and the wedding"</text></g><g><rect x="60" y="360" width="180" height="56" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="150" y="394" font-size="13" fill="#1B2838" text-anchor="middle">chunk 1</text><rect x="260" y="360" width="180" height="56" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="350" y="394" font-size="13" fill="#1B2838" text-anchor="middle">chunk 2</text><rect x="680" y="360" width="180" height="56" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="770" y="394" font-size="13" fill="#1B2838" text-anchor="middle">chunk 7</text><rect x="880" y="360" width="180" height="56" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="970" y="394" font-size="13" fill="#1B2838" text-anchor="middle">chunk 8</text></g><g stroke="#1B2838" stroke-width="1.5" fill="none"><line x1="560" y1="204" x2="360" y2="250"/><line x1="560" y1="204" x2="760" y2="250"/><line x1="360" y1="314" x2="150" y2="360"/><line x1="360" y1="314" x2="350" y2="360"/><line x1="760" y1="314" x2="770" y2="360"/><line x1="760" y1="314" x2="970" y2="360"/></g><text x="560" y="452" font-size="13" fill="#5C6B7A" text-anchor="middle">build bottom-up: embed chunks, cluster, summarize each cluster with an LLM, embed summaries, repeat</text><text x="40" y="490" font-size="15" font-weight="450" fill="#1B2838">Cinderella queries: "central theme?" matches the root; "how did she find a happy ending?" matches a leaf.</text><text x="40" y="520" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper. Shell 4: the new symbol is the summary node.</text></svg>