<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="620" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The vector store: index once, search per query</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">Chunks are embedded offline. The query is embedded live. Search is distance math.</text>
<line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="596" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
<text x="40" y="132" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">OFFLINE: build the index</text>
<g><rect x="40" y="152" width="200" height="88" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="140" y="186" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">10,000 chunks</text>
<text x="140" y="212" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">split the docs</text>
</g>
<g><rect x="280" y="152" width="200" height="88" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="380" y="186" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">embed all</text>
<text x="380" y="212" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">10k vectors</text>
</g>
<g><rect x="520" y="152" width="200" height="88" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="620" y="186" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">index</text>
<text x="620" y="212" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">vectors + metadata</text>
<text x="620" y="232" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">HNSW graph</text>
</g>
<line x1="240" y1="196" x2="280" y2="196" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="280" y1="196" x2="269" y2="192" stroke="#1B2838" stroke-width="1.5"/>
<line x1="280" y1="196" x2="269" y2="200" stroke="#1B2838" stroke-width="1.5"/>
<line x1="480" y1="196" x2="520" y2="196" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="520" y1="196" x2="509" y2="192" stroke="#1B2838" stroke-width="1.5"/>
<line x1="520" y1="196" x2="509" y2="200" stroke="#1B2838" stroke-width="1.5"/>
<text x="40" y="300" font-size="14" font-weight="600" fill="#5C6B7A" text-anchor="start">ONLINE: one query</text>
<g><rect x="40" y="320" width="200" height="88" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="140" y="354" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">query vector</text>
<text x="140" y="380" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">embed the question</text>
</g>
<g><rect x="280" y="320" width="200" height="88" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="380" y="354" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">ANN search</text>
<text x="380" y="380" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">nearest neighbors</text>
<text x="380" y="400" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">in the index</text>
</g>
<g><rect x="520" y="320" width="200" height="88" rx="12" fill="#1F7A72" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="620" y="354" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">top-K chunks</text>
<text x="620" y="380" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">the evidence</text>
</g>
<line x1="240" y1="364" x2="280" y2="364" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="280" y1="364" x2="269" y2="360" stroke="#1B2838" stroke-width="1.5"/>
<line x1="280" y1="364" x2="269" y2="368" stroke="#1B2838" stroke-width="1.5"/>
<line x1="480" y1="364" x2="520" y2="364" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="520" y1="364" x2="509" y2="360" stroke="#1B2838" stroke-width="1.5"/>
<line x1="520" y1="364" x2="509" y2="368" stroke="#1B2838" stroke-width="1.5"/>
<line x1="620" y1="196" x2="620" y2="320" stroke="#1E4D8C" stroke-width="1.5" fill="none"/>
<line x1="620" y1="320" x2="624" y2="309" stroke="#1E4D8C" stroke-width="1.5"/>
<line x1="620" y1="320" x2="616" y2="309" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="620" y="250" font-size="13" fill="#1E4D8C" text-anchor="middle">search</text>
<text x="40" y="470" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">The index is the price of retrieval: embedding 10k chunks once beats reading them per query.</text>
<text x="40" y="494" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Update a document and the index must be rebuilt, or the agent reads last month&#x27;s rows.</text>
</svg>