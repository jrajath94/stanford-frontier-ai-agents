<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="520" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Why retrieval: the office-hours question</text><text x="40" y="82" font-size="17" fill="#5C6B7A">"Which office hour this week is least crowded?"</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="130" width="500" height="290" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">LLM alone: guesses</text><rect x="80" y="200" width="420" height="60" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="226" font-size="13" fill="#5C6B7A" text-anchor="middle">"Try Wednesday afternoon -</text><text x="290" y="246" font-size="13" fill="#5C6B7A" text-anchor="middle">midweek hours are usually quietest."</text><text x="290" y="320" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">plausible, unverified,</text><text x="290" y="342" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">possibly wrong</text><rect x="580" y="130" width="500" height="290" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/><text x="830" y="162" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">LLM + retrieval: knows</text><rect x="620" y="200" width="420" height="60" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="830" y="226" font-size="13" fill="#1B2838" text-anchor="middle">Queue log, last 3 weeks:</text><text x="830" y="246" font-size="13" fill="#1B2838" text-anchor="middle">Tue 4pm: 14 waiting avg; Thu 9am: 3</text><text x="830" y="320" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">"Thursday 9am: about 3</text><text x="830" y="342" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">students ahead of you."</text><text x="40" y="468" font-size="15" font-weight="450" fill="#1B2838">Dynamic: update the log without retraining. Interpretable: the answer can cite the log.</text><text x="40" y="498" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 3: one rule: just-in-time facts beat memorized guesses.</text></svg>