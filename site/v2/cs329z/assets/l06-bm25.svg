<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">BM25: saturation and rarity</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Two ideas: repeated terms matter less each time; rare terms matter more.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="130" width="500" height="300" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="290" y="162" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Term frequency saturates</text><line x1="90" y1="380" x2="490" y2="380" stroke="#1B2838" stroke-width="1.5"/><line x1="90" y1="200" x2="90" y2="380" stroke="#1B2838" stroke-width="1.5"/><path d="M 90 360 Q 200 220 490 205" stroke="#1F7A72" stroke-width="3" fill="none"/><text x="290" y="415" font-size="13" fill="#5C6B7A" text-anchor="middle">times the term appears</text><text x="150" y="240" font-size="13" fill="#1F7A72">score flattens:</text><text x="150" y="260" font-size="13" fill="#1F7A72">10x mentions != 10x score</text><rect x="580" y="130" width="500" height="300" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="830" y="162" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">IDF rewards rarity</text><text x="830" y="210" font-size="14" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">IDF = ln((N-n+0.5)/(n+0.5))</text><text x="830" y="250" font-size="13" fill="#5C6B7A" text-anchor="middle">"the": in every doc, IDF ~ 0</text><text x="830" y="280" font-size="13" fill="#5C6B7A" text-anchor="middle">"xylophone": in 3 docs, IDF high</text><text x="830" y="330" font-size="13" fill="#5C6B7A" text-anchor="middle">length norm: long docs do</text><text x="830" y="350" font-size="13" fill="#5C6B7A" text-anchor="middle">not win by verbosity (b)</text><text x="830" y="392" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">wins: IDs, names, error codes</text><text x="40" y="478" font-size="15" font-weight="450" fill="#1B2838">Most widely used even today. Breaks on paraphrase: "car" never matches "automobile".</text><text x="40" y="510" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: source. Shell 3: two rules: saturate frequency, weight rarity.</text></svg>