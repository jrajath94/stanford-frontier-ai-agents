<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="520" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">DPR: two encoders, one dot product</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Encode the query and the passage separately. Score with a dot product.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="150" width="300" height="140" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="210" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Query encoder</text><text x="210" y="216" font-size="13" fill="#5C6B7A" text-anchor="middle">BERT_q(x)</text><text x="210" y="250" font-size="13" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">q(x): 768 numbers</text><rect x="420" y="150" width="80" height="140" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/><text x="460" y="215" font-size="20" fill="#1B2838" text-anchor="middle">.</text><text x="460" y="235" font-size="13" fill="#5C6B7A" text-anchor="middle">dot</text><rect x="560" y="150" width="300" height="140" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="710" y="188" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">Passage encoder</text><text x="710" y="216" font-size="13" fill="#5C6B7A" text-anchor="middle">BERT_d(z)</text><text x="710" y="250" font-size="13" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">d(z): 768 numbers</text><rect x="920" y="150" width="140" height="140" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="2"/><text x="990" y="200" font-size="13" fill="#5C6B7A" text-anchor="middle">score</text><text x="990" y="228" font-size="14" font-weight="600" fill="#1B2838" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">exp(q.d)</text><text x="990" y="254" font-size="12" fill="#5C6B7A" text-anchor="middle">MIPS top-K</text><rect x="60" y="330" width="1000" height="80" rx="8" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="362" font-size="14" fill="#1B2838" text-anchor="start">Training: contrastive loss with in-batch negatives plus BM25 hard negatives.</text><text x="84" y="386" font-size="13" fill="#5C6B7A" text-anchor="start">1,000 QA pairs beat BM25. DPR beats BM25 on 4 of 5 datasets (Karpukhin et al., 2020).</text><text x="40" y="458" font-size="15" font-weight="450" fill="#1B2838">Bi-encoder: passages precomputed once, queries encoded live. Tens of milliseconds.</text><text x="40" y="490" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: paper. Shell 4: the new symbol is the dot product score.</text></svg>