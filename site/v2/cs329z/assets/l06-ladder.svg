<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="600" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The retriever ladder</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">62 ms to 10,700 ms per 1,000 docs. Accuracy rises with latency; each rung buys the next.</text>
<line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="576" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
<g><rect x="60" y="140" width="340" height="84" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="230" y="174" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">BM25</text>
<text x="230" y="200" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">exact terms, no training</text>
</g>
<text x="430" y="180" font-size="20" font-weight="700" fill="#1B2838" text-anchor="start">62 ms</text>
<rect x="430" y="192" width="193" height="14" rx="7" fill="#1F7A72"/>
<g><rect x="60" y="240" width="340" height="84" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="230" y="274" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">DPR bi-encoder</text>
<text x="230" y="300" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">semantic, 1,000 pairs beat BM25</text>
</g>
<text x="430" y="280" font-size="20" font-weight="700" fill="#1B2838" text-anchor="start">tens of ms</text>
<rect x="430" y="292" width="177" height="14" rx="7" fill="#1F7A72"/>
<g><rect x="60" y="340" width="340" height="84" rx="12" fill="#F4E6D4" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="230" y="374" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">ColBERT</text>
<text x="230" y="400" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">token-level evidence, token-sized index</text>
</g>
<text x="430" y="380" font-size="20" font-weight="700" fill="#1B2838" text-anchor="start">458 ms (GPU)</text>
<rect x="430" y="392" width="339" height="14" rx="7" fill="#1F7A72"/>
<g><rect x="60" y="440" width="340" height="84" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="230" y="474" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">Cross-encoder</text>
<text x="230" y="500" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">the judge: reranks, never scans</text>
</g>
<text x="430" y="480" font-size="20" font-weight="700" fill="#1B2838" text-anchor="start">10,700 ms</text>
<rect x="430" y="492" width="568" height="14" rx="7" fill="#1F7A72"/>
<text x="60" y="552" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="start">Bars are log-scale, per 1,000 docs. Cross-encoder is 173x BM25: 10,700 / 62 = 172.6.</text>
</svg>