<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="600" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Evidence conflict: resolve, do not average</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">Two passages disagree. The pipeline picks by position. The agent must decide.</text>
<line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="576" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
<g><rect x="40" y="180" width="300" height="120" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="190" y="214" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">passage A</text>
<text x="190" y="240" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">&quot;CEO took office</text>
<text x="190" y="260" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">in 2019&quot; (blog, 2021)</text>
</g>
<g><rect x="40" y="330" width="300" height="120" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="190" y="364" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">passage B</text>
<text x="190" y="390" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">&quot;CEO took office</text>
<text x="190" y="410" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">in 2018&quot; (filing, 2024)</text>
</g>
<g><rect x="420" y="240" width="280" height="140" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="560" y="274" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">conflict check</text>
<text x="560" y="300" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">same fact, two values?</text>
<text x="560" y="320" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">flag it, do not</text>
<text x="560" y="340" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">pick by position</text>
</g>
<line x1="340" y1="240" x2="420" y2="280" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="420" y1="280" x2="412" y2="271" stroke="#1B2838" stroke-width="1.5"/>
<line x1="420" y1="280" x2="408" y2="279" stroke="#1B2838" stroke-width="1.5"/>
<line x1="340" y1="390" x2="420" y2="340" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="420" y1="340" x2="408" y2="342" stroke="#1B2838" stroke-width="1.5"/>
<line x1="420" y1="340" x2="413" y2="349" stroke="#1B2838" stroke-width="1.5"/>
<g><rect x="780" y="240" width="300" height="140" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="930" y="274" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">resolve</text>
<text x="930" y="300" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">prefer the newer source</text>
<text x="930" y="320" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">prefer the primary source</text>
<text x="930" y="340" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">or retrieve a tiebreaker</text>
</g>
<line x1="700" y1="310" x2="780" y2="310" stroke="#1F7A72" stroke-width="1.5" fill="none"/>
<line x1="780" y1="310" x2="769" y2="306" stroke="#1F7A72" stroke-width="1.5"/>
<line x1="780" y1="310" x2="769" y2="314" stroke="#1F7A72" stroke-width="1.5"/>
<text x="740" y="302" font-size="13" fill="#1F7A72" text-anchor="middle">decide</text>
<text x="40" y="520" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Log which source won and why. The trace is the audit trail.</text>
</svg>