<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="600" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Recall ceiling: the reader cannot beat the retriever</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">If recall@10 is 0.8, end-to-end accuracy caps at 0.8. No reasoning fixes a missing passage.</text>
<line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="576" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
<g><rect x="40" y="180" width="300" height="120" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="190" y="214" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">retriever</text>
<text x="190" y="240" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">recall@10 = 0.8</text>
<text x="190" y="260" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">finds 8 of 10</text>
<text x="190" y="280" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">needed passages</text>
</g>
<g><rect x="420" y="180" width="300" height="120" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="570" y="214" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">reader</text>
<text x="570" y="240" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">perfect reasoning</text>
<text x="570" y="260" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">over what it got</text>
</g>
<g><rect x="800" y="180" width="280" height="120" rx="12" fill="#F3D4D8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="940" y="214" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">end-to-end &lt;= 0.8</text>
<text x="940" y="240" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">the ceiling holds</text>
<text x="940" y="260" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">no matter how good</text>
<text x="940" y="280" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">the reader is</text>
</g>
<line x1="340" y1="240" x2="420" y2="240" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="420" y1="240" x2="409" y2="236" stroke="#1B2838" stroke-width="1.5"/>
<line x1="420" y1="240" x2="409" y2="244" stroke="#1B2838" stroke-width="1.5"/>
<text x="380" y="232" font-size="13" fill="#1B2838" text-anchor="middle">8 passages</text>
<line x1="720" y1="240" x2="800" y2="240" stroke="#C46B2C" stroke-width="1.5" fill="none"/>
<line x1="800" y1="240" x2="789" y2="236" stroke="#C46B2C" stroke-width="1.5"/>
<line x1="800" y1="240" x2="789" y2="244" stroke="#C46B2C" stroke-width="1.5"/>
<text x="760" y="232" font-size="13" fill="#C46B2C" text-anchor="middle">capped</text>
<text x="420" y="160" font-size="14" font-weight="600" fill="#C46B2C" text-anchor="start">2 passages never arrive.</text>
<text x="40" y="380" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">Agentic retrieval raises the ceiling with rewritten queries and more rounds.</text>
<text x="40" y="404" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Each round inherits the same bound. Measure retriever recall separately: it is the ceiling of the system.</text>
</svg>