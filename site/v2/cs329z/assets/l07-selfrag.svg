<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif">
<rect width="1120" height="620" fill="#F7F4EE"/>
<text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Self-RAG: retrieval becomes a generated decision</text>
<text x="40" y="82" font-size="17" fill="#5C6B7A">The model emits retrieve or no-retrieve as it writes. A critic trains those calls.</text>
<line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="40" y="596" font-size="14" fill="#5C6B7A">Project: Stanford Frontier AI. Source: original</text>
<g><rect x="40" y="180" width="240" height="110" rx="12" fill="#F6E7A8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="160" y="214" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">generate</text>
<text x="160" y="240" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">write the next</text>
<text x="160" y="260" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">segment</text>
</g>
<g><rect x="340" y="180" width="260" height="110" rx="12" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="470" y="214" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">[Retrieve]? </text>
<text x="470" y="240" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">yes: fetch passages</text>
<text x="470" y="260" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">no: keep writing</text>
</g>
<g><rect x="660" y="180" width="240" height="110" rx="12" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="780" y="214" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">critic scores</text>
<text x="780" y="240" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">isRel: passage relevant?</text>
<text x="780" y="260" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">isSupp: answer supported?</text>
<text x="780" y="280" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">isUse: useful overall?</text>
</g>
<line x1="280" y1="235" x2="340" y2="235" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="340" y1="235" x2="329" y2="231" stroke="#1B2838" stroke-width="1.5"/>
<line x1="340" y1="235" x2="329" y2="239" stroke="#1B2838" stroke-width="1.5"/>
<line x1="600" y1="235" x2="660" y2="235" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="660" y1="235" x2="649" y2="231" stroke="#1B2838" stroke-width="1.5"/>
<line x1="660" y1="235" x2="649" y2="239" stroke="#1B2838" stroke-width="1.5"/>
<g><rect x="340" y="340" width="260" height="110" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="470" y="374" font-size="16" font-weight="600" fill="#1B2838" text-anchor="middle">train the tokens</text>
<text x="470" y="400" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">reflection tokens get</text>
<text x="470" y="420" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">segment-level rewards</text>
</g>
<line x1="470" y1="290" x2="470" y2="340" stroke="#1B2838" stroke-width="1.5" fill="none"/>
<line x1="470" y1="340" x2="474" y2="329" stroke="#1B2838" stroke-width="1.5"/>
<line x1="470" y1="340" x2="466" y2="329" stroke="#1B2838" stroke-width="1.5"/>
<text x="40" y="520" font-size="15" font-weight="600" fill="#1B2838" text-anchor="start">Retrieval stops being a pipeline stage and becomes a choice the model makes, per segment.</text>
<text x="40" y="544" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Price: the critic&#x27;s labels. Segment-level supervision is the expensive part.</text>
</svg>