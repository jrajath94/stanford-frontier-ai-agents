<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the moving bottleneck and the hedge</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The hedge is owning the moving layers. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the hedge</text>
<text x="328" y="124">the stored object: the stack</text>
<text x="648" y="124">WITH the hedge</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" fill="#1B2838">single-layer company</text>
<text x="180" y="228" text-anchor="middle" fill="#5C6B7A" font-size="14">hostage to one bottleneck</text>
<text x="180" y="272" text-anchor="middle" fill="#5C6B7A" font-size="14">chips, then memory,</text>
<text x="180" y="296" text-anchor="middle" fill="#5C6B7A" font-size="14">then energized shells</text>
<text x="180" y="340" text-anchor="middle" fill="#C46B2C" font-size="14">stuck when the gate moves</text>
<text x="180" y="384" text-anchor="middle" fill="#5C6B7A" font-size="14">labor binds underneath</text>
<text x="180" y="408" text-anchor="middle" fill="#5C6B7A" font-size="14">the whole time</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<g font-size="14" font-weight="500">
<rect x="360" y="164" width="240" height="56" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="199" text-anchor="middle" fill="#1B2838">energy development</text>
<rect x="360" y="228" width="240" height="56" rx="12" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="263" text-anchor="middle" fill="#1B2838">data center buildings</text>
<rect x="360" y="292" width="240" height="56" rx="12" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="327" text-anchor="middle" fill="#1B2838">GPU cluster deployment</text>
<rect x="360" y="356" width="240" height="56" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="391" text-anchor="middle" fill="#1B2838">managed services</text>
</g>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">vertically integrated</text>
<text x="780" y="228" text-anchor="middle" fill="#5C6B7A" font-size="14">retools as the gate moves</text>
<text x="780" y="272" text-anchor="middle" fill="#5C6B7A" font-size="14">not in the chip business</text>
<text x="780" y="296" text-anchor="middle" fill="#5C6B7A" font-size="14">not in the model business</text>
<text x="780" y="340" text-anchor="middle" fill="#1F7A72" font-size="14">everything between</text>
<text x="780" y="364" text-anchor="middle" fill="#1F7A72" font-size="14">energy and tokens</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: last year's gate is a sunk cost. Invest in whatever gates output this year, and be ready to move.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" fill="#5C6B7A">Four years, three gates: chips, then memory, now energized shells. Labor always.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the binding constraint moves, so the hedge is owning the layers it can move across.</text>
</svg>
