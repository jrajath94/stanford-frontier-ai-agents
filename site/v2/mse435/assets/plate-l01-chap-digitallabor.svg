<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the digital labor thesis, end to end</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The labor term becomes investable. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="328" y="124">the stored object</text>
<text x="648" y="124">WITH the rule</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" fill="#1B2838">labor capped</text>
<text x="180" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">by the birth rate</text>
<text x="180" y="256" text-anchor="middle" fill="#1B2838" font-size="22" font-weight="600">3.0%</text>
<text x="180" y="284" text-anchor="middle" fill="#5C6B7A" font-size="14">growth, labor fixed</text>
<text x="180" y="328" text-anchor="middle" fill="#5C6B7A" font-size="14">20-year lead time</text>
<text x="180" y="356" text-anchor="middle" fill="#5C6B7A" font-size="14">no dial to turn</text>
<text x="180" y="400" text-anchor="middle" fill="#5C6B7A" font-size="14">term fixed on any</text>
<text x="180" y="424" text-anchor="middle" fill="#5C6B7A" font-size="14">planning horizon</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" fill="#1B2838">agent does the work</text>
<text x="480" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">a task a human would do</text>
<line x1="480" y1="232" x2="480" y2="252" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="472,252 480,268 488,252" fill="#1B2838"/>
<text x="480" y="296" text-anchor="middle" fill="#1B2838">tokens cost factories</text>
<text x="480" y="324" text-anchor="middle" fill="#5C6B7A" font-size="14">power, chips, buildings</text>
<line x1="480" y1="344" x2="480" y2="364" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="472,364 480,380 488,364" fill="#1B2838"/>
<text x="480" y="408" text-anchor="middle" fill="#1B2838">the wage becomes</text>
<text x="480" y="432" text-anchor="middle" fill="#1B2838">a CapEx line</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">labor investable</text>
<text x="780" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">moves with money</text>
<text x="780" y="256" text-anchor="middle" fill="#1B2838" font-size="22" font-weight="600">3.0% to 3.5%</text>
<text x="780" y="284" text-anchor="middle" fill="#1F7A72" font-size="14">+0.5 pt of labor growth</text>
<text x="780" y="328" text-anchor="middle" fill="#5C6B7A" font-size="14">$1.34 to $1.41 per $1</text>
<text x="780" y="356" text-anchor="middle" fill="#5C6B7A" font-size="14">in ten years: 5% larger</text>
<text x="780" y="400" text-anchor="middle" fill="#5C6B7A" font-size="14">token demand: 24x by 2030</text>
<text x="780" y="424" text-anchor="middle" fill="#5C6B7A" font-size="14">Goldman Sachs, May 2026</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Price: the $650B ($730B guided for 2026) is a bid on that half point.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" fill="#5C6B7A">It pays only if token revenue per MW stays in the upper payback rows.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: digital labor turns the capped labor term into an investable one, and the factories are the investment vehicle.</text>
</svg>
