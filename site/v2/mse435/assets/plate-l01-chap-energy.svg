<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the energy-first playbook</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Move the computers to the cheap power. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule: the hub</text>
<text x="328" y="124">the inversion</text>
<text x="648" y="124">WITH the rule: campuses</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="264" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" fill="#1B2838">Northern Virginia</text>
<text x="180" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">the crowded trade</text>
<text x="180" y="256" text-anchor="middle" fill="#5C6B7A" font-size="14">land costs more</text>
<text x="180" y="284" text-anchor="middle" fill="#5C6B7A" font-size="14">permitting queues long</text>
<text x="180" y="312" text-anchor="middle" fill="#5C6B7A" font-size="14">power prices reflect</text>
<text x="180" y="336" text-anchor="middle" fill="#5C6B7A" font-size="14">competition</text>
<text x="180" y="380" text-anchor="middle" fill="#5C6B7A" font-size="14">energy mispriced</text>
<text x="180" y="404" text-anchor="middle" fill="#5C6B7A" font-size="14">by location only</text>
<rect x="328" y="140" width="304" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="184" text-anchor="middle" fill="#1B2838">move computers</text>
<text x="480" y="208" text-anchor="middle" fill="#1B2838">to the energy</text>
<text x="480" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">data over fiber: cheap</text>
<text x="480" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">electrons over wires:</text>
<text x="480" y="304" text-anchor="middle" fill="#5C6B7A" font-size="14">expensive, slow to permit</text>
<text x="480" y="348" text-anchor="middle" fill="#1B2838">follow the cheap move</text>
<text x="480" y="376" text-anchor="middle" fill="#5C6B7A" font-size="14">across the meter:</text>
<text x="480" y="400" text-anchor="middle" fill="#5C6B7A" font-size="14">generate on site, sell surplus,</text>
<text x="480" y="424" text-anchor="middle" fill="#5C6B7A" font-size="14">draw from the grid to firm</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">Abilene, Texas</text>
<text x="780" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">2.1 GW planned</text>
<text x="780" y="236" text-anchor="middle" fill="#C46B2C" font-size="14">1.2 GW delivered: grid capped it</text>
<text x="780" y="280" text-anchor="middle" fill="#1B2838">Quan, Texas</text>
<text x="780" y="308" text-anchor="middle" fill="#5C6B7A" font-size="14">wind behind the meter</text>
<text x="780" y="352" text-anchor="middle" fill="#1B2838">Ohio: 8 GW planned</text>
<text x="780" y="380" text-anchor="middle" fill="#5C6B7A" font-size="14">10 GW new generation</text>
<text x="780" y="404" text-anchor="middle" fill="#5C6B7A" font-size="14">first 800 MW in 2028</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="486" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: power is the longest lead-time input. Secure generation, transmission, and permits before the GPUs arrive.</text>
<text x="480" y="510" text-anchor="middle" font-size="15" fill="#5C6B7A">Abilene proves the win and the ceiling: 43% of the plan died in grid delays.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: energy-first won the sites, but power availability, not chips, set their size.</text>
</svg>
