<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the $60M megawatt</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The megawatt is the unit price. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT machines: $20M/MW</text>
<text x="328" y="124">the megawatt: unit price</text>
<text x="648" y="124">WITH machines: revenue</text>
</g>
<g font-size="14" font-weight="500">
<rect x="48" y="140" width="264" height="330" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="172" text-anchor="middle" fill="#1B2838">labor $4.7M</text>
<text x="180" y="212" text-anchor="middle" fill="#1B2838">gas plant $2-3M</text>
<text x="180" y="252" text-anchor="middle" fill="#1B2838">fit-out about $3M</text>
<text x="180" y="292" text-anchor="middle" fill="#1B2838">electrical $3.5-4.5M</text>
<text x="180" y="332" text-anchor="middle" fill="#5C6B7A">worked estimate</text>
<text x="180" y="368" text-anchor="middle" fill="#1B2838">mechanical $2-3M</text>
<text x="180" y="404" text-anchor="middle" fill="#1B2838">materials $1.5-2.5M</text>
<text x="180" y="440" text-anchor="middle" fill="#1B2838">soft costs $1-2M</text>
<rect x="328" y="140" width="304" height="330" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="200" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">$20M</text>
<text x="480" y="226" text-anchor="middle" fill="#5C6B7A">factory and power plant</text>
<text x="480" y="266" text-anchor="middle" fill="#1B2838" font-size="24" font-weight="600">+</text>
<text x="480" y="316" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">$40M</text>
<text x="480" y="342" text-anchor="middle" fill="#5C6B7A">machines inside</text>
<text x="480" y="382" text-anchor="middle" fill="#1B2838" font-size="24" font-weight="600">= $60M per MW</text>
<text x="480" y="412" text-anchor="middle" fill="#5C6B7A">OpEx $1-2M per MW per year</text>
<text x="480" y="440" text-anchor="middle" fill="#5C6B7A">a gigawatt costs $60B</text>
<rect x="648" y="140" width="264" height="330" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="172" text-anchor="middle" fill="#1B2838">GPUs $30M</text>
<text x="780" y="212" text-anchor="middle" fill="#1B2838">networking $4M</text>
<text x="780" y="252" text-anchor="middle" fill="#1B2838">CPUs and storage $3M</text>
<text x="780" y="292" text-anchor="middle" fill="#1B2838">fit-out $3M</text>
<text x="780" y="332" text-anchor="middle" fill="#1B2838">deploy $1M</text>
<line x1="672" y1="360" x2="888" y2="360" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="780" y="392" text-anchor="middle" fill="#1F7A72">rent: $15M/yr, 4 yrs</text>
<text x="780" y="424" text-anchor="middle" fill="#1F7A72">+ services: $30M/yr, 2 yrs</text>
</g>
<rect x="48" y="486" width="864" height="56" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="521" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: the stack pays back only if token revenue per MW stays in the upper rows. The depreciation curve decides.</text>
<text x="48" y="578" font-size="15" font-weight="500" fill="#1B2838">One connection: the megawatt is the unit price of the whole business. Inputs and revenue are both quoted per MW.</text>
</svg>
