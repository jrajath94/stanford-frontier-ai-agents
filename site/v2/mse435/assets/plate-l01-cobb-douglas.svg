<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="540" fill="#F7F4EE"/>
<text x="48" y="64" font-size="30" font-weight="600" fill="#1B2838">The growth equation, and the capped term</text>
<text x="48" y="96" font-size="17" fill="#5C6B7A">GDP growth = change in labor + change in capital + change in technology. Shell 2. Source: original toy.</text>
<!-- toy -->
<g font-size="15" font-weight="500">
<rect x="48" y="136" width="280" height="120" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="188" y="176" text-anchor="middle" fill="#1B2838">labor: +1 point</text>
<text x="188" y="204" text-anchor="middle" fill="#C46B2C" font-size="14">capped by birth rate</text>
<text x="188" y="228" text-anchor="middle" fill="#5C6B7A" font-size="14">20-year lead time</text>
<rect x="340" y="136" width="280" height="120" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="480" y="176" text-anchor="middle" fill="#1B2838">capital: +1 point</text>
<text x="480" y="204" text-anchor="middle" fill="#1F7A72" font-size="14">moves with money</text>
<text x="480" y="228" text-anchor="middle" fill="#5C6B7A" font-size="14">deploys in quarters</text>
<rect x="632" y="136" width="280" height="120" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="772" y="176" text-anchor="middle" fill="#1B2838">technology: +1 point</text>
<text x="772" y="204" text-anchor="middle" fill="#5C6B7A" font-size="14">ideas that make</text>
<text x="772" y="228" text-anchor="middle" fill="#5C6B7A" font-size="14">labor productive</text>
</g>
<!-- after: digital labor breaks the cap -->
<text x="48" y="316" font-size="20" font-weight="600" fill="#1B2838">Then digital labor breaks the cap</text>
<line x1="48" y1="336" x2="912" y2="336" stroke="#D9D3C7" stroke-width="1.5"/>
<g font-size="15" font-weight="500">
<rect x="48" y="360" width="280" height="88" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="188" y="392" text-anchor="middle" fill="#1B2838">labor: +1 point</text>
<text x="188" y="420" text-anchor="middle" fill="#1F7A72" font-size="14">now moves with CapEx</text>
<rect x="344" y="360" width="200" height="88" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="444" y="400" text-anchor="middle" fill="#1B2838">agents</text>
<text x="444" y="424" text-anchor="middle" fill="#5C6B7A" font-size="14">doing real work</text>
<rect x="560" y="360" width="352" height="88" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="736" y="392" text-anchor="middle" fill="#1B2838">growth 3.0% → 3.5%</text>
<text x="736" y="420" text-anchor="middle" fill="#1E4D8C" font-size="14">+$0.5 pt from the freed term</text>
</g>
<text x="48" y="500" font-size="16" fill="#1B2838" font-weight="500">One claim: labor was the only term that could not move on an investment horizon. Now it can.</text>
</svg>
