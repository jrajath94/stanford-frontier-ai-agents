<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="540" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">Digital labor: the labor term becomes investable</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Traditional labor waits on the birth rate; digital labor scales with CapEx. Shell 3. Source: original.</text>
<!-- left: before -->
<g>
<rect x="64" y="136" width="256" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="192" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">before: traditional labor</text>
<rect x="80" y="186" width="224" height="56" rx="8" fill="#E7F1F8"/>
<text x="192" y="214" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">workers: headcount</text>
<text x="192" y="274" font-size="14" font-weight="500" fill="#C46B2C" text-anchor="middle">capped by birth rate</text>
<line x1="88" y1="312" x2="296" y2="312" stroke="#1B2838" stroke-width="1.5"/>
<line x1="88" y1="308" x2="88" y2="316" stroke="#1B2838" stroke-width="1.5"/>
<line x1="296" y1="308" x2="296" y2="316" stroke="#1B2838" stroke-width="1.5"/>
<text x="88" y="336" font-size="13" fill="#5C6B7A">birth</text>
<text x="296" y="336" font-size="13" fill="#5C6B7A" text-anchor="end">first productive hour</text>
<text x="192" y="360" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">lead time &#8776; 20 years</text>
<text x="192" y="384" font-size="13" fill="#5C6B7A" text-anchor="middle">every lever takes years or decades</text>
</g>
<!-- chevron before -> rule -->
<polygon points="328,260 344,268 328,276" fill="#1B2838"/>
<!-- center: the rule -->
<g>
<rect x="352" y="136" width="256" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the rule</text>
<rect x="368" y="186" width="224" height="80" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="480" y="216" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">digital labor scales</text>
<text x="480" y="238" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">with CapEx</text>
<text x="480" y="300" font-size="14" fill="#1B2838" text-anchor="middle">a task goes to an agent</text>
<text x="480" y="322" font-size="14" fill="#1B2838" text-anchor="middle">the agent consumes tokens</text>
<text x="480" y="344" font-size="13" fill="#1B2838" text-anchor="middle">tokens cost power, chips, buildings</text>
<text x="480" y="384" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">the wage becomes a CapEx line</text>
</g>
<!-- chevron rule -> after -->
<polygon points="616,260 632,268 616,276" fill="#1B2838"/>
<!-- right: after -->
<g>
<rect x="640" y="136" width="256" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="768" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">after: digital labor</text>
<rect x="656" y="186" width="224" height="56" rx="8" fill="#E7F4EF"/>
<text x="768" y="214" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">labor from CapEx</text>
<text x="768" y="274" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">lead time: quarters</text>
<text x="768" y="296" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">moves when money moves</text>
<text x="768" y="328" font-size="13" fill="#5C6B7A" text-anchor="middle">lead time, before vs after</text>
<rect x="672" y="340" width="168" height="16" rx="4" fill="#E6E2DA"/>
<text x="848" y="353" font-size="13" fill="#1B2838">20 years</text>
<rect x="672" y="364" width="40" height="16" rx="4" fill="#1F7A72"/>
<text x="720" y="377" font-size="13" fill="#1B2838">quarters</text>
</g>
<line x1="64" y1="452" x2="896" y2="452" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="488" font-size="16" font-weight="500" fill="#1B2838">One claim: the labor term moves when money moves. The lead time collapses to quarters.</text>
</svg>
