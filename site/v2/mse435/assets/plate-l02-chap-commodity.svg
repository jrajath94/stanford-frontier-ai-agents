<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the commodity verdict</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Old compute commoditizes; the edge and scale do not. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT pricing power: old</text>
<text x="328" y="124">the stored object: the API</text>
<text x="648" y="124">WITH pricing power: edge + scale</text>
</g>
<g font-size="14" font-weight="500">
<rect x="48" y="140" width="264" height="330" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="180" text-anchor="middle" fill="#1B2838">old compute commoditizes</text>
<text x="180" y="204" text-anchor="middle" fill="#5C6B7A">new generations arrive</text>
<text x="180" y="244" text-anchor="middle" fill="#1B2838">token prices -41%</text>
<text x="180" y="268" text-anchor="middle" fill="#5C6B7A">in six months (Ramp)</text>
<text x="180" y="308" text-anchor="middle" fill="#1B2838">8 models repriced</text>
<text x="180" y="332" text-anchor="middle" fill="#5C6B7A">in one September</text>
<text x="180" y="372" text-anchor="middle" fill="#1B2838">mix shifts down</text>
<text x="180" y="396" text-anchor="middle" fill="#5C6B7A">frontier share 53% to 45%</text>
<text x="180" y="436" text-anchor="middle" fill="#1B2838">the customer arbitrages</text>
<rect x="328" y="140" width="304" height="330" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="200" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">the chip</text>
<text x="480" y="226" text-anchor="middle" fill="#5C6B7A">bought on price</text>
<text x="480" y="266" text-anchor="middle" fill="#1B2838" font-size="24" font-weight="600">-&gt;</text>
<text x="480" y="316" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">the API</text>
<text x="480" y="342" text-anchor="middle" fill="#5C6B7A">priced on what the customer earns</text>
<text x="480" y="382" text-anchor="middle" fill="#1B2838">abstraction moves pricing</text>
<text x="480" y="406" text-anchor="middle" fill="#5C6B7A">to whoever owns the customer</text>
<text x="480" y="440" text-anchor="middle" fill="#5C6B7A">Crusoe owns the layer above</text>
<rect x="648" y="140" width="264" height="330" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="180" text-anchor="middle" fill="#1B2838">the cutting edge</text>
<text x="780" y="204" text-anchor="middle" fill="#5C6B7A">newest chip always premiums</text>
<text x="780" y="244" text-anchor="middle" fill="#1B2838">scarcity + best perf/watt</text>
<text x="780" y="268" text-anchor="middle" fill="#5C6B7A">= pricing power, decaying</text>
<text x="780" y="308" text-anchor="middle" fill="#1B2838">scale: "absolutely not"</text>
<text x="780" y="332" text-anchor="middle" fill="#5C6B7A">a commodity</text>
<text x="780" y="372" text-anchor="middle" fill="#1B2838">100k chips as one machine</text>
<text x="780" y="396" text-anchor="middle" fill="#5C6B7A">built over years, paid in outages</text>
<text x="780" y="436" text-anchor="middle" fill="#1B2838">margins 80% toward 60%</text>
</g>
<rect x="48" y="486" width="864" height="56" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="521" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: abstraction defends old chips' useful life and accelerates the commodity outcome at once.</text>
<text x="48" y="578" font-size="15" font-weight="500" fill="#1B2838">One connection: watch the margin, not the price. 80% toward 60% is where the verdict shows up first.</text>
</svg>
