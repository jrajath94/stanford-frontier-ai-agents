<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the factory forms</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Quan, Spark, and space answer one bar each. Source: original synthesis.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT new forms: the bars</text>
<text x="328" y="124">the stored object: the bottleneck</text>
<text x="648" y="124">WITH new forms: the answers</text>
</g>
<g font-size="14" font-weight="500">
<rect x="48" y="140" width="264" height="330" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="180" text-anchor="middle" fill="#1B2838">energy: grid cannot deliver</text>
<text x="180" y="204" text-anchor="middle" fill="#5C6B7A">Abilene builds a 350 MW gas plant</text>
<text x="180" y="244" text-anchor="middle" fill="#1B2838">labor: trades do not exist</text>
<text x="180" y="268" text-anchor="middle" fill="#5C6B7A">$4.7M/MW, town by town</text>
<text x="180" y="308" text-anchor="middle" fill="#1B2838">permission: months of delay</text>
<text x="180" y="332" text-anchor="middle" fill="#5C6B7A">soft costs compound</text>
<text x="180" y="372" text-anchor="middle" fill="#1B2838">each bar is inflating</text>
<text x="180" y="396" text-anchor="middle" fill="#5C6B7A">labor, turbines, electrical</text>
<rect x="328" y="140" width="304" height="330" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="200" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">the moving bottleneck</text>
<text x="480" y="226" text-anchor="middle" fill="#5C6B7A">L01's lens, applied</text>
<text x="480" y="266" text-anchor="middle" fill="#1B2838" font-size="24" font-weight="600">-&gt;</text>
<text x="480" y="316" text-anchor="middle" fill="#1B2838" font-size="16" font-weight="600">own the layer it moves through</text>
<text x="480" y="352" text-anchor="middle" fill="#5C6B7A">Quan answers the energy bar</text>
<text x="480" y="382" text-anchor="middle" fill="#5C6B7A">Spark answers the labor bar</text>
<text x="480" y="412" text-anchor="middle" fill="#5C6B7A">space answers permission</text>
<text x="480" y="442" text-anchor="middle" fill="#5C6B7A">if launch cost ever falls 100x</text>
<rect x="648" y="140" width="264" height="330" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="180" text-anchor="middle" fill="#1B2838">Quan: across the meter</text>
<text x="780" y="204" text-anchor="middle" fill="#5C6B7A">wind farm + campus, netted</text>
<text x="780" y="244" text-anchor="middle" fill="#1B2838">Spark: months, not years</text>
<text x="780" y="268" text-anchor="middle" fill="#5C6B7A">500 kW / 2 MW units</text>
<text x="780" y="308" text-anchor="middle" fill="#1B2838">space: the long bet</text>
<text x="780" y="332" text-anchor="middle" fill="#5C6B7A">no concrete, no permits</text>
<text x="780" y="372" text-anchor="middle" fill="#1B2838">verdict: 5-10 years out</text>
<text x="780" y="396" text-anchor="middle" fill="#5C6B7A">heat and hands stay hard</text>
<text x="780" y="436" text-anchor="middle" fill="#1B2838">each buys electrons</text>
<text x="780" y="460" text-anchor="middle" fill="#1B2838">or permission</text>
</g>
<rect x="48" y="486" width="864" height="56" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="521" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: new forms buy electrons and permission. Space keeps the hardest problems: heat and hands.</text>
<text x="48" y="578" font-size="15" font-weight="500" fill="#1B2838">One connection: each new factory form answers one bar of the $20M stack.</text>
</svg>
