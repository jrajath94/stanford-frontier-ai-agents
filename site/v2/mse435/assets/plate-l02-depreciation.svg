<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="540" fill="#F7F4EE"/>
<text x="48" y="60" font-size="30" font-weight="600" fill="#1B2838">Depreciation: book life versus economic life</text>
<text x="48" y="92" font-size="17" fill="#5C6B7A">The H100's profit curve vs the six-year standard. Shell 3. Source: original; figures via Fortune, April 2026.</text>
<g font-size="15" font-weight="500">
<rect x="48" y="136" width="200" height="128" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="148" y="172" text-anchor="middle" fill="#1B2838" font-size="14">year 2</text>
<text x="148" y="206" text-anchor="middle" fill="#1B2838" font-size="22" font-weight="600">+$36k</text>
<text x="148" y="234" text-anchor="middle" fill="#5C6B7A" font-size="14">137% ROI</text>
<line x1="248" y1="200" x2="300" y2="200" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="300,192 316,200 300,208" fill="#1B2838"/>
<rect x="316" y="136" width="200" height="128" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="416" y="172" text-anchor="middle" fill="#1B2838" font-size="14">year 3</text>
<text x="416" y="206" text-anchor="middle" fill="#1B2838" font-size="22" font-weight="600">falling</text>
<text x="416" y="234" text-anchor="middle" fill="#5C6B7A" font-size="14">rental price recovered</text>
<line x1="516" y1="200" x2="568" y2="200" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="568,192 584,200 568,208" fill="#1B2838"/>
<rect x="584" y="136" width="200" height="128" rx="12" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="684" y="172" text-anchor="middle" fill="#1B2838" font-size="14">year 4</text>
<text x="684" y="206" text-anchor="middle" fill="#1B2838" font-size="22" font-weight="600">-$4.4k</text>
<text x="684" y="234" text-anchor="middle" fill="#5C6B7A" font-size="14">-34% ROI, economically dead</text>
</g>
<rect x="48" y="296" width="864" height="104" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="76" y="336" font-size="16" fill="#1B2838"><tspan font-weight="600">Book standard:</tspan> 6 years (guest) vs 5 years (host's framing). Depreciation = $10M/yr on a $60M asset.</text>
<text x="76" y="366" font-size="16" fill="#1B2838"><tspan font-weight="600">Economic life:</tspan> about 3 years. New generations' compute-per-watt forces swaps inside fixed power ceilings.</text>
<rect x="48" y="424" width="864" height="64" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/>
<text x="480" y="462" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">Defense: abstraction. Customers buy tokens, never see the chip, so old chips stay revenue-producing longer.</text>
</svg>
