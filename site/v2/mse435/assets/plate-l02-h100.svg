<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="560" fill="#F7F4EE"/>
<text x="64" y="64" font-size="30" font-weight="600" fill="#1B2838">The H100 price path: old compute repriced upward</text>
<text x="64" y="96" font-size="17" fill="#5C6B7A">Fell, then the agent boom pulled it above launch. Shell 3. Source: original; prices via the Ornn index.</text>
<!-- left: before -->
<g>
<rect x="64" y="136" width="256" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="192" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">before: the expected decay</text>
<rect x="80" y="186" width="224" height="56" rx="8" fill="#E7F1F8"/>
<text x="192" y="214" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">~$7-8/hr at the 2024 peak</text>
<text x="192" y="274" font-size="14" font-weight="500" fill="#1E4D8C" text-anchor="middle">fell below $3 late 2025</text>
<text x="192" y="298" font-size="14" font-weight="500" fill="#1E4D8C" text-anchor="middle">below $1 early 2026</text>
<text x="192" y="336" font-size="13" fill="#5C6B7A" text-anchor="middle">new generations arrive,</text>
<text x="192" y="360" font-size="13" fill="#5C6B7A" text-anchor="middle">old chips slide down the curve</text>
</g>
<!-- chevron before -> rule -->
<polygon points="328,260 344,268 328,276" fill="#1B2838"/>
<!-- center: the rule -->
<g>
<rect x="352" y="136" width="256" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">the rule</text>
<rect x="368" y="186" width="224" height="80" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="480" y="216" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">agent demand boom</text>
<text x="480" y="238" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">agents burn tokens</text>
<text x="480" y="300" font-size="14" fill="#1B2838" text-anchor="middle">Blackwell rationed to the</text>
<text x="480" y="322" font-size="14" fill="#1B2838" text-anchor="middle">largest buyers: old tier stays bid</text>
<text x="480" y="360" font-size="13" font-weight="500" fill="#1F7A72" text-anchor="middle">demand outran supply</text>
</g>
<!-- chevron rule -> after -->
<polygon points="616,260 632,268 616,276" fill="#1B2838"/>
<!-- right: after -->
<g>
<rect x="640" y="136" width="256" height="264" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="768" y="170" font-size="15" font-weight="600" fill="#1B2838" text-anchor="middle">after: the rebound</text>
<rect x="656" y="186" width="224" height="56" rx="8" fill="#E7F4EF"/>
<text x="768" y="214" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">~$3.28/hr, Sept 2026</text>
<text x="768" y="274" font-size="14" font-weight="500" fill="#1F7A72" text-anchor="middle">up 22% in one month</text>
<text x="768" y="298" font-size="14" font-weight="500" fill="#1B2838" text-anchor="middle">back above the launch price</text>
<text x="768" y="336" font-size="13" fill="#5C6B7A" text-anchor="middle">still below the $7-8 peak</text>
<text x="768" y="360" font-size="13" fill="#5C6B7A" text-anchor="middle">evidence, not a promise</text>
</g>
<line x1="64" y1="452" x2="896" y2="452" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="64" y="488" font-size="16" font-weight="500" fill="#1B2838">One claim: old compute stayed valuable because demand grew faster than the new supply.</text>
</svg>
