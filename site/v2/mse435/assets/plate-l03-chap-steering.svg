<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: steering the model</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. From raw completion to the assistant. Source: original synthesis of the session.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT steering: raw</text>
<text x="328" y="124">the stored object: the reward</text>
<text x="648" y="124">WITH steering: the assistant</text>
</g>
<g font-size="14" font-weight="500">
<rect x="48" y="140" width="264" height="330" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="180" text-anchor="middle" fill="#1B2838">completes text</text>
<text x="180" y="204" text-anchor="middle" fill="#5C6B7A">does not answer</text>
<text x="180" y="244" text-anchor="middle" fill="#1B2838">hallucinates freely</text>
<text x="180" y="268" text-anchor="middle" fill="#5C6B7A">no notion of helpful</text>
<text x="180" y="308" text-anchor="middle" fill="#1B2838">ignores safety norms</text>
<text x="180" y="332" text-anchor="middle" fill="#5C6B7A">lists random dinner names</text>
<text x="180" y="372" text-anchor="middle" fill="#1B2838">brilliant, unusable</text>
<text x="180" y="396" text-anchor="middle" fill="#5C6B7A">pre-training built the brain</text>
<rect x="328" y="140" width="304" height="330" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="480" y="200" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">human rankings</text>
<text x="480" y="226" text-anchor="middle" fill="#5C6B7A">this answer better, that worse</text>
<text x="480" y="266" text-anchor="middle" fill="#1B2838" font-size="24" font-weight="600">-&gt;</text>
<text x="480" y="316" text-anchor="middle" fill="#1B2838" font-size="20" font-weight="600">reward model</text>
<text x="480" y="342" text-anchor="middle" fill="#5C6B7A">a learned judge of quality</text>
<text x="480" y="382" text-anchor="middle" fill="#1B2838">RL maximizes the score</text>
<text x="480" y="406" text-anchor="middle" fill="#5C6B7A">then: verifiable rewards</text>
<text x="480" y="440" text-anchor="middle" fill="#5C6B7A">the checker replaces the judge</text>
<rect x="648" y="140" width="264" height="330" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="180" text-anchor="middle" fill="#1B2838">GPT-4: scale + steering</text>
<text x="780" y="204" text-anchor="middle" fill="#5C6B7A">the product exists</text>
<text x="780" y="244" text-anchor="middle" fill="#1B2838">answers in chat format</text>
<text x="780" y="268" text-anchor="middle" fill="#5C6B7A">refuses the weapons request</text>
<text x="780" y="308" text-anchor="middle" fill="#1B2838">price: the judge is learned</text>
<text x="780" y="332" text-anchor="middle" fill="#5C6B7A">reward hacking games it</text>
<text x="780" y="372" text-anchor="middle" fill="#1B2838">labels are slow, costly</text>
<text x="780" y="396" text-anchor="middle" fill="#5C6B7A">thousands of pairs per behavior</text>
<text x="780" y="436" text-anchor="middle" fill="#1B2838">RLVR answers with checkers</text>
</g>
<rect x="48" y="486" width="864" height="56" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="521" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: steering works but scales poorly. The field needed a reward as cheap as next-token prediction.</text>
<text x="48" y="578" font-size="15" font-weight="500" fill="#1B2838">One connection: pre-training built the brain. RLHF built the assistant.</text>
</svg>
