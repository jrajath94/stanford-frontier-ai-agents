<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the Pareto frontier</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The frontier is not one model. It is a team, and the specialists are cheap.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT specialization</text>
<text x="410" y="124">the rule: train small, hard</text>
<text x="648" y="124">WITH specialization</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="284" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="184" text-anchor="middle" fill="#1B2838">one general model</text>
<text x="190" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">bug-catching: 90%</text>
<text x="190" y="240" text-anchor="middle" fill="#5C6B7A" font-size="14">$0.02 per call</text>
<text x="190" y="268" text-anchor="middle" fill="#5C6B7A" font-size="14">8 seconds of latency</text>
<text x="190" y="312" text-anchor="middle" fill="#C46B2C" font-size="14">too big, too slow,</text>
<text x="190" y="336" text-anchor="middle" fill="#C46B2C" font-size="14">too expensive per call</text>
<text x="190" y="380" text-anchor="middle" fill="#5C6B7A" font-size="14">cannot be optimal on all</text>
<text x="190" y="404" text-anchor="middle" fill="#5C6B7A" font-size="14">three axes at once</text>
<rect x="348" y="140" width="284" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="490" y="184" text-anchor="middle" fill="#1B2838">train relentlessly</text>
<text x="490" y="208" text-anchor="middle" fill="#1B2838">on one task</text>
<text x="490" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">bug-catching and</text>
<text x="490" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">nothing else</text>
<text x="490" y="324" text-anchor="middle" fill="#1E4D8C" font-size="14">trade generality</text>
<text x="490" y="348" text-anchor="middle" fill="#1E4D8C" font-size="14">for cost and latency</text>
<text x="490" y="392" text-anchor="middle" fill="#5C6B7A" font-size="14">the guest's example:</text>
<text x="490" y="416" text-anchor="middle" fill="#5C6B7A" font-size="14">the Cognition/Windsurf bug check</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">91% at $0.0002,</text>
<text x="780" y="208" text-anchor="middle" fill="#1B2838">1.5 seconds</text>
<text x="780" y="252" text-anchor="middle" fill="#1F7A72" font-size="14">100x cheaper, 5x faster,</text>
<text x="780" y="276" text-anchor="middle" fill="#1F7A72" font-size="14">a point more accurate</text>
<text x="780" y="320" text-anchor="middle" fill="#1B2838">the production pattern:</text>
<text x="780" y="348" text-anchor="middle" fill="#5C6B7A" font-size="14">general orchestrators decide,</text>
<text x="780" y="372" text-anchor="middle" fill="#5C6B7A" font-size="14">fast specialists execute,</text>
<text x="780" y="396" text-anchor="middle" fill="#5C6B7A" font-size="14">proprietary data fills the gaps</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="488" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: spend the expensive intelligence where the task is agentic and multi-step, not everywhere.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">54% of Claude Code sessions get Opus; 10% of chat does. That routing is the frontier as a product decision.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: Windsurf 2.0 is the pattern as a company, with a price tag.</text>
</svg>
