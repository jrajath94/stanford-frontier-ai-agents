<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the tiered eval stack</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Lab evals steer the base models. Enterprise evals steer the specialization layer.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT tiers</text>
<text x="420" y="124">the rule: specialize</text>
<text x="648" y="124">WITH tiers</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="284" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="184" text-anchor="middle" fill="#1B2838">one good for everyone</text>
<text x="190" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">shared benchmarks steer</text>
<text x="190" y="236" text-anchor="middle" fill="#5C6B7A" font-size="14">the base models</text>
<text x="190" y="280" text-anchor="middle" fill="#C46B2C" font-size="14">one hill for every</text>
<text x="190" y="304" text-anchor="middle" fill="#C46B2C" font-size="14">competitor to climb</text>
<text x="190" y="348" text-anchor="middle" fill="#5C6B7A" font-size="14">static benchmarks breed</text>
<text x="190" y="372" text-anchor="middle" fill="#5C6B7A" font-size="14">memorizers, not products</text>
<rect x="348" y="140" width="284" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="490" y="184" text-anchor="middle" fill="#1B2838">optimize against</text>
<text x="490" y="208" text-anchor="middle" fill="#1B2838">your own evals</text>
<text x="490" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">good looks different</text>
<text x="490" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">at every company</text>
<text x="490" y="324" text-anchor="middle" fill="#1E4D8C" font-size="14">your style guide,</text>
<text x="490" y="348" text-anchor="middle" fill="#1E4D8C" font-size="14">your telemetry, your traces</text>
<text x="490" y="392" text-anchor="middle" fill="#5C6B7A" font-size="14">proprietary</text>
<text x="490" y="416" text-anchor="middle" fill="#5C6B7A" font-size="14">by construction</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">JPMorgan's good</text>
<text x="780" y="208" text-anchor="middle" fill="#1B2838">is not Goldman's</text>
<text x="780" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">same base model, two</text>
<text x="780" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">different tier-2 evals,</text>
<text x="780" y="304" text-anchor="middle" fill="#5C6B7A" font-size="14">two different products</text>
<text x="780" y="348" text-anchor="middle" fill="#1F7A72" font-size="14">the general model sets</text>
<text x="780" y="372" text-anchor="middle" fill="#1F7A72" font-size="14">the floor. Specialization</text>
<text x="780" y="396" text-anchor="middle" fill="#1F7A72" font-size="14">sets the ceiling.</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="488" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: the treadmill. Every climb makes the general models stronger and raises the bar for the next hill.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">The defense is proprietary data: nobody else's general model will ever know your traces first.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the specialization layer is defensible because tier-2 evals cannot be copied.</text>
</svg>
