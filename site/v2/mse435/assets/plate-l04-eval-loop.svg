<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Inter, 'Source Sans 3', sans-serif">
<rect width="960" height="520" fill="#F7F4EE"/>
<text x="48" y="60" font-size="30" font-weight="600" fill="#1B2838">The eval loop: define the hill, climb it</text>
<text x="48" y="92" font-size="17" fill="#5C6B7A">RL is the eval-maxing machine. Never train on the eval itself. Shell 3. Source: original, drawn from the session.</text>
<g font-size="15" font-weight="500">
<rect x="48" y="132" width="250" height="150" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="173" y="164" text-anchor="middle" fill="#1B2838" font-size="17" font-weight="600">define the hill</text>
<text x="173" y="192" text-anchor="middle" fill="#5C6B7A" font-size="14">eval: fixed tasks</text>
<text x="173" y="214" text-anchor="middle" fill="#5C6B7A" font-size="14">+ right answers</text>
<text x="173" y="240" text-anchor="middle" fill="#1E4D8C" font-size="14">the guarded asset</text>
<line x1="298" y1="207" x2="334" y2="207" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="334,199 350,207 334,215" fill="#1B2838"/>
<rect x="350" y="132" width="250" height="150" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="475" y="164" text-anchor="middle" fill="#1B2838" font-size="17" font-weight="600">climb the hill</text>
<text x="475" y="192" text-anchor="middle" fill="#5C6B7A" font-size="14">RL training on similar</text>
<text x="475" y="214" text-anchor="middle" fill="#5C6B7A" font-size="14">tasks, different data</text>
<text x="475" y="240" text-anchor="middle" fill="#1F7A72" font-size="14">the eval-maxing machine</text>
<line x1="600" y1="207" x2="636" y2="207" stroke="#1B2838" stroke-width="1.5"/>
<polygon points="636,199 652,207 636,215" fill="#1B2838"/>
<rect x="652" y="132" width="260" height="150" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="782" y="164" text-anchor="middle" fill="#1B2838" font-size="17" font-weight="600">next hill</text>
<text x="782" y="192" text-anchor="middle" fill="#5C6B7A" font-size="14">the eval's flaws are</text>
<text x="782" y="214" text-anchor="middle" fill="#5C6B7A" font-size="14">the next constraint</text>
</g>
<rect x="48" y="316" width="864" height="88" rx="12" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5"/>
<text x="76" y="350" font-size="16" font-weight="600" fill="#1B2838">The trap: training on the eval is overfitting.</text>
<text x="76" y="376" font-size="15" fill="#5C6B7A">Memorizing the test is not learning the skill. Goodhart: the measure becomes the target, then stops measuring.</text>
<rect x="48" y="424" width="864" height="56" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="76" y="458" font-size="16" font-weight="500" fill="#1B2838">Worked: SWE-bench defined the code-model race. Every lab climbed the same hill.</text>
</svg>
