<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: deploying is the scarce step</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Value moved from the artifact to the outcome: running software in front of customers.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="416" y="124">the rule: follow the deploy</text>
<text x="648" y="124">WITH the rule</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="284" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="184" text-anchor="middle" fill="#1B2838">the dead-software pile</text>
<text x="190" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">GitHub holds mountains of code</text>
<text x="190" y="240" text-anchor="middle" fill="#5C6B7A" font-size="14">that never runs anywhere</text>
<text x="190" y="284" text-anchor="middle" fill="#C46B2C" font-size="14">code is inventory:</text>
<text x="190" y="308" text-anchor="middle" fill="#C46B2C" font-size="14">nobody learns from code</text>
<text x="190" y="332" text-anchor="middle" fill="#C46B2C" font-size="14">that never faces a user</text>
<text x="190" y="376" text-anchor="middle" fill="#5C6B7A" font-size="14">humans keep code safe</text>
<text x="190" y="400" text-anchor="middle" fill="#5C6B7A" font-size="14">on a laptop</text>
<rect x="348" y="140" width="284" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="490" y="184" text-anchor="middle" fill="#1B2838">the scarce step is the one</text>
<text x="490" y="208" text-anchor="middle" fill="#1B2838">that puts running software</text>
<text x="490" y="232" text-anchor="middle" fill="#1B2838">in front of a user</text>
<text x="490" y="276" text-anchor="middle" fill="#5C6B7A" font-size="14">writing code does not make</text>
<text x="490" y="304" text-anchor="middle" fill="#5C6B7A" font-size="14">you special. Deploying does.</text>
<text x="490" y="348" text-anchor="middle" fill="#1E4D8C" font-size="14">agents deploy compulsively,</text>
<text x="490" y="372" text-anchor="middle" fill="#1E4D8C" font-size="14">without the human's fear</text>
<text x="490" y="396" text-anchor="middle" fill="#1E4D8C" font-size="14">of the red button</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">write, test, ship, iterate:</text>
<text x="780" y="208" text-anchor="middle" fill="#1B2838">the agent does it all</text>
<text x="780" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">the behavior that made Vercel</text>
<text x="780" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">valuable is the behavior</text>
<text x="780" y="304" text-anchor="middle" fill="#5C6B7A" font-size="14">agents want most</text>
<text x="780" y="348" text-anchor="middle" fill="#1F7A72" font-size="14">build at the deployment</text>
<text x="780" y="372" text-anchor="middle" fill="#1F7A72" font-size="14">and distribution layer,</text>
<text x="780" y="396" text-anchor="middle" fill="#1F7A72" font-size="14">not the generation layer</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="488" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: Amazon Agent Services. When the shippable entity changes, the cloud's primitives get rebuilt.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">EC2 was built for human-written code. The agent era needs the agent's own computer and delivery network.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the learning only starts when a user confronts the running version.</text>
</svg>
