<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the coding-agent ladder</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Each rung moves the unit of work up: from a line, to an answer, to a task, to a project.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT tools</text>
<text x="424" y="124">the rule: give it tools</text>
<text x="648" y="124">WITH tools</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="284" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="184" text-anchor="middle" fill="#1B2838">rung 1: autocomplete</text>
<text x="190" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">a few hundred milliseconds</text>
<text x="190" y="256" text-anchor="middle" fill="#1B2838">rung 2: chat</text>
<text x="190" y="284" text-anchor="middle" fill="#5C6B7A" font-size="14">$0.01 per answer in tokens;</text>
<text x="190" y="308" text-anchor="middle" fill="#5C6B7A" font-size="14">40 answers: $0.40 + 20 minutes</text>
<text x="190" y="332" text-anchor="middle" fill="#5C6B7A" font-size="14">of the human's copy time</text>
<text x="190" y="376" text-anchor="middle" fill="#C46B2C" font-size="14">the human is still the</text>
<text x="190" y="400" text-anchor="middle" fill="#C46B2C" font-size="14">integrator, and the integrator</text>
<text x="190" y="424" text-anchor="middle" fill="#C46B2C" font-size="14">is the bottleneck</text>
<rect x="348" y="140" width="284" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="490" y="184" text-anchor="middle" fill="#1B2838">read files, run tests,</text>
<text x="490" y="208" text-anchor="middle" fill="#1B2838">edit code, open a terminal</text>
<text x="490" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">"fix the failing tests</text>
<text x="490" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">in the auth module"</text>
<text x="490" y="324" text-anchor="middle" fill="#1E4D8C" font-size="14">the model plans the steps,</text>
<text x="490" y="348" text-anchor="middle" fill="#1E4D8C" font-size="14">executes, and adapts</text>
<text x="490" y="372" text-anchor="middle" fill="#1E4D8C" font-size="14">when a step fails</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">rung 3: the agent</text>
<text x="780" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">one finished task:</text>
<text x="780" y="236" text-anchor="middle" fill="#5C6B7A" font-size="14">~500k tokens, $1.80,</text>
<text x="780" y="260" text-anchor="middle" fill="#5C6B7A" font-size="14">10 minutes of review</text>
<text x="780" y="304" text-anchor="middle" fill="#1F7A72" font-size="14">the agent does the doing;</text>
<text x="780" y="328" text-anchor="middle" fill="#1F7A72" font-size="14">the human does the judging</text>
<text x="780" y="372" text-anchor="middle" fill="#1B2838">rung 4: the fleet</text>
<text x="780" y="400" text-anchor="middle" fill="#5C6B7A" font-size="14">many agents, one project;</text>
<text x="780" y="424" text-anchor="middle" fill="#5C6B7A" font-size="14">the constraint is orchestration</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="488" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: each rung trades human integration labor for token spend and orchestration work.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">The fleet flips the economics: the constraint is orchestration, not headcount.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the agent is the entity that ships, so the cloud must be rebuilt around it.</text>
</svg>
