<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="600" fill="#F7F4EE"/>
<text x="48" y="60" font-size="30" font-weight="600" fill="#1B2838">The agentic infrastructure triangle</text>
<text x="48" y="92" font-size="17" fill="#5C6B7A">Three sides, one unit: the agent. Shell 3. Source: original, drawn from the session.</text>
<polygon points="480,140 250,470 710,470" fill="none" stroke="#1B2838" stroke-width="2"/>
<g font-size="15" font-weight="500">
<rect x="64" y="200" width="248" height="128" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="188" y="240" text-anchor="middle" fill="#1B2838" font-size="17" font-weight="600">side 1: FOR agents</text>
<text x="188" y="270" text-anchor="middle" fill="#5C6B7A" font-size="14">deploy agent-written code</text>
<text x="188" y="296" text-anchor="middle" fill="#5C6B7A" font-size="14">domains, CDN, scaling</text>
<rect x="648" y="200" width="248" height="128" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="772" y="240" text-anchor="middle" fill="#1B2838" font-size="17" font-weight="600">side 2: TO BUILD</text>
<text x="772" y="270" text-anchor="middle" fill="#5C6B7A" font-size="14">ship your own agents</text>
<text x="772" y="296" text-anchor="middle" fill="#5C6B7A" font-size="14">support agent: 93%</text>
<rect x="352" y="352" width="256" height="136" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="480" y="392" text-anchor="middle" fill="#1B2838" font-size="17" font-weight="600">side 3: BY agents</text>
<text x="480" y="422" text-anchor="middle" fill="#5C6B7A" font-size="14">the self-driving cloud</text>
<text x="480" y="448" text-anchor="middle" fill="#5C6B7A" font-size="14">Eve fleet: 100+ agents</text>
<text x="480" y="474" text-anchor="middle" fill="#5C6B7A" font-size="14">in production</text>
</g>
<text x="480" y="540" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2838">One claim: the cloud is being rebuilt around the agent as the unit. The triangle is Rauch's product map of that rebuild.</text>
</svg>
