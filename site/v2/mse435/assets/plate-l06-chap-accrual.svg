<text x="190" y="304" text-anchor="middle" fill="#C46B2C" font-size="14">concrete below the hype:</text>
<text x="190" y="328" text-anchor="middle" fill="#C46B2C" font-size="14">nobody prices either</text>
<text x="190" y="372" text-anchor="middle" fill="#5C6B7A" font-size="14">the map is a vibe,</text>
<text x="190" y="396" text-anchor="middle" fill="#5C6B7A" font-size="14">not a number</text>
<rect x="348" y="140" width="284" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="490" y="184" text-anchor="middle" fill="#1B2838">find the bottleneck,</text>
<text x="490" y="208" text-anchor="middle" fill="#1B2838">price the unit,</text>
<text x="490" y="232" text-anchor="middle" fill="#1B2838">follow the margin</text>
<text x="490" y="276" text-anchor="middle" fill="#5C6B7A" font-size="14">name the bottleneck with</text>
<text x="490" y="304" text-anchor="middle" fill="#5C6B7A" font-size="14">a number; price the unit</text>
<text x="490" y="328" text-anchor="middle" fill="#5C6B7A" font-size="14">it gates, in dollars</text>
<text x="490" y="372" text-anchor="middle" fill="#1E4D8C" font-size="14">follow the margin to whoever</text>
<text x="490" y="396" text-anchor="middle" fill="#1E4D8C" font-size="14">collects it, and name</text>
<text x="490" y="420" text-anchor="middle" fill="#1E4D8C" font-size="14">what would move it</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">below the model:</text>
<text x="780" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">the moat: $60B per gigawatt</text>
