<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="488" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: "in 2026" is doing real work. Scarcity moves, bottlenecks move, and the map redraws with them.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Watch the bottleneck, not the layer.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the durable skill is the method, not the 2026 answer.</text>
</svg>
