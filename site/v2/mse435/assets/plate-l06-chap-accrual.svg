<text x="190" y="184" text-anchor="middle" fill="#1B2838">guess the winning layer</text>
<text x="190" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">value is assumed to sit</text>
<text x="190" y="236" text-anchor="middle" fill="#5C6B7A" font-size="14">where the hype sits</text>
