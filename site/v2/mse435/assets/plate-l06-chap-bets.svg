<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: the long/short</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. Both sessions end with picks. Together they are the course's investment summary.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the rule</text>
<text x="420" y="124">the rule: long scarcity</text>
<text x="648" y="124">WITH the rule</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="284" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="184" text-anchor="middle" fill="#1B2838">one bet on the</text>
<text x="190" y="208" text-anchor="middle" fill="#1B2838">whole stack</text>
<text x="190" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">long everything AI,</text>
<text x="190" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">short nothing</text>
<text x="190" y="324" text-anchor="middle" fill="#C46B2C" font-size="14">no bottleneck named,</text>
<text x="190" y="348" text-anchor="middle" fill="#C46B2C" font-size="14">no number attached:</text>
<text x="190" y="372" text-anchor="middle" fill="#C46B2C" font-size="14">a vibe, not a position</text>
<text x="190" y="416" text-anchor="middle" fill="#5C6B7A" font-size="14">rate limits encode guesses</text>
<text x="190" y="440" text-anchor="middle" fill="#5C6B7A" font-size="14">about maximum demand</text>
<rect x="348" y="140" width="284" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="490" y="184" text-anchor="middle" fill="#1B2838">each long names a bottleneck</text>
<text x="490" y="208" text-anchor="middle" fill="#1B2838">with a number</text>
<text x="490" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">each short names a scarcity</text>
<text x="490" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">that AI turns into</text>
<text x="490" y="304" text-anchor="middle" fill="#5C6B7A" font-size="14">a commodity</text>
<text x="490" y="348" text-anchor="middle" fill="#1E4D8C" font-size="14">no more rate limits:</text>
<text x="490" y="372" text-anchor="middle" fill="#1E4D8C" font-size="14">the guesses keep being</text>
<text x="490" y="396" text-anchor="middle" fill="#1E4D8C" font-size="14">wrong in the agent era</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">Rauch long: anyone moving</text>
<text x="780" y="208" text-anchor="middle" fill="#1B2838">at the speed of tokens</text>
<text x="780" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">consumption pricing, instant</text>
<text x="780" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">signup, MCP, CLIs, APIs</text>
<text x="780" y="324" text-anchor="middle" fill="#1B2838">short: static content,</text>
<text x="780" y="348" text-anchor="middle" fill="#1B2838">code-is-scarce builders,</text>
<text x="780" y="372" text-anchor="middle" fill="#1B2838">closed enterprises</text>
<text x="780" y="416" text-anchor="middle" fill="#5C6B7A" font-size="14">Lochmiller: long the buildout,</text>
<text x="780" y="440" text-anchor="middle" fill="#5C6B7A" font-size="14">short the model layer</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="488" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: Meta's Muse Spark. Even the open champion went closed at the frontier in April 2026.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">But open source still takes share: the bulk work, 56% of gateway tokens. The frontier is the priced asset.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: bet on layers where demand grows faster than supply can respond.</text>
</svg>
