<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Anthropic Sans, Inter, 'Source Sans 3', 'IBM Plex Sans', sans-serif">
<rect width="960" height="620" fill="#F7F4EE"/>
<text x="48" y="56" font-size="30" font-weight="600" fill="#1B2838">Chapter plate: EC2 for agents</text>
<text x="48" y="86" font-size="17" fill="#5C6B7A">Chapter plate. The sandbox is an ephemeral computer per agent task, provisioned and destroyed.</text>
<g font-size="18" font-weight="600" fill="#1B2838">
<text x="48" y="124">WITHOUT the sandbox</text>
<text x="404" y="124">the rule: change the unit</text>
<text x="648" y="124">WITH the sandbox</text>
</g>
<g font-size="15" font-weight="500">
<rect x="48" y="140" width="284" height="300" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="184" text-anchor="middle" fill="#1B2838">a computer per credit card</text>
<text x="190" y="212" text-anchor="middle" fill="#5C6B7A" font-size="14">EC2: elastic compute</text>
<text x="190" y="236" text-anchor="middle" fill="#5C6B7A" font-size="14">for human-written code</text>
<text x="190" y="280" text-anchor="middle" fill="#C46B2C" font-size="14">the agent works with no</text>
<text x="190" y="304" text-anchor="middle" fill="#C46B2C" font-size="14">computer of its own:</text>
<text x="190" y="328" text-anchor="middle" fill="#C46B2C" font-size="14">a model, no tools,</text>
<text x="190" y="352" text-anchor="middle" fill="#C46B2C" font-size="14">no place to act</text>
<text x="190" y="396" text-anchor="middle" fill="#5C6B7A" font-size="14">models alone are</text>
<text x="190" y="420" text-anchor="middle" fill="#5C6B7A" font-size="14">hires without laptops</text>
<rect x="348" y="140" width="284" height="300" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="490" y="184" text-anchor="middle" fill="#1B2838">the unit changes:</text>
<text x="490" y="208" text-anchor="middle" fill="#1B2838">from the page</text>
<text x="490" y="232" text-anchor="middle" fill="#1B2838">to the agent</text>
<text x="490" y="276" text-anchor="middle" fill="#5C6B7A" font-size="14">the Docker precedent:</text>
<text x="490" y="304" text-anchor="middle" fill="#5C6B7A" font-size="14">in post-training, models are</text>
<text x="490" y="328" text-anchor="middle" fill="#5C6B7A" font-size="14">handed containers and</text>
<text x="490" y="352" text-anchor="middle" fill="#5C6B7A" font-size="14">learn by doing</text>
<text x="490" y="396" text-anchor="middle" fill="#1E4D8C" font-size="14">giving a model a computer</text>
<text x="490" y="420" text-anchor="middle" fill="#1E4D8C" font-size="14">extracts more capability</text>
<rect x="648" y="140" width="264" height="300" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="2"/>
<text x="780" y="184" text-anchor="middle" fill="#1B2838">an ephemeral computer</text>
<text x="780" y="208" text-anchor="middle" fill="#1B2838">per task</text>
<text x="780" y="252" text-anchor="middle" fill="#5C6B7A" font-size="14">tools pre-installed for</text>
<text x="780" y="280" text-anchor="middle" fill="#5C6B7A" font-size="14">the agent, like IT for</text>
<text x="780" y="304" text-anchor="middle" fill="#5C6B7A" font-size="14">the hire's laptop</text>
<text x="780" y="348" text-anchor="middle" fill="#1F7A72" font-size="14">marginal cost near zero;</text>
<text x="780" y="372" text-anchor="middle" fill="#1F7A72" font-size="14">Vercel tripled in months</text>
<text x="780" y="396" text-anchor="middle" fill="#1F7A72" font-size="14">on existing machinery</text>
</g>
<rect x="48" y="456" width="864" height="72" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="488" text-anchor="middle" font-size="15" fill="#1B2838">Tradeoff: every new sandbox is a new computer on the network, and every new computer is an attack surface.</text>
<text x="480" y="512" text-anchor="middle" font-size="15" fill="#5C6B7A">Sandbox security, isolation, permissions, monitoring, is a product category being born in real time.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One connection: the security must live where the computer is created. Whoever owns the sandbox owns the margin.</text>
</svg>
