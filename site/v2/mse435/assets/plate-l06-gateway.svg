<rect x="48" y="408" width="864" height="104" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/>
<text x="76" y="444" font-size="16" fill="#1B2838"><tspan font-weight="600">Worked margin:</tspan> 1M "thanks"-class requests a day, 20 tokens each: 20M tokens.</text>
<text x="76" y="470" font-size="16" fill="#1B2838">Flagship output at $50/M: $1,000 a day. Small model at $0.50/M: $10 a day.</text>
<text x="76" y="496" font-size="16" fill="#1F7A72" font-weight="600">The gateway keeps $990 a day on politeness alone.</text>
<text x="48" y="566" font-size="16" font-weight="500" fill="#1B2838">One claim: semantic caching stands down 300 GPUs for a trivial request. Routing is the business.</text>
