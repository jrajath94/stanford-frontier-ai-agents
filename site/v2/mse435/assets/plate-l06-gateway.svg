<text x="48" y="60" font-size="30" font-weight="600" fill="#1B2838">The AI gateway: a CDN for tokens</text>
<text x="48" y="92" font-size="17" fill="#5C6B7A">Observe, fail over, cache by meaning, balance. Shell 3. Source: original, drawn from the session.</text>
